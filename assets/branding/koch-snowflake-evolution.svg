<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title">
  <title id="title">Animated Koch snowflake evolution</title>
  <style>
    .mark {
      color: #7c3aed;
    }

    .stage {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation-duration: 4.7s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }

    .star {
      animation-name: evolution-star;
    }

    .koch-one {
      animation-name: evolution-koch-one;
    }

    .koch-two {
      opacity: 1;
      animation-name: evolution-koch-two;
    }

    @keyframes evolution-star {
      0%, 21% {
        opacity: 1;
        transform: scale(1);
      }
      25%, 96% {
        opacity: 0;
        transform: scale(0.97);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes evolution-koch-one {
      0%, 21% {
        opacity: 0;
        transform: scale(0.97);
      }
      25%, 46% {
        opacity: 1;
        transform: scale(1);
      }
      50%, 71% {
        opacity: 0;
        transform: scale(0.97);
      }
      75%, 96% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(0.97);
      }
    }

    @keyframes evolution-koch-two {
      0%, 46% {
        opacity: 0;
        transform: scale(0.97);
      }
      50%, 71% {
        opacity: 1;
        transform: scale(1);
      }
      75%, 100% {
        opacity: 0;
        transform: scale(0.97);
      }
    }

    @media (prefers-color-scheme: dark) {
      .mark {
        color: #a78bfa;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage {
        animation: none;
      }

      .star,
      .koch-one {
        opacity: 0;
      }

      .koch-two {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>

