body:
  - type: markdown
    attributes:
      value: |
        Search the [existing questions](https://github.com/ZzPoLariszZ/obsidian-snowflake-method/discussions/categories/q-a) and the [guide](https://github.com/ZzPoLariszZ/obsidian-snowflake-method#guide) first. Bugs and ideas go to [issues](https://github.com/ZzPoLariszZ/obsidian-snowflake-method/issues/new/choose). English or Chinese are both fine.

        请先搜索[已有的提问](https://github.com/ZzPoLariszZ/obsidian-snowflake-method/discussions/categories/q-a)并查看[指南](https://github.com/ZzPoLariszZ/obsidian-snowflake-method#指南)。问题反馈和功能建议请提交 [issue](https://github.com/ZzPoLariszZ/obsidian-snowflake-method/issues/new/choose)。中文或英文都可以。

  - type: textarea
    id: question
    attributes:
      label: Your question / 你的问题
      description: What you'd like to know / 你想了解什么
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Related area / 相关位置
      description: Pick the closest one / 选择最接近的一项
      options:
        - Dashboard / 工作台
        - Worldbuilding entity / 世界观实体
        - Manuscript stream / 正文流
        - Data statistics / 数据统计
        - Task management / 任务管理
        - Visualization workspace / 可视化工作区
        - File explorer / 文件列表
        - Settings / 设置
        - Other / 其他

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version / 插件版本
      description: Settings › Community plugins / 设置 › 第三方插件
      placeholder: "0.25.1"

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots / 截图
      description: Images that help explain / 有助于说明的图片
