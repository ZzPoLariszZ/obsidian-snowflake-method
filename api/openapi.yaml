          $ref: "#/components/responses/Problem"

  /projects/{projectId}/revisions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listRevisions
      tags: [Revisions]
      summary: List the proposed revisions
      description: |
        Every change proposed to the manuscript and not yet accepted or
        discarded, in reading order. Each says whether the passage it was made
        over still stands where it was.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - name: note
          in: query
          description: Give only revisions on this manuscript note, by its `relativePath`.
          schema:
            type: string
            minLength: 1
        - name: kind
          in: query
          description: Give only revisions of this kind.
          schema:
            $ref: "#/components/schemas/RevisionKind"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The revisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createRevision
      tags: [Revisions]
      summary: Propose a revision
      description: |
        Proposes a change to a passage of a manuscript note without making
        it: other words in place of the passage, new words after it, or its
        removal. It shows beside the text as a card until the author accepts or
        discards it. This is the way to suggest a change and leave the prose to
        the author. A passage that part of another revision already stands over
        is refused. To propose new words at a place with nothing before it, the
        head of a note or an empty one, send the passage as a place where
        `from` and `to` are the same.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, passage-not-found, ambiguous-passage, overlapping-revision]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionCreate"
      responses:
        "201":
          description: The revision that was proposed.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revision"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RevisionId"
    get:
      operationId: getRevision
      tags: [Revisions]
      summary: Get one proposed revision
      description: |
        One proposed change with the passage it was made over.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revision"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateRevision
      tags: [Revisions]
      summary: Change a proposed revision
      description: |
        Changes what a revision proposes or the comment on it. The passage
        it was made over is not changed. A replacement whose proposal is made
        empty becomes a deletion, and the other way about.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/RevisionPatch"
      responses:
        "200":
          description: The revision as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revision"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: discardRevision
      tags: [Revisions]
      summary: Discard a proposed revision
      description: |
        Takes a proposed change away without making it. The manuscript is
        not touched.
      x-snowflake-access: delete
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived]
      responses:
        "204":
          description: The revision is gone.
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/sticky-notes:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listStickyNotes
