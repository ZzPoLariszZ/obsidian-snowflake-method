      summary: Add a beat to an act
      description: |
        Adds a beat to an act, with a name and what it is for, before
        another beat of the act or at its end.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 3 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, invalid-reference]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeatCreate"
      responses:
        "201":
          description: The beat that was made, by its id, and the beat sheet as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeatSheetPartCreated"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/beat-sheets/{beatSheetId}/beats/{beatId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/BeatSheetId"
      - $ref: "#/components/parameters/BeatId"
    patch:
      operationId: updateBeat
      tags: [Beat sheets]
      summary: Change a beat
      description: |
        Changes a beat's name and what it is for, or moves it: into
        another act, or before another beat.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 3 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, invalid-reference]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/BeatPatch"
      responses:
        "200":
          description: The beat sheet as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeatSheet"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteBeat
      tags: [Beat sheets]
      summary: Delete a beat
      description: |
        Takes a beat away with its rows. The scenes they placed stand.
        The act it stood in stands too.
      x-snowflake-access: delete
      x-snowflake-availability: { status: available, round: 3 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived]
      responses:
        "200":
          description: The beat sheet as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeatSheet"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/beat-sheets/{beatSheetId}/rows:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/BeatSheetId"
    post:
      operationId: addBeatRow
      tags: [Beat sheets]
      summary: Add a row to a beat
      description: |
        Writes a row under a beat: a line of the author's own, with the
        scenes that carry the beat.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 3 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, invalid-reference]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeatRowCreate"
      responses:
        "201":
          description: The row that was made, by its id, and the beat sheet as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeatSheetPartCreated"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/beat-sheets/{beatSheetId}/rows/{rowId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/BeatSheetId"
      - $ref: "#/components/parameters/RowId"
    patch:
      operationId: updateBeatRow
      tags: [Beat sheets]
      summary: Change a row of a beat
      description: |
        Changes what a row says, or moves it: under another beat, or
        before another row of its beat.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 3 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, invalid-reference]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/BeatRowPatch"
      responses:
        "200":
          description: The beat sheet as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeatSheet"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteBeatRow
      tags: [Beat sheets]
      summary: Delete a row of a beat
      description: |
        Takes a row off a beat. The scenes it placed are notes of their
        own, and stand.
      x-snowflake-access: delete
      x-snowflake-availability: { status: available, round: 3 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived]
      responses:
        "200":
          description: The beat sheet as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeatSheet"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/beat-sheets/{beatSheetId}/scenes/{sceneId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/BeatSheetId"
      - $ref: "#/components/parameters/SceneId"
    put:
      operationId: placeBeatSheetScene
      tags: [Beat sheets]
      summary: Place a scene on a beat sheet
      description: |
        Puts a scene in a row of a beat sheet. A scene stands in one row
        of a sheet at most, so one already placed is moved.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 3 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, invalid-reference]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenePlacement"
      responses:
        "200":
          description: The beat sheet as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeatSheet"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeBeatSheetScene
      tags: [Beat sheets]
      summary: Take a scene off a beat sheet
      description: |
        Takes a scene out of the row it stands in. The scene note itself
        stands.
      x-snowflake-access: delete
      x-snowflake-availability: { status: available, round: 3 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived]
      responses:
        "200":
          description: The beat sheet as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeatSheet"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/beat-sheet-templates/{beatSheetTemplateId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/BeatSheetTemplateId"
    delete:
      operationId: deleteBeatSheetTemplate
      tags: [Beat sheets]
      summary: Delete a beat sheet template
      description: |
        Takes one of the author's own templates away. The plugin's own
        templates are not the project's to delete, and the sheets made from a
        template stand.
      x-snowflake-access: delete
      x-snowflake-availability: { status: available, round: 3 }
      x-snowflake-tier: advanced
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived]
      responses:
        "204":
          description: The template is gone.
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/freeform-views/{freeformViewId}/steps:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/FreeformViewId"
    post:
      operationId: applyFreeformSteps
      tags: [Freeform]
      summary: Change what stands on a freeform view
      description: |
        Takes a list of steps and makes them all, or none: cards added and
        moved, frames drawn round them, lines drawn between them, things taken
        off. One call is one change, as one gesture is on the author's screen.

        A step the view will not take is told by its place in the call, and
        nothing is written. A card of a note or a record names one the project
        has.

        A `delete` step takes things off the view, and needs the delete level
        as taking a scene off any other board does. Below that level the whole
        call is refused with `access-denied`, which names the step.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 3 }
      x-snowflake-tier: advanced
      x-snowflake-errors: [access-denied, not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, invalid-reference, view-full]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreeformSteps"
      responses:
        "200":
          description: The view as it now stands, and the id each new thing was given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeformStepsResult"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/imports/inspect:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: inspectImport
      tags: [Projects]
      summary: See what another project could bring in
      description: |
        Looks at another project of the vault and says what of it could be
        copied into this one: its steps, characters, scenes, worldbuilding,
        vocabulary, field templates, pictures, manuscript, records and boards.
        Each part is told with how it stands here already: new, a namesake, or a
        copy brought before that is unchanged, updated there or changed here.

        Nothing of either project's notes is written. The plugin may put its own
        record of earlier imports right where the two projects show it to be out
        of date.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 4 }
      x-snowflake-tier: advanced
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, invalid-reference, import-refused]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportSource"
      responses:
        "200":
          description: What the other project has to bring.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportInspection"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/imports:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: runImport
      tags: [Projects]
      summary: Copy things in from another project
      description: |
        Copies the parts named from another project of the vault into this
        one. The other project is left as it was. Whatever a part cannot stand
        without comes with it. The answer says what was brought, what was left
        and why, and which links a copy could not keep.

        A part that fails is told under `failed`, and the rest go on. What lands
        is filed in the history as imported from the other project.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 4 }
      x-snowflake-tier: advanced
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, invalid-reference, import-refused]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRun"
      responses:
        "200":
          description: What was brought over and what was not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReport"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/exports/manuscript:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: exportManuscript
      tags: [Manuscript]
      summary: Export the manuscript to a file
      description: |
        Writes the manuscript, or one of its notes, as plain text or
        Markdown into the folder the author keeps exports in, or a folder below
        it. What the call leaves out is taken from the author's own export
        settings. The manuscript itself is not changed.

        A file that already stands where one would be written is left alone and
        the call refused, unless it says `overwrite`.

        Nothing is written into the folder of a project, this one or another.
        The files go under the project's own name, so a `folder` that holds
        the projects themselves is refused where a file would land in one.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 4 }
      x-snowflake-tier: advanced
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, path-conflict]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManuscriptExport"
      responses:
        "200":
          description: The files that were written, each by its path in the vault.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResult"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/exports/canvas:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: exportCanvas
      tags: [Freeform]
      summary: Export a board as an Obsidian canvas
      description: |
        Writes a freeform view, a view of the timelines or a beat sheet as
        a canvas file Obsidian opens by itself, beside the board's own file
        inside the project. A canvas that says the same already is left as it
        is, however the author has laid it out since. One that says something
        else is written over only where the call says `overwrite`.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 4 }
      x-snowflake-tier: advanced
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, invalid-reference, path-conflict]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanvasExport"
      responses:
        "200":
          description: The canvas that was written, by its path in the vault.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResult"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/members/{memberId}/gallery:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/MemberId"
    post:
      operationId: addGalleryPictures
      tags: [Members]
      summary: Add pictures to a note's gallery
      description: |
        Puts pictures that already stand in the vault into the gallery of
        a character, a scene or a worldbuilding note. Each is named by its path
        in the vault and is copied into the gallery folder of the note's kind. A
        picture that already stands in that folder is linked where it is. Put a
        picture into the vault first, with Obsidian's own command line or any
        other way.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 4 }
      x-snowflake-tier: advanced
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, invalid-reference]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GalleryAdd"
      responses:
        "200":
          description: The gallery as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gallery"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/members/{memberId}/gallery/{picturePath}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/MemberId"
      - $ref: "#/components/parameters/PicturePath"
    delete:
      operationId: removeGalleryPicture
      tags: [Members]
      summary: Take a picture out of a note's gallery
      description: |
        Takes one picture out of a note's gallery, and sends its file to
        the trash where it stands in a gallery folder and no other note shows
        it. A picture that stands elsewhere in the vault is only taken off the
        gallery.
      x-snowflake-access: delete
      x-snowflake-availability: { status: available, round: 4 }
      x-snowflake-tier: advanced
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived]
      responses:
        "200":
          description: The gallery as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gallery"
        default:
          $ref: "#/components/responses/Problem"

  /settings:
    get:
      operationId: getSettings
      tags: [Service]
      summary: Read the plugin's settings
      description: |
        The author's settings that change what the API answers: how writing
        is counted, the chapter numbering rule, the daily goals, the marks
        dialogue is read by and the words the author watches for. With them,
        what a session and an export fall back on where a call leaves something
        out. Nothing of how the plugin looks is told, nothing of this device's
        own, and nothing of the API's own access.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 5 }
      x-snowflake-tier: extended
      x-snowflake-errors: []
      responses:
        "200":
          description: The settings as they stand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateSettings
      tags: [Service]
      summary: Change the plugin's settings
      description: |
        Changes a few of the settings `getSettings` tells: how writing is
        counted, the daily goals, which notes a session's words are counted in,
        and the words the author watches for. They are the author's own, for
        every project of the vault, so this is asked for with care. The rest are
        the author's to set in the plugin's settings.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 5 }
      x-snowflake-tier: advanced
      x-snowflake-errors: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: The settings as they now stand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/mentions/ignores:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listMentionIgnores
      tags: [Mentions]
      summary: List the mentions the author set aside
      description: |
        The words the author told the plugin not to mark as a mention of
        a note. A rule holds for the whole manuscript, for one manuscript note,
        or for one place in a note. Each is told by an `id` worked out from what
        it says, so the same rule has the same `id` for as long as it stands.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 5 }
      x-snowflake-tier: advanced
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The rules there are.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentionIgnoreList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: addMentionIgnore
      tags: [Mentions]
      summary: Set a mention aside
      description: |
        Tells the plugin that some words are not a mention of a note: in
        the whole manuscript, in one manuscript note, or at one place in a note.
        The words are given as `listNoteMentions` tells them, letter for letter.
        A rule that already stands is left as it is.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 5 }
      x-snowflake-tier: advanced
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, invalid-reference]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MentionIgnoreCreate"
      responses:
        "201":
          description: The rule by its id, and the rules there now are.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentionIgnoreAdded"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/mentions/ignores/{ignoreId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/IgnoreId"
    delete:
      operationId: removeMentionIgnore
      tags: [Mentions]
      summary: Bring back a mention set aside
      description: |
        Takes one such rule away, so the words are marked as a mention
        again. The rule is named by the id `listMentionIgnores` gives.
      x-snowflake-access: delete
      x-snowflake-availability: { status: available, round: 5 }
      x-snowflake-tier: advanced
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived]
      responses:
        "204":
          description: The rule is gone.
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/writing/session/stop:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: stopWritingSession
      tags: [Writing sessions]
      summary: Stop the writing session
      description: |
        Ends the session under way on a project and files it with the
        day's writing. Where none runs on this project there is nothing to stop,
        and the answer says so by its `session` being null. A session that runs
        on another project is left running.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 5 }
      x-snowflake-tier: advanced
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived]
      responses:
        "200":
          description: The day as it stands with the session filed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WritingSession"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        The access token from the plugin's settings, under Local API. It is
        made on this computer and never leaves it.

  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        The `etag` of the note as you last read it, in quotes or without. The
        change is made only if the note still stands at that version.
      schema:
        type: string
        minLength: 1
    ProjectId:
      name: projectId
      in: path
      required: true
      description: A project's `id`, as `listProjects` gives it.
      schema:
        type: string
        minLength: 1
    StepNumber:
      name: step
      in: path
      required: true
      description: A step's number, 1 to 10.
      schema:
        type: integer
        minimum: 1
        maximum: 10
    KindId:
      name: kindId
      in: path
      required: true
      description: |
        A kind's `id`: `character`, `scene`, one of the built-in worldbuilding
        kinds `time`, `location` and `item`, or the name of a kind the author
        made. `listKinds` gives the ids there are.
      schema:
        type: string
        minLength: 1
    CharacterId:
      name: characterId
      in: path
      required: true
      description: A character's `id`, as `listCharacters` or `listMembers` gives it.
      schema:
        type: string
        minLength: 1
    SceneId:
      name: sceneId
      in: path
      required: true
      description: A scene's `id`, as `listScenes` or `listMembers` gives it.
      schema:
        type: string
        minLength: 1
    EntityId:
      name: entityId
      in: path
      required: true
      description: A worldbuilding note's `id`, as `listEntities` or `listMembers` gives it.
      schema:
        type: string
        minLength: 1
    Vocabulary:
      name: vocabulary
      in: path
      required: true
      description: Which vocabulary.
      schema:
        $ref: "#/components/schemas/VocabularyId"
    TaxonomyPath:
      name: taxonomyPath
      in: path
      required: true
      description: |
        A word's path in its tree, such as `Race/Elf`, percent-encoded into
        one step of the address.
      schema:
        type: string
        minLength: 1
    TemplateName:
      name: templateName
      in: path
      required: true
      description: A field template's name, as `listFieldTemplates` gives it.
      schema:
        type: string
        minLength: 1
    TaskId:
      name: taskId
      in: path
      required: true
      description: A task's `id`, as `listTasks` gives it.
      schema:
        type: string
        minLength: 1
    ForeshadowingId:
      name: foreshadowingId
      in: path
      required: true
      description: A foreshadowing thread's `id`, as `listForeshadowing` gives it.
      schema:
        type: string
        minLength: 1
    RevisionId:
      name: revisionId
      in: path
      required: true
      description: A revision's `id`, as `listRevisions` gives it.
      schema:
        type: string
        minLength: 1
    StickyNoteId:
      name: stickyNoteId
      in: path
      required: true
      description: A sticky note's `id`, as `listStickyNotes` gives it.
      schema:
        type: string
        minLength: 1
    ArchiveState:
      name: state
      in: query
      description: Whether to give what is in use, what was set aside in the archive, or both.
      schema:
        type: string
        enum: [active, archived, all]
        default: active
    BeatSheetId:
      name: beatSheetId
      in: path
      required: true
      description: A beat sheet's `id`, as `listBeatSheets` gives it.
      schema:
        type: string
        minLength: 1
    FreeformViewId:
      name: freeformViewId
      in: path
      required: true
      description: A freeform view's `id`, as `listFreeformViews` gives it.
      schema:
        type: string
        minLength: 1
    MemberId:
      name: memberId
      in: path
      required: true
      description: The `id` of a character, a scene or a worldbuilding note, as `listMembers` gives it.
      schema:
        type: string
        minLength: 1
    OccurrenceId:
      name: occurrenceId
      in: path
      required: true
      description: The `id` of one place a thread appears, as the thread gives it.
      schema:
        type: string
        minLength: 1
    TimelineId:
      name: timelineId
      in: path
      required: true
      description: "The `id` of a timeline, as `getTimeline` gives it."
      schema:
        type: string
        minLength: 1
    TimelineViewId:
      name: timelineViewId
      in: path
      required: true
      description: "The `id` of a view of the timelines, as `getTimeline` gives it."
      schema:
        type: string
        minLength: 1
    TimeId:
      name: timeId
      in: path
      required: true
      description: "The `id` of one of the project's time notes."
      schema:
        type: string
        minLength: 1
    RowId:
      name: rowId
      in: path
      required: true
      description: "The `id` of a row, as the board it stands on gives it."
      schema:
        type: string
        minLength: 1
    ActId:
      name: actId
      in: path
      required: true
      description: "The `id` of an act, as the beat sheet gives it."
      schema:
        type: string
        minLength: 1
    BeatId:
      name: beatId
      in: path
      required: true
      description: "The `id` of a beat, as the beat sheet gives it."
      schema:
        type: string
        minLength: 1
    BeatSheetTemplateId:
      name: beatSheetTemplateId
      in: path
      required: true
      description: "The `id` of a template, as `listBeatSheetTemplates` gives it."
      schema:
        type: string
        minLength: 1
    PicturePath:
      name: picturePath
      in: path
      required: true
      description: "A picture of the gallery by its path in the vault, percent-encoded into one segment."
      schema:
        type: string
        minLength: 1
    IgnoreId:
      name: ignoreId
      in: path
      required: true
      description: "The `id` of a rule, as `listMentionIgnores` gives it."
      schema:
        type: string
        minLength: 1
    NotePath:
      name: notePath
      in: path
      required: true
      description: |
        A manuscript note's `relativePath`, as `listManuscriptNotes` gives it:
        where the note stands inside the project, folder and ending included,
        percent-encoded into one step of the address
        (`50_Manuscript%2FChapter%201.md`).
      schema:
        type: string
        minLength: 1
    View:
      name: view
      in: query
      description: |
        How much of each item to give. `summary` leaves out the long text,
        the record lines and the added fields. `full` gives everything, at
        most 100 items to an answer.
      schema:
        type: string
        enum: [summary, full]
        default: summary
    NameQuery:
      name: q
      in: query
      description: Give only items whose name, title or other names contain these words, whatever their case.
      schema:
        type: string
        minLength: 1
    ProgressFilter:
      name: progressStatus
      in: query
      description: Give only items the author has marked with this progress.
      schema:
        $ref: "#/components/schemas/ProgressStatus"
    Offset:
      name: offset
      in: query
      description: How many items to pass over before the first one given.
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      description: The most items to give in one answer.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100

  headers:
    Location:
      description: The address of what was made, under the base path.
      schema:
        type: string
    ETag:
      description: |
        The version of the note the answer describes, in quotes. The same
        value stands in the body as `etag`, without them.
      schema:
        type: string

  responses:
    Problem:
      description: |
        The call was refused or failed. The `code` says why, and
        `x-snowflake-problems` lists every code with its status.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: |
        An error, in the shape of RFC 9457. Some codes add members of their
        own, such as `currentEtag` on a `concurrent-change`.
      required: [type, title, status, code]
      additionalProperties: true
      properties:
        type:
          type: string
          description: |
            The kind of problem, `/problems/` followed by the code. It is a
            name, not an address to open.
        title:
          type: string
          description: The problem in a few words. It may be reworded between versions.
        status:
          type: integer
          description: The HTTP status, repeated for callers that have no status line.
        code:
          type: string
          description: The stable name of the problem. Branch on this.
        detail:
          type: string
          description: What went wrong in this call. It may be reworded between versions.
        errors:
          type: array
          description: Each part of the call that did not match the contract.
          items:
            $ref: "#/components/schemas/ProblemIssue"
        currentEtag:
          type: string
          description: The note's `etag` as it stands now, on a `concurrent-change`.

    ProblemIssue:
      type: object
      required: [pointer, detail]
      additionalProperties: false
      properties:
        pointer:
          type: string
          description: |
            Where the fault is. A JSON Pointer into the body, or `params/`
            followed by a parameter's name.
        detail:
          type: string
          description: What is wrong there.

    ApiRoot:
      type: object
      required: [service, contract, authenticated]
      additionalProperties: false
      properties:
        service:
          type: string
          const: snowflake-method
          description: The plugin that answers here.
        contract:
          type: string
          description: The version of this contract, as in the document's own `info.version`.
        authenticated:
          type: boolean
          description: Whether the call carried a valid token. Everything below is given only then.
        plugin:
          type: object
          required: [id, version]
          additionalProperties: false
          properties:
            id:
              type: string
            version:
              type: string
        vault:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              description: The name of the vault this Obsidian window has open.
        access:
          $ref: "#/components/schemas/AccessLevel"
        canRename:
          type: boolean
          description: |
            Whether something can be given another name through the API. False
            while Obsidian is set to ask before it updates links, when every
            such change is refused with `link-updates-ask`.
        projectsRoot:
          type: string
          description: |
            The folder the author keeps projects in, as a path in the vault.
            Empty when that is the vault's own top folder.
        limits:
          $ref: "#/components/schemas/Limits"

    AccessLevel:
      type: string
      enum: [read, write, delete]
      description: |
        How far the author lets callers go. `read` only reads. `write` also
        creates and changes. `delete` also deletes.

    Limits:
      type: object
      required: [bodyBytes, bridgeBytes, pageSize, maxPageSize]
      additionalProperties: false
      properties:
        bodyBytes:
          type: integer
          description: The largest body a call may carry over HTTP, in bytes.
        bridgeBytes:
          type: integer
          description: |
            The largest `params` and `body` together that a call may carry
            through Obsidian's command line, in bytes. Send longer text over HTTP.
        pageSize:
          type: integer
          description: How many items a list gives when the call names no `limit`.
        maxPageSize:
          type: integer
          description: The most items a list gives in one answer.

    Readiness:
      type: object
      required: [ready]
      additionalProperties: false
      properties:
        ready:
          type: boolean
          const: true

    Language:
      type: string
      enum: [en, zh-CN, zh-TW, ja, ko, fr, de, es]
      description: |
        The language a project is written in. It names the project's folders
        and files and heads its notes, and cannot be changed once the project
        is made.

    Series:
      type: object
      description: The series a project is a book of.
      required: [name, book]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: The name the books of the series share.
        book:
          type: [integer, "null"]
          minimum: 1
          description: The book's number in the series, where the author gave one.

    ProjectSummary:
      type: object
      required: [id, title, language, path, metadataPath, series, readOnly, archived, current]
      additionalProperties: false
      properties:
        id:
          type: string
          description: The project's stable id. It does not change when the project is renamed or moved.
        title:
          type: string
          description: The project's name, which is also the name of its folder.
        language:
          $ref: "#/components/schemas/Language"
        path:
          type: string
          description: The project's folder, as a path in the vault. It changes when the project is renamed or archived.
        metadataPath:
          type: string
          description: The note that holds the project's own properties, as a path in the vault.
        series:
          oneOf:
            - $ref: "#/components/schemas/Series"
            - type: "null"
        readOnly:
          type: boolean
          description: |
            True where a newer version of the plugin wrote the project. This
            one can read it and may not change it.
        archived:
          type: boolean
          description: True where the project stands in the archive folder. It can be read, and restored, and nothing else.
        current:
          type: boolean
          description: True for the project the author last worked in, in Obsidian.

    ProjectPage:
      type: object
      required: [items, total, offset, limit, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
        total:
          type: integer
          description: How many items there are in all.
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]
          description: The `offset` that gives the next items, or null where these are the last.

    Project:
      type: object
      required:
        - id
        - title
        - language
        - path
        - metadataPath
        - series
        - readOnly
        - archived
        - current
        - schemaVersion
        - steps
        - progress
        - counts
        - manuscript
        - health
        - folders
      additionalProperties: false
      properties:
        id:
          type: string
          description: The project's stable id. It does not change when the project is renamed or moved.
        title:
          type: string
          description: The project's name, which is also the name of its folder.
        language:
          $ref: "#/components/schemas/Language"
        path:
          type: string
          description: The project's folder, as a path in the vault. It changes when the project is renamed or archived.
        metadataPath:
          type: string
          description: The note that holds the project's own properties, as a path in the vault.
        series:
          oneOf:
            - $ref: "#/components/schemas/Series"
            - type: "null"
        readOnly:
          type: boolean
          description: |
            True where a newer version of the plugin wrote the project or one
            of its notes. This one can read it and may not change it.
        archived:
          type: boolean
          description: True where the project stands in the archive folder. It can be read, and restored, and nothing else.
        current:
          type: boolean
          description: True for the project the author last worked in, in Obsidian.
        schemaVersion:
          type: [integer, "null"]
          description: The version of the plugin's own format the project is written in.
        steps:
          type: array
          description: The ten steps, in order.
          minItems: 10
          maxItems: 10
          items:
            $ref: "#/components/schemas/Step"
        progress:
          $ref: "#/components/schemas/Progress"
        counts:
          type: object
          required: [characters, scenes, entities]
          additionalProperties: false
          properties:
            characters:
              type: integer
            scenes:
              type: integer
            entities:
              type: integer
              description: Worldbuilding notes of every kind together.
        manuscript:
          type: object
          required: [firstNotePath]
          additionalProperties: false
          properties:
            firstNotePath:
              type: [string, "null"]
              description: The note the manuscript begins with, as a path in the vault. Null where there is none yet.
        health:
          type: object
          description: How many issues `getProjectHealth` would list.
          required: [status, blocking, advisory]
          additionalProperties: false
          properties:
            status:
              $ref: "#/components/schemas/HealthStatus"
            blocking:
              type: integer
            advisory:
              type: integer
        folders:
          type: object
          description: |
            Where each of the project's folders stands, as paths in the vault,
            under names that are the same in every language. Hand one to
            Obsidian's own command line to search or list it. A folder for a
            tool the author has not used yet may not exist.
          required:
            - system
            - summaries
            - characters
            - synopses
            - scenes
            - draft
            - worldbuilding
            - materials
            - archive
          additionalProperties:
            type: string
          properties:
            system:
              type: string
            summaries:
              type: string
              description: Steps 1 and 2.
            characters:
              type: string
            synopses:
              type: string
              description: Steps 4 and 6.
            scenes:
              type: string
            draft:
              type: string
              description: The manuscript.
            worldbuilding:
              type: string
            materials:
              type: string
            archive:
              type: string

    Progress:
      type: object
      description: How many of the ten steps are done. Step 9 counts as done when it is skipped.
      required: [completed, total, percent]
      additionalProperties: false
      properties:
        completed:
          type: integer
        total:
          type: integer
        percent:
          type: integer

    StepStatus:
      type: string
      enum: [not-started, in-progress, in-revision, complete, skipped]
      description: |
        Where a step stands. `in-revision` is a finished step taken up again.
        Only step 9, which is optional, can be `skipped`.

    Step:
      type: object
      required: [id, name, status, optional, dependencies, needsReview, textEditable, path, allowedStatuses]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 10
        name:
          type: string
          enum:
            - one-sentence-summary
            - one-paragraph-summary
            - character-sheets
            - plot-synopsis
            - character-synopses
            - long-synopsis
            - character-profiles
            - scene-list
            - scene-planning
            - manuscript
          description: What the step produces, in words that are the same in every language.
        status:
          $ref: "#/components/schemas/StepStatus"
        optional:
          type: boolean
          description: True for step 9 only.
        dependencies:
          type: array
          description: The steps that must be done before this one can be.
          items:
            type: integer
        needsReview:
          type: boolean
          description: |
            True where a step this one builds on has changed since the author
            last looked. Nothing is wrong. The step may want another look.
        textEditable:
          type: boolean
          description: True for steps 1, 2, 4 and 6, whose text `getStepText` reads.
        path:
          type: [string, "null"]
          description: |
            The step's own note, as a path in the vault, for steps 1, 2, 4 and
            6. For step 10, the note the manuscript begins with. Null for the
            steps written in character and scene notes.
        allowedStatuses:
          type: array
          description: The statuses this step may be given.
          items:
            $ref: "#/components/schemas/StepStatus"

    StepList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 10
          maxItems: 10
          items:
            $ref: "#/components/schemas/Step"

    StepText:
      type: object
      required: [step, path, etag, readOnly, damaged, sections]
      additionalProperties: false
      properties:
        step:
          type: integer
          enum: [1, 2, 4, 6]
        path:
          type: string
          description: The step's note, as a path in the vault.
        etag:
          type: string
          description: The version of the note. Send it in `If-Match` to change the text.
        readOnly:
          type: boolean
        damaged:
          type: boolean
          description: |
            True where a section's markers in the note are missing or broken.
            Such a section reads as empty and cannot be written until the
            project is repaired.
        sections:
          type: object
          description: |
            The text of each section, under the section's id. Step 1 has
            `genre`, `audience-reason-1`, `one-sentence-summary` and
            `candidate-title-1` to `candidate-title-6`. Step 2 has
            `one-paragraph-summary` and `description`. Step 4 has
            `plot-synopsis`. Step 6 has `long-synopsis`.
          additionalProperties:
            type: string

    HealthStatus:
      type: string
      enum: [ok, advisory, blocking]
      description: |
        `ok` where nothing is wrong. `advisory` where there is only tidying
        the plugin offers to do. `blocking` where something is damaged.

    ProjectHealth:
      type: object
      required: [status, readOnly, outdatedNotes, issues]
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        readOnly:
          type: boolean
        outdatedNotes:
          type: integer
          description: How many notes were written by an older version of the plugin and not brought up to date since.
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ProjectIssue"

    ProjectIssue:
      type: object
      required: [code, path, steps, blocking, repairable]
      additionalProperties: false
      properties:
        code:
          type: string
          description: |
            What is wrong, as a stable name: `missing-directory`,
            `missing-artifact`, `dangling-record-link`,
            `duplicate-manuscript-sequence` and the like.
        path:
          type: string
          description: The note or folder the issue is about, as a path in the vault.
        steps:
          type: array
          description: The steps whose work the issue touches.
          items:
            type: integer
        field:
          type: string
          description: The property the issue is about, where it is about one.
        expected:
          type: string
          description: The one value the issue expected to find, where there is one.
        names:
          type: array
          description: What the issue found, one entry each.
          items:
            type: string
        blocking:
          type: boolean
          description: True for damage. False for tidying the plugin only offers.
        repairable:
          type: boolean
          description: True where the plugin can put it right without losing anything the author wrote.

    ProgressStatus:
      type: string
      enum: [not-started, in-progress, in-revision, complete]
      description: How far along the author marks one note.

    CharacterRole:
      type: string
      enum: [major, supporting, minor]
      description: How large a part a character plays.

    Color:
      type: string
      enum: [macaron-1, macaron-2, macaron-3, macaron-4, macaron-5, macaron-6, macaron-7, macaron-8]
      description: One of the eight tints a note's card can wear.

    VocabularyId:
      type: string
      enum: [category, world-status, relationship]

    MemberRef:
      type: object
      description: |
        Another note of the project that this one points at. While the note
        is there, `resolved` is true and `kind` and `id` say which it is.
        Once it is gone, `resolved` is false, `path` is null, and `name` is
        what is left of it. A note that pointed at it by a link then has
        nothing more to tell, so `kind` and `id` are null. A task or a
        foreshadowing thread, which keep the id, still give both.
      required: [kind, id, name, path, resolved]
      additionalProperties: false
      properties:
        kind:
          type: [string, "null"]
          description: "`character`, `scene`, or the `id` of a worldbuilding kind."
        id:
          type: [string, "null"]
        name:
          type: string
        path:
          type: [string, "null"]
          description: The note, as a path in the vault.
        resolved:
          type: boolean

    Term:
      description: What a field or a clause names. Either a note of the project, or plain words.
      oneOf:
        - $ref: "#/components/schemas/MemberRef"
        - type: object
          required: [text]
          additionalProperties: false
          properties:
            text:
              type: string

    RecordClause:
      description: |
        One thing a record line says beside its text. `target` is who a
        relationship is with. `at` is a place, `when` a time, `with` anyone
        else. `span` is an older way to say a period and is only ever read.
      oneOf:
        - type: object
          required: [kind, term]
          additionalProperties: false
          properties:
            kind:
              type: string
              enum: [target, at, when, with]
            term:
              $ref: "#/components/schemas/Term"
        - type: object
          required: [kind, start, end]
          additionalProperties: false
          properties:
            kind:
              type: string
              const: span
            start:
              $ref: "#/components/schemas/Term"
            end:
              $ref: "#/components/schemas/Term"

    RecordLine:
      type: object
      description: |
        One line a note keeps about how it stands in the world, or with
        another note. The `label` is a word of the note's own kind's
        vocabulary (`world-status` or `relationship`), and the `text` is what
        the author wrote under it.
      required: [label, labelPath, text, clauses]
      additionalProperties: false
      properties:
        label:
          type: string
          description: The word's path in its vocabulary tree, such as `Mood/Calm`.
        labelPath:
          type: [string, "null"]
          description: The note of that word, as a path in the vault.
        text:
          type: string
        clauses:
          type: array
          items:
            $ref: "#/components/schemas/RecordClause"

    CustomField:
      type: object
      description: A field the author added to a note, with a title of their own.
      required: [title, content]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string

    Member:
      type: object
      required: [kind, id, name, path, aliases]
      additionalProperties: false
      properties:
        kind:
          type: string
          description: "`character`, `scene`, or the `id` of a worldbuilding kind."
        id:
          type: string
        name:
          type: string
          description: The note's name. For a scene, its title.
        path:
          type: string
          description: The note, as a path in the vault.
        aliases:
          type: array
          description: Other names the note goes by.
          items:
            type: string

    MemberPage:
      type: object
      required: [items, total, offset, limit, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]

    Character:
      type: object
      description: |
        A character. The properties up to `oneSentenceStoryline` are always
        given. The rest are given when one character is read, and in a list
        only with `view=full`.
      required:
        - kind
        - id
        - name
        - path
        - etag
        - index
        - readOnly
        - damaged
        - needsMigration
        - role
        - progressStatus
        - aliases
        - categories
        - color
        - oneSentenceStoryline
      additionalProperties: false
      properties:
        kind:
          type: string
          const: character
        id:
          type: string
          description: The character's stable id. It does not change when the character is renamed.
        name:
          type: string
        path:
          type: string
          description: The character's note, as a path in the vault. It changes when the character is renamed.
        etag:
          type: string
          description: The version of the note. Send it in `If-Match` to change or delete the character.
        index:
          type: integer
          description: The character's place in the author's order, from 0.
        readOnly:
          type: boolean
          description: True where a newer version of the plugin wrote the note.
        damaged:
          type: boolean
          description: |
            True where a section's markers in the note are missing or broken.
            The note cannot be written until the project is repaired.
        needsMigration:
          type: boolean
          description: True where an older version of the plugin wrote the note and it was not brought up to date since.
        role:
          oneOf:
            - $ref: "#/components/schemas/CharacterRole"
            - type: "null"
        progressStatus:
          oneOf:
            - $ref: "#/components/schemas/ProgressStatus"
            - type: "null"
        aliases:
          type: array
          description: Other names the character goes by, which the manuscript may use.
          items:
            type: string
        categories:
          type: array
          description: The words of the `category` vocabulary the character is sorted under, each by its path in the tree.
          items:
            type: string
        color:
          oneOf:
            - $ref: "#/components/schemas/Color"
            - type: "null"
        oneSentenceStoryline:
          type: string
          description: Step 3. The character's storyline in one sentence.
        motivation:
          type: string
          description: Step 3. What the character wants in the abstract.
        goal:
          type: string
          description: Step 3. What the character wants in the concrete.
        conflict:
          type: string
          description: Step 3. What stands in the way.
        growth:
          type: string
          description: Step 3. How the character changes.
        oneParagraphStoryline:
          type: string
          description: Step 3. The character's storyline in one paragraph.
        characterSynopsis:
          type: string
          description: Step 5. The story as this character lives it.
        characterProfile:
          type: string
          description: Step 7. Everything there is to know about the character.
        worldStatus:
          type: array
          items:
            $ref: "#/components/schemas/RecordLine"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/RecordLine"
        unrecognizedWorldStatus:
          type: array
          description: Lines of the note's world status that are not record lines, kept as written.
          items:
            type: string
        unrecognizedRelationships:
          type: array
          description: Lines of the note's relationships that are not record lines, kept as written.
          items:
            type: string
        customFields:
          type: array
          items:
            $ref: "#/components/schemas/CustomField"
        gallery:
          type: array
          description: The note's pictures, each as the link the note stores.
          items:
            type: string
        galleryMain:
          type: [string, "null"]
          description: The picture shown first, one of `gallery`.

    CharacterPage:
      type: object
      required: [items, total, offset, limit, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Character"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]

    PointOfView:
      description: |
        Whose eyes a scene is seen through. Null where the author has not
        said. Otherwise all-knowing, several characters in turn, or one
        character.
      oneOf:
        - type: "null"
        - type: object
          required: [mode]
          additionalProperties: false
          properties:
            mode:
              type: string
              enum: [omniscient, multiple]
        - type: object
          required: [mode, character]
          additionalProperties: false
          properties:
            mode:
              type: string
              const: character
            character:
              $ref: "#/components/schemas/MemberRef"

    ManuscriptLink:
      type: object
      required: [link, path]
      additionalProperties: false
      properties:
        link:
          type: string
          description: The link as the scene's note stores it, with any heading it points at.
        path:
          type: [string, "null"]
          description: The manuscript note the link leads to, as a path in the vault. Null where it leads nowhere.

    Scene:
      type: object
      description: |
        A scene. The properties up to `conflict` are always given. The rest
        are given when one scene is read, and in a list only with `view=full`.
      required:
        - kind
        - id
        - title
        - path
        - etag
        - index
        - readOnly
        - damaged
        - needsMigration
        - progressStatus
        - aliases
        - categories
        - color
        - pov
        - conflict
      additionalProperties: false
      properties:
        kind:
          type: string
          const: scene
        id:
          type: string
          description: The scene's stable id. It does not change when the scene is renamed.
        title:
          type: string
        path:
          type: string
          description: The scene's note, as a path in the vault. It changes when the scene is renamed.
        etag:
          type: string
          description: The version of the note. Send it in `If-Match` to change or delete the scene.
        index:
          type: integer
          description: The scene's place in the scene list, from 0.
        readOnly:
          type: boolean
        damaged:
          type: boolean
        needsMigration:
          type: boolean
        progressStatus:
          oneOf:
            - $ref: "#/components/schemas/ProgressStatus"
            - type: "null"
        aliases:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            type: string
        color:
          oneOf:
            - $ref: "#/components/schemas/Color"
            - type: "null"
        pov:
          $ref: "#/components/schemas/PointOfView"
        conflict:
          type: string
          description: Step 8. What is at odds in the scene.
        characters:
          type: array
          description: Who is in the scene, in the order of the character list.
          items:
            $ref: "#/components/schemas/MemberRef"
        times:
          type: array
          description: When the scene happens.
          items:
            $ref: "#/components/schemas/Term"
        locations:
          type: array
          description: Where the scene happens.
          items:
            $ref: "#/components/schemas/Term"
        events:
          type: string
          description: Step 8. What happens in the scene.
        planning:
          type: string
          description: Step 9. The scene planned out before it is written.
        linkedManuscript:
          type: array
          description: The manuscript notes the scene is written in.
          items:
            $ref: "#/components/schemas/ManuscriptLink"
        worldStatus:
          type: array
          items:
            $ref: "#/components/schemas/RecordLine"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/RecordLine"
        unrecognizedWorldStatus:
          type: array
          items:
            type: string
        unrecognizedRelationships:
          type: array
          items:
            type: string
        customFields:
          type: array
          items:
            $ref: "#/components/schemas/CustomField"
        gallery:
          type: array
          items:
            type: string
        galleryMain:
          type: [string, "null"]

    ScenePage:
      type: object
      required: [items, total, offset, limit, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Scene"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]

    EntityTime:
      description: |
        When a time is: one moment, or a period between two others. Null for
        a note of any kind but `time`.
      oneOf:
        - type: "null"
        - type: object
          required: [kind, start, end]
          additionalProperties: false
          properties:
            kind:
              type: [string, "null"]
              enum: [point, period, null]
            start:
              oneOf:
                - $ref: "#/components/schemas/Term"
                - type: "null"
            end:
              oneOf:
                - $ref: "#/components/schemas/Term"
                - type: "null"

    Entity:
      type: object
      description: |
        A worldbuilding note. The properties up to `time` are always given.
        The rest are given when one note is read, and in a list only with
        `view=full`.
      required:
        - kind
        - id
        - name
        - path
        - etag
        - index
        - readOnly
        - damaged
        - needsMigration
        - progressStatus
        - aliases
        - categories
        - color
        - description
        - time
      additionalProperties: false
      properties:
        kind:
          type: string
          description: The `id` of the note's kind. A note cannot change kind.
        id:
          type: string
          description: The note's stable id. It does not change when the note is renamed.
        name:
          type: string
        path:
          type: string
          description: The note, as a path in the vault. It changes when the note or its kind is renamed.
        etag:
          type: string
          description: The version of the note. Send it in `If-Match` to change or delete it.
        index:
          type: integer
          description: The note's place among the notes of its kind, from 0.
        readOnly:
          type: boolean
        damaged:
          type: boolean
        needsMigration:
          type: boolean
        progressStatus:
          oneOf:
            - $ref: "#/components/schemas/ProgressStatus"
            - type: "null"
        aliases:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            type: string
        color:
          oneOf:
            - $ref: "#/components/schemas/Color"
            - type: "null"
        description:
          type: string
          description: What it is, in a sentence or two.
        time:
          $ref: "#/components/schemas/EntityTime"
        notes:
          type: string
          description: Everything else the author keeps about it.
        worldStatus:
          type: array
          items:
            $ref: "#/components/schemas/RecordLine"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/RecordLine"
        unrecognizedWorldStatus:
          type: array
          items:
            type: string
        unrecognizedRelationships:
          type: array
          items:
            type: string
        customFields:
          type: array
          items:
            $ref: "#/components/schemas/CustomField"
        gallery:
          type: array
          items:
            type: string
        galleryMain:
          type: [string, "null"]

    EntityPage:
      type: object
      required: [items, total, offset, limit, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Entity"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]

    Kind:
      type: object
      required: [id, group, builtIn, name, path, icon, description, hasTimeFields, defaultFieldTemplate, count]
      additionalProperties: false
      properties:
        id:
          type: string
          description: |
            `character`, `scene`, `time`, `location`, `item`, or the name of a
            kind the author made. An authored kind's `id` is its name and
            changes when the kind is renamed.
        group:
          type: string
          enum: [character, scene, worldbuilding]
        builtIn:
          type: boolean
          description: True for the kinds every project has. They cannot be renamed or deleted.
        name:
          type: string
          description: The kind's name in the project's language.
        path:
          type: string
          description: The folder the kind's notes stand in, as a path in the vault.
        icon:
          type: [string, "null"]
          description: The icon an authored kind wears, by its name in Obsidian's icon set.
        description:
          type: [string, "null"]
          description: What an authored kind is for, in the author's words.
        hasTimeFields:
          type: boolean
          description: True for `time`, whose notes say when they are.
        defaultFieldTemplate:
          type: [string, "null"]
          description: The name of the field template new notes of the kind begin with.
        count:
          type: integer
          description: How many notes of the kind the project has.

    KindList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Kind"

    DefinitionNode:
      type: object
      description: One word of a vocabulary.
      required: [taxonomyPath, name, depth, parent, description, path, folderPath, state, usage]
      additionalProperties: false
      properties:
        taxonomyPath:
          type: string
          description: The word's path in its tree, such as `Race/Elf`.
        name:
          type: string
          description: The word itself, which is the last step of its path.
        depth:
          type: integer
          description: How deep the word stands. 1 for a word at the top of its tree.
        parent:
          type: [string, "null"]
          description: The path of the word above it, or null at the top of the tree.
        description:
          type: string
          description: What the author wrote that the word means.
        path:
          type: string
          description: The word's own note, as a path in the vault.
        folderPath:
          type: string
          description: The word's folder, as a path in the vault. The words under it stand in it.
        state:
          type: string
          enum: [ok, missing-note, missing-folder]
          description: |
            `ok` for a word as it should be. `missing-note` where its folder
            is there and its note is not. `missing-folder` where notes use the
            word and nothing in the vault spells it.
        usage:
          type: object
          description: How many notes use this very word, not the words under it.
          required: [categorized, labelled]
          additionalProperties: false
          properties:
            categorized:
              type: integer
              description: Notes sorted under it as a category.
            labelled:
              type: integer
              description: Notes with a record line under it.

    DefinitionTree:
      type: object
      required: [vocabulary, kind, path, nodes]
      additionalProperties: false
      properties:
        vocabulary:
          $ref: "#/components/schemas/VocabularyId"
        kind:
          type: string
          description: The `id` of the kind whose words these are.
        path:
          type: string
          description: The folder the tree stands in, as a path in the vault. It may not exist while the tree is empty.
        nodes:
          type: array
          description: Every word, in reading order. A word comes before the words under it.
          items:
            $ref: "#/components/schemas/DefinitionNode"

    Vocabulary:
      type: object
      required: [vocabulary, trees]
      additionalProperties: false
      properties:
        vocabulary:
          $ref: "#/components/schemas/VocabularyId"
        trees:
          type: array
          description: One tree for each kind of the project, in the order of the kinds.
          items:
            $ref: "#/components/schemas/DefinitionTree"

    FieldTemplate:
      type: object
      required: [kind, name, description, path, default]
      additionalProperties: false
      properties:
        kind:
          type: string
          description: The `id` of the kind the template belongs to.
        name:
          type: string
          description: The template's name, which is the name of its note.
        description:
          type: string
        path:
          type: string
          description: The template's note, as a path in the vault.
        default:
          type: boolean
          description: True where new notes of the kind begin with this template.
        fields:
          type: array
          description: The fields the template holds. Given when one template is read.
          items:
            $ref: "#/components/schemas/CustomField"

    FieldTemplateList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FieldTemplate"

    WritingCount:
      type: object
      description: How much is written, counted every way at once. `total` is the number the author's convention comes to.
      required: [total, words, cjkCharacters, punctuationMarks, charactersWithSpaces, charactersNoSpaces]
      additionalProperties: false
      properties:
        total:
          type: integer
        words:
          type: integer
        cjkCharacters:
          type: integer
          description: Characters counted one at a time, as Chinese, Japanese and Korean writing is.
        punctuationMarks:
          type: integer
        charactersWithSpaces:
          type: integer
        charactersNoSpaces:
          type: integer

    Counting:
      type: object
      description: The convention a count follows, as the author set it in the plugin's settings.
      required: [mode, headings]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [jinjiang, chenggua, qidian, ms-word]
          description: |
            `jinjiang` counts every character that is not a space. `ms-word`
            counts as a word processor does. `qidian` and `chenggua` count
            Latin script in words and other scripts a character at a time.
        headings:
          type: string
          enum: [count, skip-first-h1, skip-h1, skip-all]
          description: Whether heading lines are counted as writing.

    Manuscript:
      type: object
      required: [path, notes, unreadable, firstNotePath, count, counting]
      additionalProperties: false
      properties:
        path:
          type: string
          description: The folder the manuscript stands in, as a path in the vault.
        notes:
          type: integer
          description: How many notes the manuscript has.
        unreadable:
          type: integer
          description: How many of them could not be read, and are missing from the count.
        firstNotePath:
          type: [string, "null"]
          description: The note the manuscript begins with, as a path in the vault.
        count:
          $ref: "#/components/schemas/WritingCount"
        counting:
          $ref: "#/components/schemas/Counting"

    ManuscriptNoteSummary:
      type: object
      required: [relativePath, path, title, index, readOnly]
      additionalProperties: false
      properties:
        relativePath:
          type: string
          description: Where the note stands inside the project. This is the note's address. It changes when the note is renamed or moved.
        path:
          type: string
          description: The note, as a path in the vault.
        title:
          type: string
          description: The note's name, which is the name of its file.
        index:
          type: integer
          description: The note's place in reading order, from 0.
        readOnly:
          type: boolean
        total:
          type: integer
          description: How much is written in the note, by the author's convention. Given with `include=counts`.

    ManuscriptNotePage:
      type: object
      required: [items, total, offset, limit, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ManuscriptNoteSummary"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]

    ManuscriptNote:
      type: object
      required: [relativePath, path, title, index, readOnly, etag, body, heading, headingMatchesTitle, count, counting, previous, next]
      additionalProperties: false
      properties:
        relativePath:
          type: string
          description: Where the note stands inside the project. This is the note's address. It changes when the note is renamed or moved.
        path:
          type: string
          description: The note, as a path in the vault.
        title:
          type: string
          description: The note's name, which is the name of its file.
        index:
          type: integer
          description: The note's place in reading order, from 0.
        readOnly:
          type: boolean
        etag:
          type: string
          description: The version of the note. Send it in `If-Match` to change the note.
        body:
          type: string
          description: The note's whole text under its properties, as Markdown.
        heading:
          type: [string, "null"]
          description: The note's first heading, where it has one.
        headingMatchesTitle:
          type: boolean
          description: True where that heading says the note's title.
        count:
          oneOf:
            - $ref: "#/components/schemas/WritingCount"
            - type: "null"
        counting:
          $ref: "#/components/schemas/Counting"
        previous:
          type: [string, "null"]
          description: The `relativePath` of the note before this one, or null for the first.
        next:
          type: [string, "null"]
          description: The `relativePath` of the note after this one, or null for the last.

    Instant:
      type: [string, "null"]
      format: date-time
      description: A moment, in RFC 3339 form and universal time. Null where none was kept.

    ManuscriptNoteRef:
      type: object
      description: The manuscript note a marked passage stands in.
      required: [path, relativePath, title]
      additionalProperties: false
      properties:
        path:
          type: string
          description: The note, as a path in the vault.
        relativePath:
          type: [string, "null"]
          description: |
            The note's address in the manuscript, as `getManuscriptNote` takes
            it. Null where the note is no longer one of the manuscript's
            notes. A passage in such a note reads as `conflict`.
        title:
          type: string
          description: The note's name.

    TextRange:
      type: object
      description: |
        A stretch of a note's text, counted from the start of its `body` in
        UTF-16 code units, as JavaScript counts a string. `to` is one past the
        last unit.
      required: [from, to]
      additionalProperties: false
      properties:
        from:
          type: integer
          minimum: 0
        to:
          type: integer
          minimum: 0

    PassageState:
      type: string
      enum: [anchored, moved, conflict]
      description: |
        Whether a marked passage still stands in its note. `anchored` where
        it stands where it was marked. `moved` where the same words were found
        elsewhere in the note, and `range` says where. `conflict` where they
        are no longer there, or stand in more places than can be told apart,
        or the note is no longer one of the manuscript's.

    TaskStatus:
      type: string
      enum: [todo, in-progress, blocked, in-review, done, cancelled]
      description: The column a task stands in.

    TaskPriority:
      type: string
      enum: [low, medium, high, urgent]

    Task:
      type: object
      required: [id, title, description, status, priority, dueDate, related, archived, overdue, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        dueDate:
          type: [string, "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: The day the task is due, as `YYYY-MM-DD`, or null.
        related:
          type: array
          description: The notes of the project the task is about.
          items:
            $ref: "#/components/schemas/MemberRef"
        archived:
          type: boolean
          description: True where the author set the task aside without deleting it.
        overdue:
          type: boolean
          description: True where the task is past its day and neither done nor cancelled, by this computer's calendar.
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"

    TaskPage:
      type: object
      required: [items, total, offset, limit, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]

    ForeshadowingStatus:
      type: string
      enum: [planned, active, resolved, abandoned]

    OccurrenceRole:
      type: string
      enum: [plant, reinforce, payoff]
      description: What one appearance does for the thread. It lays it down, echoes it, or pays it off.

    Occurrence:
      type: object
      description: One place a foreshadowing thread appears in the manuscript.
      required: [id, role, comment, note, range, text, context, state]
      additionalProperties: false
      properties:
        id:
          type: string
        role:
          $ref: "#/components/schemas/OccurrenceRole"
        comment:
          type: string
          description: The author's own remark about this appearance.
        note:
          $ref: "#/components/schemas/ManuscriptNoteRef"
        range:
          $ref: "#/components/schemas/TextRange"
          description: Where the words stand in the note now. For a `conflict`, where they last stood.
        text:
          type: string
          description: The words that were marked.
        context:
          $ref: "#/components/schemas/PassageContext"
        state:
          $ref: "#/components/schemas/PassageState"

    PassageContext:
      type: object
      description: A few characters of the note on either side of a marked passage, by which it is found again after the note changes.
      required: [before, after]
      additionalProperties: false
      properties:
        before:
          type: string
        after:
          type: string

    Foreshadowing:
      type: object
      required: [id, name, description, status, related, createdAt, updatedAt, occurrences]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/ForeshadowingStatus"
        related:
          type: array
          description: The notes of the project the thread is about.
          items:
            $ref: "#/components/schemas/MemberRef"
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"
        occurrences:
          type: array
          description: Each place the thread appears, in reading order.
          items:
            $ref: "#/components/schemas/Occurrence"

    ForeshadowingPage:
      type: object
      required: [items, total, offset, limit, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Foreshadowing"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]

    RevisionKind:
      type: string
      enum: [replace, insert, delete]

    Revision:
      type: object
      description: A change proposed to a passage of the manuscript and not yet made.
      required: [id, note, kind, range, originalText, proposed, comment, context, createdAt, state]
      additionalProperties: false
      properties:
        id:
          type: string
        note:
          $ref: "#/components/schemas/ManuscriptNoteRef"
        kind:
          $ref: "#/components/schemas/RevisionKind"
        range:
          $ref: "#/components/schemas/TextRange"
          description: |
            Where the passage stands in the note now. For a `conflict`, where
            it last stood. An insertion is a point, with `from` equal to `to`.
        originalText:
          type: string
          description: The text the revision was made over. Empty for an insertion.
        proposed:
          type: string
          description: What should stand instead. Empty for a deletion.
        comment:
          type: string
          description: Why, in the proposer's words.
        context:
          $ref: "#/components/schemas/PassageContext"
        createdAt:
          $ref: "#/components/schemas/Instant"
        state:
          $ref: "#/components/schemas/PassageState"

    RevisionPage:
      type: object
      required: [items, total, offset, limit, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Revision"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]

    StickyNote:
      type: object
      description: |
        A sticky note. `body` is given when one note is read. A list gives
        `preview` only.
      required: [id, path, color, createdAt, archived, etag, readOnly, preview]
      additionalProperties: false
      properties:
        id:
          type: string
        path:
          type: string
          description: The note, as a path in the vault.
        color:
          $ref: "#/components/schemas/Color"
        createdAt:
          $ref: "#/components/schemas/Instant"
        archived:
          type: boolean
        etag:
          type: string
          description: The version of the note. Send it in `If-Match` to change what it says or to delete it.
        readOnly:
          type: boolean
        preview:
          type: string
          description: The start of what the note says, on one line.
        body:
          type: string
          description: Everything the note says, as Markdown.

    StickyNotePage:
      type: object
      required: [items, total, offset, limit, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StickyNote"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]

    ScopeCount:
      type: object
      description: How much is written in one part of a project.
      required: [notes, unreadable, count]
      additionalProperties: false
      properties:
        notes:
          type: integer
          description: How many notes were counted.
        unreadable:
          type: integer
          description: How many notes could not be read. What they say is missing from the count.
        count:
          $ref: "#/components/schemas/WritingCount"

    WritingCounts:
      type: object
      required: [project, manuscript, counting]
      additionalProperties: false
      properties:
        project:
          $ref: "#/components/schemas/ScopeCount"
          description: Every note of the project, the manuscript included.
        manuscript:
          $ref: "#/components/schemas/ScopeCount"
          description: The manuscript's notes alone.
        counting:
          $ref: "#/components/schemas/Counting"

    ProseNumbers:
      type: object
      description: What one stretch of prose comes to.
      required: [total, words, cjkCharacters, sentences, dialogueTotal]
      additionalProperties: false
      properties:
        total:
          type: integer
          description: Its length by the author's convention.
        words:
          type: integer
        cjkCharacters:
          type: integer
          description: Chinese, Japanese and Korean characters, which are counted one at a time.
        sentences:
          type: integer
        dialogueTotal:
          type: integer
          description: How much of `total` stands inside quotation marks.

    NoteProse:
      type: object
      description: One manuscript note's numbers.
      required: [note, total, words, cjkCharacters, sentences, dialogueTotal]
      additionalProperties: false
      properties:
        note:
          $ref: "#/components/schemas/ManuscriptNoteRef"
        total:
          type: integer
          description: Its length by the author's convention.
        words:
          type: integer
        cjkCharacters:
          type: integer
        sentences:
          type: integer
        dialogueTotal:
          type: integer
          description: How much of `total` stands inside quotation marks.

    ProseStatisticsPage:
      type: object
      required: [items, total, offset, limit, nextOffset, notes, manuscript, counting]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NoteProse"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]
        notes:
          type: integer
          description: How many notes the numbers of `manuscript` were made from.
        manuscript:
          $ref: "#/components/schemas/ProseNumbers"
          description: The manuscript as a whole.
        counting:
          $ref: "#/components/schemas/Counting"

    WordCount:
      type: object
      required: [term, count]
      additionalProperties: false
      properties:
        term:
          type: string
          description: The word, in lower case.
        count:
          type: integer

    WordFrequencyPage:
      type: object
      required: [items, total, offset, limit, nextOffset, tokens]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WordCount"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]
        tokens:
          type: integer
          description: Every word of the manuscript, counted before anything was left out.

    FoundPassage:
      type: object
      description: Some words found in a manuscript note.
      required: [note, range, text]
      additionalProperties: false
      properties:
        note:
          $ref: "#/components/schemas/ManuscriptNoteRef"
        range:
          $ref: "#/components/schemas/TextRange"
        text:
          type: string
          description: The words as the note has them.

    SensitiveWord:
      type: object
      required: [term, total]
      additionalProperties: false
      properties:
        term:
          type: string
          description: The word as the author listed it.
        total:
          type: integer
          description: How often the manuscript uses it.
        occurrences:
          type: array
          description: Every place it is used, in reading order. Given where it was asked for.
          items:
            $ref: "#/components/schemas/FoundPassage"

    SensitiveWords:
      type: object
      required: [terms]
      additionalProperties: false
      properties:
        terms:
          type: array
          description: The words the author watches for, in the order of the author's list.
          items:
            $ref: "#/components/schemas/SensitiveWord"

    QuotationMarks:
      type: object
      description: One pair of quotation marks.
      required: [open, close]
      additionalProperties: false
      properties:
        open:
          type: string
        close:
          type: string

    NoteDialogueCount:
      type: object
      required: [note, count]
      additionalProperties: false
      properties:
        note:
          $ref: "#/components/schemas/ManuscriptNoteRef"
        count:
          type: integer
          description: How many quoted stretches the note holds.

    DialoguePage:
      type: object
      required: [items, total, offset, limit, nextOffset, marks]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NoteDialogueCount"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]
        marks:
          type: array
          description: The quotation marks that were read, as the author's settings have them. None means dialogue is not read at all.
          items:
            $ref: "#/components/schemas/QuotationMarks"

    QuotedStretch:
      type: object
      required: [range, text]
      additionalProperties: false
      properties:
        range:
          $ref: "#/components/schemas/TextRange"
        text:
          type: string
          description: The quoted words, quotation marks included.

    NoteDialoguePage:
      type: object
      required: [items, total, offset, limit, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuotedStretch"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]

    MentionPlace:
      type: object
      description: One place a note is named.
      required: [note, from]
      additionalProperties: false
      properties:
        note:
          $ref: "#/components/schemas/ManuscriptNoteRef"
        from:
          type: integer
          minimum: 0
          description: Where the name begins in the note's `body`, in UTF-16 code units.

    NoteMentionCount:
      type: object
      required: [note, count]
      additionalProperties: false
      properties:
        note:
          $ref: "#/components/schemas/ManuscriptNoteRef"
        count:
          type: integer

    MentionSummary:
      type: object
      description: How the manuscript mentions one character, scene or worldbuilding note.
      required: [member, total, linked, unlinked, first, last, notes]
      additionalProperties: false
      properties:
        member:
          $ref: "#/components/schemas/MemberRef"
        total:
          type: integer
          description: How often it is named for certain.
        linked:
          type: integer
          description: How many of those are links.
        unlinked:
          type: integer
          description: How many are plain words.
        first:
          oneOf:
            - $ref: "#/components/schemas/MentionPlace"
            - type: "null"
        last:
          oneOf:
            - $ref: "#/components/schemas/MentionPlace"
            - type: "null"
        notes:
          type: array
          description: The manuscript notes that name it, in reading order, with how often each does.
          items:
            $ref: "#/components/schemas/NoteMentionCount"

    MentionPage:
      type: object
      required: [items, total, offset, limit, nextOffset, unresolved]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MentionSummary"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]
        unresolved:
          type: integer
          description: How many mentions in the whole manuscript could mean more than one note, and so are counted for none.

    MentionResolution:
      type: string
      enum: [unique, wikilink, ambiguous, foreign-link]
      description: |
        How sure a mention is. `unique` is plain words only one note goes by.
        `wikilink` is the text of a link to that note. `ambiguous` is plain
        words more than one note goes by. `foreign-link` is such words inside
        a link that leads somewhere else, which the author has already said
        means something else.

    NoteMention:
      type: object
      required: [range, text, resolution, member, candidates]
      additionalProperties: false
      properties:
        range:
          $ref: "#/components/schemas/TextRange"
        text:
          type: string
          description: The words as the note has them.
        resolution:
          $ref: "#/components/schemas/MentionResolution"
        member:
          description: The note that is meant, where that is certain.
          oneOf:
            - $ref: "#/components/schemas/MemberRef"
            - type: "null"
        candidates:
          type: array
          description: Every note the words could mean.
          items:
            $ref: "#/components/schemas/MemberRef"

    NoteMentionPage:
      type: object
      required: [items, total, offset, limit, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NoteMention"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]

    Day:
      type: string
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      description: A day on this computer's calendar, as `YYYY-MM-DD`.

    WritingScope:
      type: string
      enum: [project, manuscript]
      description: Which notes words are counted in. Every note of the project, or the manuscript's alone.

    WritingMode:
      type: string
      enum: [planning, draft, revision, proofreading]
      description: The stage of the work a session was spent on, as the author said when it began.

    WritingDay:
      type: object
      description: One day's writing. Times are in milliseconds.
      required: [day, sessions, focusMs, idleMs, totalMs, added, deleted, net, timedNet, goalNet]
      additionalProperties: false
      properties:
        day:
          $ref: "#/components/schemas/Day"
        sessions:
          type: integer
          description: How many sessions began on the day.
        focusMs:
          type: integer
          description: Time spent writing.
        idleMs:
          type: integer
          description: Time a session ran with nothing being written.
        totalMs:
          type: integer
          description: The two together. Time a session stood paused is in neither.
        added:
          type: integer
          description: Words added, in the scope the answer names.
        deleted:
          type: integer
          description: Words taken away.
        net:
          type: integer
          description: The difference. Words written outside any session are counted here where the author has that switched on.
        timedNet:
          type: integer
          description: The difference from timed sessions alone, which is what a pace is worked out from.
        goalNet:
          type: integer
          description: The day's difference in the scope the author's daily goal is set in.

    WritingDays:
      type: object
      required: [from, through, scope, goalScope, items]
      additionalProperties: false
      properties:
        from:
          $ref: "#/components/schemas/Day"
        through:
          $ref: "#/components/schemas/Day"
        scope:
          $ref: "#/components/schemas/WritingScope"
          description: The scope the words are counted in, which is the author's setting.
        goalScope:
          $ref: "#/components/schemas/WritingScope"
          description: The scope `goalNet` is counted in.
        items:
          type: array
          items:
            $ref: "#/components/schemas/WritingDay"

    DayBand:
      type: object
      description: What the sessions put into one part of the day.
      required: [fromHour, toHour, focusMs, totalMs, added, deleted, net]
      additionalProperties: false
      properties:
        fromHour:
          type: integer
          description: The hour the part begins at, from 0 to 23.
        toHour:
          type: integer
          description: The hour it ends before, from 1 to 24.
        focusMs:
          type: number
        totalMs:
          type: number
        added:
          type: number
        deleted:
          type: number
        net:
          type: number

    WritingModeTotals:
      type: object
      required: [mode, sessions, focusMs, totalMs, net]
      additionalProperties: false
      properties:
        mode:
          $ref: "#/components/schemas/WritingMode"
        sessions:
          type: integer
        focusMs:
          type: number
        totalMs:
          type: number
        net:
          type: number

    WritingSpread:
      type: object
      required: [span, scope, bands, modes]
      additionalProperties: false
      properties:
        span:
          type: string
          enum: [today, yesterday, all]
        scope:
          $ref: "#/components/schemas/WritingScope"
        bands:
          type: array
          description: The parts of a day in the order the author's day runs, from early morning to the small hours.
          items:
            $ref: "#/components/schemas/DayBand"
        modes:
          type: array
          description: Every stage of the work, in the order the stages come.
          items:
            $ref: "#/components/schemas/WritingModeTotals"

    LiveWritingSession:
      type: object
      description: The session under way, as it stands this moment. Times are in milliseconds.
      required: [id, type, startMode, writingMode, state, startedAt, focusMs, idleMs, pausedMs, totalMs, remainingMs, pomodoro, startWordCount, added, deleted, net, goalNet, notes]
      additionalProperties: false
      properties:
        id:
          type: string
        type:
          type: string
          enum: [stopwatch, countdown, pomodoro]
        startMode:
          type: string
          enum: [manual, auto]
          description: Whether the author began it, or the plugin did when the author began to type.
        writingMode:
          $ref: "#/components/schemas/WritingMode"
        state:
          type: string
          enum: [starting, focus, idle, paused]
          description: "`starting` while the plugin is still counting what the project holds."
        startedAt:
          $ref: "#/components/schemas/Instant"
        focusMs:
          type: number
        idleMs:
          type: number
        pausedMs:
          type: number
        totalMs:
          type: number
          description: Writing and idle time together.
        remainingMs:
          type: [number, "null"]
          description: What is left of a countdown or of a pomodoro's part. Null for a stopwatch.
        pomodoro:
          description: Where a pomodoro session stands. Null for the other types.
          oneOf:
            - type: object
              required: [phase, cycle]
              additionalProperties: false
              properties:
                phase:
                  type: string
                  enum: [work, break]
                cycle:
                  type: integer
            - type: "null"
        startWordCount:
          type: [integer, "null"]
          description: How much the scope held when the session began. Null while it is starting.
        added:
          type: integer
        deleted:
          type: integer
        net:
          type: integer
        goalNet:
          type: integer
        notes:
          type: integer
          description: How many notes the session has written in.

    WritingSession:
      type: object
      required: [session, today, scope, goalScope]
      additionalProperties: false
      properties:
        session:
          oneOf:
            - $ref: "#/components/schemas/LiveWritingSession"
            - type: "null"
        today:
          $ref: "#/components/schemas/WritingDay"
        scope:
          $ref: "#/components/schemas/WritingScope"
        goalScope:
          $ref: "#/components/schemas/WritingScope"

    HistoryNote:
      type: object
      description: A note as the history knows it now, under the name it has now.
      required: [path, relativePath, kind, exists]
      additionalProperties: false
      properties:
        path:
          type: string
          description: The note, as a path in the vault.
        relativePath:
          type: string
          description: Where the note stands inside the project.
        kind:
          type: string
          enum: [manuscript, character, scene, worldbuilding, step, other]
        worldbuildingKind:
          type: string
          description: The kind of a worldbuilding note, by its `kindId`.
        step:
          type: integer
          enum: [1, 2, 4, 6]
          description: The step a step's note stands for.
        documentType:
          type: string
          description: What the note's properties say it is, where they say.
        exists:
          type: boolean
          description: Whether the note still stands.

    HistoryWords:
      type: object
      required: [added, deleted, net]
      additionalProperties: false
      properties:
        added:
          type: integer
        deleted:
          type: integer
        net:
          type: integer

    HistoryImportSource:
      type: object
      description: The project notes were imported from.
      required: [projectId, title]
      additionalProperties: false
      properties:
        projectId:
          type: string
        title:
          type: string

    HistoryNoteEntry:
      type: object
      description: "One note's day: what became of it and how many words that came to."
      required: [kind, id, day, at, until, action, note, versions, words, source, sessions]
      additionalProperties: false
      properties:
        kind:
          const: note
        id:
          type: string
        day:
          $ref: "#/components/schemas/Day"
        at:
          $ref: "#/components/schemas/Instant"
          description: The first moment of what the entry covers.
        until:
          $ref: "#/components/schemas/Instant"
          description: The last moment of what the entry covers.
        action:
          type: string
          enum: [created, imported, first-recorded, edited, deleted]
          description: "`first-recorded` is a note the history first saw already written."
        note:
          $ref: "#/components/schemas/HistoryNote"
        versions:
          type: integer
          description: How many versions Obsidian's file recovery kept that day.
        words:
          $ref: "#/components/schemas/HistoryWords"
        source:
          type: string
          enum: [snapshots, sessions, ledger]
          description: Where the words were read from. The kept versions, the writing sessions, or the plugin's own record, which counts none.
        sessions:
          type: integer
          description: How many timed sessions wrote in the note that day.
        origin:
          type: string
          enum: [user, plugin, import, inferred]
          description: Who made the note, where the entry is its making.
        createdWords:
          type: integer
          description: How much the note held when it was made.
        importedFrom:
          $ref: "#/components/schemas/HistoryImportSource"
        since:
          $ref: "#/components/schemas/Day"
          description: The day the words reach back to, where the day's first version was read against a much older one.

    HistoryRenameEntry:
      type: object
      description: "A rename, or several made within a moment of one another, as a renumbering is."
      required: [kind, id, day, at, until, items, inferred]
      additionalProperties: false
      properties:
        kind:
          const: renamed
        id:
          type: string
        day:
          $ref: "#/components/schemas/Day"
        at:
          $ref: "#/components/schemas/Instant"
          description: The first moment of what the entry covers.
        until:
          $ref: "#/components/schemas/Instant"
          description: The last moment of what the entry covers.
        items:
          type: array
          items:
            type: object
            required: [from, note]
            additionalProperties: false
            properties:
              from:
                type: string
                description: Where the note stood inside the project before.
              note:
                $ref: "#/components/schemas/HistoryNote"
        inferred:
          type: boolean
          description: True where nobody saw the rename, and it was read off the versions.

    HistoryImportEntry:
      type: object
      description: "Several notes one import brought."
      required: [kind, id, day, at, until, from, notes]
      additionalProperties: false
      properties:
        kind:
          const: imported
        id:
          type: string
        day:
          $ref: "#/components/schemas/Day"
        at:
          $ref: "#/components/schemas/Instant"
          description: The first moment of what the entry covers.
        until:
          $ref: "#/components/schemas/Instant"
          description: The last moment of what the entry covers.
        from:
          oneOf:
            - $ref: "#/components/schemas/HistoryImportSource"
            - type: "null"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/HistoryNote"

    HistoryTaskEntry:
      type: object
      description: "Something done to a task."
      required: [kind, id, day, at, until, event, task]
      additionalProperties: false
      properties:
        kind:
          const: task
        id:
          type: string
        day:
          $ref: "#/components/schemas/Day"
        at:
          $ref: "#/components/schemas/Instant"
          description: The first moment of what the entry covers.
        until:
          $ref: "#/components/schemas/Instant"
          description: The last moment of what the entry covers.
        event:
          type: string
          enum: [task-created, task-status, task-archived, task-deleted]
        task:
          type: object
          required: [id, title]
          additionalProperties: false
          properties:
            id:
              type: string
            title:
              type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
          description: The column the task was moved to.

    HistoryThreadEntry:
      type: object
      description: "Something done to a foreshadowing thread."
      required: [kind, id, day, at, until, event, thread]
      additionalProperties: false
      properties:
        kind:
          const: thread
        id:
          type: string
        day:
          $ref: "#/components/schemas/Day"
        at:
          $ref: "#/components/schemas/Instant"
          description: The first moment of what the entry covers.
        until:
          $ref: "#/components/schemas/Instant"
          description: The last moment of what the entry covers.
        event:
          type: string
          enum: [thread-created, thread-status, thread-deleted]
        thread:
          type: object
          required: [id, name]
          additionalProperties: false
          properties:
            id:
              type: string
            name:
              type: string
        status:
          $ref: "#/components/schemas/ForeshadowingStatus"

    HistoryRevisionEntry:
      type: object
      description: "A revision proposed, accepted or discarded."
      required: [kind, id, day, at, until, event, revision, note]
      additionalProperties: false
      properties:
        kind:
          const: revision
        id:
          type: string
        day:
          $ref: "#/components/schemas/Day"
        at:
          $ref: "#/components/schemas/Instant"
          description: The first moment of what the entry covers.
        until:
          $ref: "#/components/schemas/Instant"
          description: The last moment of what the entry covers.
        event:
          type: string
          enum: [revision-proposed, revision-accepted, revision-discarded]
        revision:
          type: object
          required: [id]
          additionalProperties: false
          properties:
            id:
              type: string
        note:
          $ref: "#/components/schemas/HistoryNote"

    HistoryEntry:
      description: One thing that happened. `kind` says which of the six it is.
      oneOf:
        - $ref: "#/components/schemas/HistoryNoteEntry"
        - $ref: "#/components/schemas/HistoryRenameEntry"
        - $ref: "#/components/schemas/HistoryImportEntry"
        - $ref: "#/components/schemas/HistoryTaskEntry"
        - $ref: "#/components/schemas/HistoryThreadEntry"
        - $ref: "#/components/schemas/HistoryRevisionEntry"

    HistoryDay:
      type: object
      required: [day, entries]
      additionalProperties: false
      properties:
        day:
          $ref: "#/components/schemas/Day"
        entries:
          type: array
          description: What happened on the day, earliest first.
          items:
            $ref: "#/components/schemas/HistoryEntry"

    History:
      type: object
      required: [from, through, days]
      additionalProperties: false
      properties:
        from:
          $ref: "#/components/schemas/Day"
        through:
          $ref: "#/components/schemas/Day"
        days:
          type: array
          description: Every day of the stretch, oldest first, the ones nothing happened on included.
          items:
            $ref: "#/components/schemas/HistoryDay"

    DerivedTask:
      type: object
      description: A card the plugin puts on the task board by itself.
      required: [key, status, count, progress]
      additionalProperties: false
      properties:
        key:
          type: string
          enum: [dailyGoal, weeklyGoal, monthlyGoal, unresolvedMentions, sensitiveWords, openForeshadowings, unresolvedForeshadowings, pendingRevisions, unresolvedRevisions, stickyNotes]
          description: Which card it is.
        status:
          $ref: "#/components/schemas/TaskStatus"
        count:
          type: [integer, "null"]
          description: How many things are waiting, on a card that counts them. Null on a goal's card.
        progress:
          description: Where the writing stands against the goal, on a goal's card. Null on the others.
          oneOf:
            - type: object
              required: [net, goal]
              additionalProperties: false
              properties:
                net:
                  type: integer
                  description: Words written towards the goal in its period.
                goal:
                  type: integer
                  description: The words the period aims at.
            - type: "null"

    DerivedTasks:
      type: object
      required: [items, complete]
      additionalProperties: false
      properties:
        items:
          type: array
          description: The cards there are now, in the order a column shows them.
          items:
            $ref: "#/components/schemas/DerivedTask"
        complete:
          type: boolean
          description: False where something the cards are worked out from could not be read, and its cards are left out.

    ScenePresentation:
      type: string
      enum: [flat, stack]
      description: Whether the scenes of a row are laid side by side or as a stack.

    SceneRow:
      type: object
      description: A row of the author's own words, with the scenes placed on it.
      required: [id, text, scenes]
      additionalProperties: false
      properties:
        id:
          type: string
        text:
          type: string
          description: What happens, changes or holds there. May be empty.
        scenes:
          type: array
          description: The scenes placed on the row, in the row's own order.
          items:
            $ref: "#/components/schemas/MemberRef"

    TimelineTime:
      type: object
      description: One time note on one timeline, with the rows the timeline writes under it.
      required: [time, rows]
      additionalProperties: false
      properties:
        time:
          $ref: "#/components/schemas/MemberRef"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SceneRow"

    Timeline:
      type: object
      required: [id, name, binding, times, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        binding:
          description: The character or worldbuilding note the timeline follows. Null for one that follows none.
          oneOf:
            - $ref: "#/components/schemas/MemberRef"
            - type: "null"
        times:
          type: array
          description: The times the timeline names, in the order they were added. A view keeps the order they are shown in.
          items:
            $ref: "#/components/schemas/TimelineTime"
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"

    TimelineView:
      type: object
      required: [id, name, timelineIds, timeOrder, presentation, cardStyle, showSubDescriptions, timesReversed, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        timelineIds:
          type: array
          description: The timelines the view shows, in its own order, each by its `id`.
          items:
            type: string
        timeOrder:
          type: array
          description: The order the view shows the times in, each by the time note's `id`. It may name times the view no longer shows.
          items:
            type: string
        presentation:
          description: How scenes are shown. Null leaves it to the layout.
          oneOf:
            - $ref: "#/components/schemas/ScenePresentation"
            - type: "null"
        cardStyle:
          type: [string, "null"]
          enum: [compact, standard, extended, null]
        showSubDescriptions:
          type: boolean
          description: Whether the rows' words are shown, or the scenes alone.
        timesReversed:
          type: boolean
          description: Whether the times run latest first.
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"

    TimelineBoard:
      type: object
      required: [timelines, views, pinnedTimelineId, lastViewId]
      additionalProperties: false
      properties:
        timelines:
          type: array
          items:
            $ref: "#/components/schemas/Timeline"
        views:
          type: array
          items:
            $ref: "#/components/schemas/TimelineView"
        pinnedTimelineId:
          type: [string, "null"]
          description: The timeline shown first wherever it is. Null for none.
        lastViewId:
          type: [string, "null"]
          description: The view the author opened last.

    BeatSheetSummary:
      type: object
      required: [id, name, acts, beats, scenes, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        acts:
          type: integer
        beats:
          type: integer
        scenes:
          type: integer
          description: How many scenes are placed on the sheet.
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"

    BeatSheetList:
      type: object
      required: [items, lastSheetId]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BeatSheetSummary"
        lastSheetId:
          type: [string, "null"]
          description: The sheet the author opened last.

    Beat:
      type: object
      required: [id, name, description, rows]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          description: What the beat is for. May be empty.
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SceneRow"

    BeatSheetAct:
      type: object
      required: [id, number, label, beats]
      additionalProperties: false
      properties:
        id:
          type: string
        number:
          type: integer
          description: The act's place in the story, from 1.
        label:
          type: string
          description: What follows the act's number. Empty for an act that goes by its number alone.
        beats:
          type: array
          items:
            $ref: "#/components/schemas/Beat"

    BeatSheet:
      type: object
      required: [id, name, presentation, showSubDescriptions, reversed, createdAt, updatedAt, acts]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        presentation:
          description: How scenes are shown. Null leaves it to the layout.
          oneOf:
            - $ref: "#/components/schemas/ScenePresentation"
            - type: "null"
        showSubDescriptions:
          type: boolean
          description: Whether the rows' words are shown, or the scenes alone.
        reversed:
          type: boolean
          description: Whether the sheet is shown from its end. The acts and beats here are in the story's own order either way.
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"
        acts:
          type: array
          items:
            $ref: "#/components/schemas/BeatSheetAct"

    BeatSheetTemplate:
      type: object
      description: The acts and beats a new sheet can be started from.
      required: [id, name, description, builtIn, acts]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        builtIn:
          type: boolean
          description: True for one the plugin ships, which cannot be changed.
        acts:
          type: array
          items:
            type: object
            required: [label, beats]
            additionalProperties: false
            properties:
              label:
                type: string
              beats:
                type: array
                items:
                  type: object
                  required: [name, description]
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                    description:
                      type: string

    BeatSheetTemplateList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BeatSheetTemplate"

    FreeformViewSummary:
      type: object
      required: [id, name, placements, frames, edges, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        placements:
          type: integer
          description: How many cards stand on the view.
        frames:
          type: integer
        edges:
          type: integer
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"

    FreeformViewList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FreeformViewSummary"

    FreeformResource:
      description: What a card shows. `type` says which of the five it is.
      oneOf:
        - type: object
          description: A character, a scene or a worldbuilding note.
          required: [type, member]
          additionalProperties: false
          properties:
            type:
              const: entity
            member:
              $ref: "#/components/schemas/MemberRef"
        - type: object
          description: A task, a foreshadowing thread, a revision or a sticky note, by its id.
          required: [type, id, name]
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [task, foreshadowing, revision, sticky-note]
            id:
              type: string
            name:
              type: string
              description: What the record was called when the card was last drawn.
        - type: object
          description: A file of the project.
          required: [type, path, relativePath]
          additionalProperties: false
          properties:
            type:
              const: file
            path:
              type: string
              description: The file, as a path in the vault.
            relativePath:
              type: string
              description: Where the file stands inside the project.
        - type: object
          description: A web address.
          required: [type, url, label]
          additionalProperties: false
          properties:
            type:
              const: link
            url:
              type: string
            label:
              type: string
        - type: object
          description: Words of the card's own, as Markdown.
          required: [type, text]
          additionalProperties: false
          properties:
            type:
              const: text
            text:
              type: string

    FreeformPlacement:
      type: object
      description: One card on a view. The same note can stand on a view more than once.
      required: [id, resource, x, y, width, height, displayMode, zIndex, frameId]
      additionalProperties: false
      properties:
        id:
          type: string
        resource:
          $ref: "#/components/schemas/FreeformResource"
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        displayMode:
          type: string
          enum: [auto, compact, standard, gallery, extended]
        zIndex:
          type: number
          description: Its place among the cards, low under high.
        frameId:
          type: [string, "null"]
          description: The frame that holds it. Null for a card that stands free.

    FreeformFrame:
      type: object
      description: A titled ground cards can stand on.
      required: [id, title, color, x, y, width, height, zIndex]
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        color:
          oneOf:
            - $ref: "#/components/schemas/Color"
            - type: "null"
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        zIndex:
          type: number

    FreeformEdge:
      type: object
      description: A line drawn between two things on a view. It says nothing about them and changes nothing of them.
      required: [id, source, target, sourceSide, targetSide, label, arrow, line]
      additionalProperties: false
      properties:
        id:
          type: string
        source:
          type: string
          description: A card or a frame of the same view, by its `id`.
        target:
          type: string
        sourceSide:
          type: [string, "null"]
          enum: [top, right, bottom, left, null]
        targetSide:
          type: [string, "null"]
          enum: [top, right, bottom, left, null]
        label:
          type: string
        arrow:
          type: string
          enum: [none, start, end, both]
        line:
          type: string
          enum: [solid, dashed, dotted, dash-dot]

    FreeformView:
      type: object
      required: [id, name, viewport, placements, frames, edges, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        viewport:
          type: object
          description: Where the author last stood looking.
          required: [x, y, zoom]
          additionalProperties: false
          properties:
            x:
              type: number
            y:
              type: number
            zoom:
              type: number
        placements:
          type: array
          items:
            $ref: "#/components/schemas/FreeformPlacement"
        frames:
          type: array
          items:
            $ref: "#/components/schemas/FreeformFrame"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/FreeformEdge"
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"

    GraphNode:
      type: object
      required: [id, group, kind, name, aliases, path, weight]
      additionalProperties: false
      properties:
        id:
          type: string
          description: The note's own id. A relationship that leads to no note has a node whose id begins `unresolved:`.
        group:
          type: string
          enum: [character, scene, worldbuilding, unresolved]
        kind:
          type: string
          description: The note's kind, by its `kindId`, or `unresolved`.
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
        path:
          type: [string, "null"]
          description: The note, as a path in the vault. Null for a node that stands for a note that is gone.
        weight:
          type: integer
          description: How many lines touch the node.

    GraphEdge:
      type: object
      description: One relationship a note records, from that note to the one it points at.
      required: [id, source, target, label, labelPath, text, record]
      additionalProperties: false
      properties:
        id:
          type: string
        source:
          type: string
          description: The node whose note records the relationship.
        target:
          type: string
        label:
          type: string
          description: The relationship word.
        labelPath:
          type: string
          description: Where the word stands in the relationship vocabulary, which tells two words of one spelling apart.
        text:
          type: string
          description: The note's own words about it.
        record:
          type: integer
          description: Which of the note's relationships it is, from 0.

    RelationshipGraph:
      type: object
      required: [nodes, edges, labels]
      additionalProperties: false
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdge"
        labels:
          type: array
          description: Every relationship word in use, in the order each is first met.
          items:
            type: string

    ProjectCreate:
      type: object
      required: [title, language]
      additionalProperties: false
      properties:
        title:
          type: string
          pattern: "\\S"
          maxLength: 200
          description: What the project is called. It names the project's folder.
        language:
          $ref: "#/components/schemas/Language"
        series:
          description: The series the project is a book of. Left out or null for a book on its own.
          oneOf:
            - $ref: "#/components/schemas/Series"
            - type: "null"

    ProjectPatch:
      type: object
      description: What to change of a project. A project read and sent back whole is taken, and only these are looked at.
      additionalProperties: false
      x-snowflake-echo: "#/components/schemas/Project"
      properties:
        title:
          type: string
          pattern: "\\S"
          maxLength: 200
        series:
          oneOf:
            - $ref: "#/components/schemas/Series"
            - type: "null"

    RestoredProject:
      type: object
      required: [project, renamedFrom]
      additionalProperties: false
      properties:
        project:
          $ref: "#/components/schemas/Project"
        renamedFrom:
          type: [string, "null"]
          description: The title the project had in the archive, where it came back under another. Null where it kept its title.

    ProjectRepair:
      type: object
      required: [created, repaired, unchanged, conflicts, health]
      additionalProperties: false
      properties:
        created:
          type: array
          description: What was missing and was made, each as a path in the vault.
          items:
            type: string
        repaired:
          type: array
          description: What was there and was put right.
          items:
            type: string
        unchanged:
          type: array
          description: What was looked at and found in order.
          items:
            type: string
        conflicts:
          type: array
          description: What could not be put right without touching the author's own text, and was left.
          items:
            type: string
        health:
          $ref: "#/components/schemas/ProjectHealth"

    StepStatusChange:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/StepStatus"

    StepTextPatch:
      type: object
      description: The sections to write, each under its id. A step's text read and sent back whole is taken, and only `sections` is looked at.
      required: [sections]
      additionalProperties: false
      x-snowflake-echo: "#/components/schemas/StepText"
      properties:
        sections:
          type: object
          description: The new text of each section named. `getStepText` gives the ids a step has.
          additionalProperties:
            type: string

    MemberRefInput:
      type: object
      description: A note of the project, named by its id. A reference as it was read is taken, and only its `id` is looked at.
      required: [id]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        kind:
          type: [string, "null"]
        name:
          type: string
        path:
          type: [string, "null"]
        resolved:
          type: boolean

    TermInput:
      description: A note of the project by its id, or plain words.
      oneOf:
        - $ref: "#/components/schemas/MemberRefInput"
        - type: object
          required: [text]
          additionalProperties: false
          properties:
            text:
              type: string
              pattern: "\\S"

    RecordClauseInput:
      description: |
        One thing a record line says beside its text, which is always a note
        of the project. `target` is who a relationship is with. `at` takes a
        place, `when` a time, and `with` any other note. Plain words belong
        in the line's `text`.
      oneOf:
        - type: object
          required: [kind, term]
          additionalProperties: false
          properties:
            kind:
              type: string
              enum: [target, at, when, with]
            term:
              $ref: "#/components/schemas/MemberRefInput"
        - type: object
          description: The older way to say a period, taken so that a line read with one can be sent back.
          required: [kind, start, end]
          additionalProperties: false
          properties:
            kind:
              type: string
              const: span
            start:
              $ref: "#/components/schemas/TermInput"
            end:
              $ref: "#/components/schemas/TermInput"

    RecordLineInput:
      type: object
      description: One line of a note's world status or relationships.
      required: [label]
      additionalProperties: false
      properties:
        label:
          type: string
          pattern: "\\S"
          description: The word the line stands under, by its path in the kind's `world-status` or `relationship` vocabulary, such as `Mood/Calm`.
        labelPath:
          type: [string, "null"]
          description: Given by a read and not looked at here.
        text:
          type: string
          default: ""
        clauses:
          type: array
          items:
            $ref: "#/components/schemas/RecordClauseInput"

    PointOfViewInput:
      description: Whose eyes a scene is seen through. Null for none said.
      oneOf:
        - type: "null"
        - type: object
          required: [mode]
          additionalProperties: false
          properties:
            mode:
              type: string
              enum: [omniscient, multiple]
        - type: object
          required: [mode, character]
          additionalProperties: false
          properties:
            mode:
              type: string
              const: character
            character:
              $ref: "#/components/schemas/MemberRefInput"

    ManuscriptLinkInput:
      description: A manuscript note a scene is written in. Either the note by its address, or a link as a read gave it, which is kept as it is.
      oneOf:
        - type: object
          required: [relativePath]
          additionalProperties: false
          properties:
            relativePath:
              type: string
              minLength: 1
              description: The note's address in the manuscript, as `listManuscriptNotes` gives it.
        - type: object
          required: [link]
          additionalProperties: false
          properties:
            link:
              type: string
              pattern: "^\\[\\[.+\\]\\]$"
            path:
              type: [string, "null"]

    EntityTimeInput:
      description: When a time is. Looked at for a note of the kind `time` only. Null leaves it as it is.
      oneOf:
        - type: "null"
        - type: object
          additionalProperties: false
          properties:
            kind:
              type: [string, "null"]
              enum: [point, period, null]
            start:
              oneOf:
                - $ref: "#/components/schemas/TermInput"
                - type: "null"
            end:
              oneOf:
                - $ref: "#/components/schemas/TermInput"
                - type: "null"

    CharacterCreate:
      type: object
      description: "A character to make. Only the name is needed."
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "\\S"
          maxLength: 200
        role:
          $ref: "#/components/schemas/CharacterRole"
        aliases:
          type: array
          description: Other names the note goes by.
          items:
            type: string
        categories:
          type: array
          description: The words of the kind's `category` vocabulary the note is sorted under, each by its path in the tree.
          items:
            type: string
        progressStatus:
          oneOf:
            - $ref: "#/components/schemas/ProgressStatus"
            - type: "null"
        color:
          oneOf:
            - $ref: "#/components/schemas/Color"
            - type: "null"
        oneSentenceStoryline:
          type: string
        motivation:
          type: string
        goal:
          type: string
        conflict:
          type: string
        growth:
          type: string
        oneParagraphStoryline:
          type: string
        characterSynopsis:
          type: string
        characterProfile:
          type: string
        worldStatus:
          type: array
          items:
            $ref: "#/components/schemas/RecordLineInput"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/RecordLineInput"
        customFields:
          type: array
          description: The fields the author added, in order. No two may share a title.
          items:
            $ref: "#/components/schemas/CustomField"
        createMissingVocabulary:
          type: boolean
          default: false
          description: Add a category or a label the vocabulary does not have yet. Left false, such a word is refused, so a slip in spelling cannot grow the vocabulary.

    CharacterPatch:
      type: object
      description: "What to change of a character. A character read and sent back whole is taken, and only these are looked at."
      additionalProperties: false
      x-snowflake-echo: "#/components/schemas/Character"
      properties:
        name:
          type: string
          pattern: "\\S"
          maxLength: 200
        role:
          $ref: "#/components/schemas/CharacterRole"
        aliases:
          type: array
          description: Other names the note goes by.
          items:
            type: string
        categories:
          type: array
          description: The words of the kind's `category` vocabulary the note is sorted under, each by its path in the tree.
          items:
            type: string
        progressStatus:
          oneOf:
            - $ref: "#/components/schemas/ProgressStatus"
            - type: "null"
        color:
          oneOf:
            - $ref: "#/components/schemas/Color"
            - type: "null"
        oneSentenceStoryline:
          type: string
        motivation:
          type: string
        goal:
          type: string
        conflict:
          type: string
        growth:
          type: string
        oneParagraphStoryline:
          type: string
        characterSynopsis:
          type: string
        characterProfile:
          type: string
        worldStatus:
          type: array
          items:
            $ref: "#/components/schemas/RecordLineInput"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/RecordLineInput"
        customFields:
          type: array
          description: The fields the author added, in order. No two may share a title.
          items:
            $ref: "#/components/schemas/CustomField"
        createMissingVocabulary:
          type: boolean
          default: false
          description: Add a category or a label the vocabulary does not have yet. Left false, such a word is refused, so a slip in spelling cannot grow the vocabulary.

    SceneCreate:
      type: object
      description: "A scene to make. Only the title is needed."
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          pattern: "\\S"
          maxLength: 200
        aliases:
          type: array
