              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StickyNote"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/sticky-notes/{stickyNoteId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/StickyNoteId"
    get:
      operationId: getStickyNote
      tags: [Sticky notes]
      summary: Get one sticky note
      description: |
        One sticky note with everything it says, and the version to send
        back with a change.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The sticky note.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StickyNote"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateStickyNote
      tags: [Sticky notes]
      summary: Change a sticky note
      description: |
        Changes what a sticky note says, its tint, or whether it is set
        aside. Send the `etag` the note was read with in `If-Match`. Where the
        author has typed in the note since, the answer is `412` and nothing is
        written.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, precondition-required, concurrent-change]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/StickyNotePatch"
      responses:
        "200":
          description: The sticky note as it now stands.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StickyNote"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteStickyNote
      tags: [Sticky notes]
      summary: Delete a sticky note
      description: |
        Sends a sticky note to the trash the author chose in Obsidian's
        settings. Send the `etag` the note was read with in `If-Match`.
      x-snowflake-access: delete
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, precondition-required, concurrent-change]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: The sticky note is gone.
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/statistics/counts:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getWritingCounts
      tags: [Statistics]
      summary: Count the writing of a project
      description: |
        How much is written in the whole project and in its manuscript alone,
        counted by the convention the author chose. The answer says which
        convention that was.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WritingCounts"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/statistics/prose:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProseStatistics
      tags: [Statistics]
      summary: Get the prose statistics
      description: |
        The manuscript's notes in reading order, each with its length, its
        words, its sentences and how much of it is dialogue, and the same for the
        manuscript as a whole. Dialogue is what stands inside the quotation marks
        the author's settings read.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProseStatisticsPage"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/statistics/words:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getWordFrequency
      tags: [Statistics]
      summary: List the words used most
      description: |
        The words of the manuscript by how often each is used, the commonest
        first. Common words such as "the", and the names of the project's own
        notes, are left out unless asked for. `tokens` is every word counted
        before anything was left out, so a word's share of the writing can be
        worked out.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - name: includeStopwords
          in: query
          description: "Keep the common words that are left out by default."
          schema:
            type: boolean
            default: false
        - name: includeNames
          in: query
          description: "Keep the names and aliases of the project's characters, scenes and worldbuilding notes."
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The words.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordFrequencyPage"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/statistics/sensitive-words:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getSensitiveWords
      tags: [Statistics]
      summary: Find the words the author watches for
      description: |
        The author keeps a list of words to watch for in the plugin's
        settings. This gives each of them with how often the manuscript uses it.
        Ask for `include=occurrences` to have every place as well.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - name: include
          in: query
          description: "What to add to each word. `occurrences` adds every place the manuscript uses it."
          schema:
            type: array
            items:
              type: string
              enum: [occurrences]
      responses:
        "200":
          description: The words and how often each is used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensitiveWords"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/statistics/dialogue:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getDialogue
      tags: [Statistics]
      summary: List the notes that hold dialogue
      description: |
        The manuscript's notes that hold quoted speech, in reading order, each
        with how many quoted stretches it holds. The answer says which quotation
        marks were read, which is the author's setting.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The notes and how much dialogue each holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DialoguePage"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/manuscript/notes/{notePath}/dialogue:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/NotePath"
    get:
      operationId: listNoteDialogue
      tags: [Statistics]
      summary: List the dialogue of one manuscript note
      description: |
        Every quoted stretch of one manuscript note, in the order it is read
        in, quotation marks included, with where it stands in the note's text.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: advanced
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The quoted stretches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDialoguePage"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/mentions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getMentions
      tags: [Mentions]
      summary: List who and what the manuscript mentions
      description: |
        The characters, scenes and worldbuilding notes the manuscript names,
        in the order each is first named, with how often, where first and last,
        and how often in each note. Only mentions that are certain are counted
        here. `unresolved` is how many more could mean more than one note.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - name: kind
          in: query
          description: "Give only notes of this kind, by its `kindId`."
          schema:
            type: string
            minLength: 1
        - name: member
          in: query
          description: "Give only the note with this id."
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The mentions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentionPage"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/manuscript/notes/{notePath}/mentions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/NotePath"
    get:
      operationId: listNoteMentions
      tags: [Mentions]
      summary: List the mentions in one manuscript note
      description: |
        Every place one manuscript note names a character, a scene or a
        worldbuilding note, in reading order, with where it stands in the note's
        text and how sure the match is.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The mentions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteMentionPage"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/writing/days:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listWritingDays
      tags: [Writing sessions]
      summary: List the writing done day by day
      description: |
        Every day of a stretch, oldest first, with how long the author sat
        writing and how many words that added and took away. A day nothing was
        written on is there at nothing. Left to itself this gives the thirty
        days ending today. A stretch may run to a year and a day.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - name: from
          in: query
          description: "The first day of the stretch. Left out, the stretch is thirty days long."
          schema:
            $ref: "#/components/schemas/Day"
        - name: through
          in: query
          description: "The last day of the stretch. Left out, it is today."
          schema:
            $ref: "#/components/schemas/Day"
      responses:
        "200":
          description: The days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WritingDays"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/writing/spread:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getWritingSpread
      tags: [Writing sessions]
      summary: Get how the writing is spread over the day
      description: |
        How the author's sittings fall over the parts of a day, and over the
        stages of the work: planning, drafting, revising and proofreading. A
        session does not record the minute each word arrived, so its words are
        shared out over the hours it ran in proportion to the writing time in
        each, and may come out as fractions.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - name: span
          in: query
          description: "Which sittings to read."
          schema:
            type: string
            enum: [today, yesterday, all]
            default: all
      responses:
        "200":
          description: The spread.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WritingSpread"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/writing/session:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getWritingSession
      tags: [Writing sessions]
      summary: Get the writing session under way
      description: |
        The session the author is in the middle of in this project, as it
        stands this moment, or none. One session runs at a time in a vault.
        Today's totals come with it either way.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The session, if any, and today so far.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WritingSession"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: startWritingSession
      tags: [Writing sessions]
      summary: Start a writing session
      description: |
        Starts the author's timer on a project: a stopwatch, a countdown
        or a pomodoro, on the clock the author has set. What the call leaves out
        is as the author has it. Only one session runs at a time, on one project,
        so a call is refused while one is under way anywhere.

        Words written through the API are not counted by a session. It counts
        what the author types.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 5 }
      x-snowflake-tier: advanced
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, session-running]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WritingSessionStart"
      responses:
        "201":
          description: The session that began.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WritingSession"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/history:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getHistory
      tags: [History]
      summary: Get what happened day by day
      description: |
        Every day of a stretch, oldest first, with what happened to the
        project's notes and records on it. Left to itself this gives the seven
        days ending today. A stretch may run to ninety-three days. The versions
        it reads are the ones the plugin has gathered from Obsidian's file
        recovery so far, which it does every few minutes.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - name: from
          in: query
          description: "The first day of the stretch. Left out, the stretch is seven days long."
          schema:
            $ref: "#/components/schemas/Day"
        - name: through
          in: query
          description: "The last day of the stretch. Left out, it is today."
          schema:
            $ref: "#/components/schemas/Day"
      responses:
        "200":
          description: The days and what happened on each.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/History"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/derived-tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listDerivedTasks
      tags: [Tasks]
      summary: List the tasks the plugin derives
      description: |
        The cards the plugin puts on the task board by itself: where the
        writing stands against the author's daily, weekly and monthly goal, and
        what is waiting to be seen to elsewhere, such as mentions that could
        mean more than one note or revisions not yet decided. They are worked out
        afresh each time and cannot be changed.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The derived tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DerivedTasks"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/timeline:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getTimeline
      tags: [Timeline]
      summary: Get the timelines and their views
      description: |
        Every timeline of the project with the times it names, the rows
        under each and the scenes on each row, and every view with the timelines
        it shows and the order it shows the times in. A project that has made no
        timeline yet has one empty view.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The timelines and the views.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineBoard"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/beat-sheets:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listBeatSheets
      tags: [Beat sheets]
      summary: List the beat sheets
      description: |
        The project's beat sheets in the order they were made, each with how
        many acts, beats and placed scenes it holds. Read one sheet for what is
        on it.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The beat sheets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeatSheetList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createBeatSheet
      tags: [Beat sheets]
      summary: Create a beat sheet
      description: |
        Starts a beat sheet from one of the templates, the plugin's own or
        the author's, with its acts and beats laid out and no scene placed. The
        plugin's own templates are worded in the project's language. The author
        is left looking at the sheet they were looking at.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 3 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, duplicate-name]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeatSheetCreate"
      responses:
        "201":
          description: The beat sheet that was made.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeatSheet"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/beat-sheets/{beatSheetId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/BeatSheetId"
    get:
      operationId: getBeatSheet
      tags: [Beat sheets]
      summary: Get one beat sheet
      description: |
        One beat sheet with its acts in the story's order, the beats of each
        act, the rows under each beat and the scenes placed on each row.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The beat sheet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeatSheet"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateBeatSheet
      tags: [Beat sheets]
      summary: Change a beat sheet
      description: |
        Changes a beat sheet's name and how it is drawn. Its acts, beats
        and rows are changed by operations of their own.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 3 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, duplicate-name]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/BeatSheetPatch"
      responses:
        "200":
          description: The beat sheet as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeatSheet"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteBeatSheet
      tags: [Beat sheets]
      summary: Delete a beat sheet
      description: |
        Takes a beat sheet away with its acts, beats and rows. The scenes
        it placed are notes of their own, and stand.
      x-snowflake-access: delete
      x-snowflake-availability: { status: available, round: 3 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived]
      responses:
        "204":
          description: The beat sheet is gone.
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/beat-sheet-templates:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listBeatSheetTemplates
      tags: [Beat sheets]
      summary: List the beat sheet templates
      description: |
        The structures a new beat sheet can be started from: the ones the
        plugin ships, worded in the project's language, then the ones the author
        saved in this project.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: advanced
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The templates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeatSheetTemplateList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: saveBeatSheetTemplate
      tags: [Beat sheets]
      summary: Save a beat sheet as a template
      description: |
        Keeps the acts and beats of a beat sheet as a template of the
        author's own, to start other sheets from. A template of that name is
        replaced.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 3 }
      x-snowflake-tier: advanced
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeatSheetTemplateSave"
      responses:
        "201":
          description: The templates there now are.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeatSheetTemplateList"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/freeform-views:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listFreeformViews
      tags: [Freeform]
      summary: List the freeform views
      description: |
        The project's freeform views in the order they were made, each with
        how many cards, frames and lines it holds. Read one view for what is on
        it.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The freeform views.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeformViewList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createFreeformView
      tags: [Freeform]
      summary: Create a freeform view
      description: |
        Makes a view with nothing on it yet, under a name no other view of
        the project has.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 3 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, duplicate-name]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreeformViewCreate"
      responses:
        "201":
          description: The view that was made.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeformView"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/freeform-views/{freeformViewId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/FreeformViewId"
    get:
      operationId: getFreeformView
      tags: [Freeform]
      summary: Get one freeform view
      description: |
        One freeform view with every card on it and what the card shows,
        every frame, every line, and where each stands on the canvas.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The freeform view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeformView"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateFreeformView
      tags: [Freeform]
      summary: Rename a freeform view
      description: |
        Gives a view another name. What stands on it is changed with
        `applyFreeformSteps`.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 3 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, duplicate-name]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/FreeformViewPatch"
      responses:
        "200":
          description: The view as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeformView"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteFreeformView
      tags: [Freeform]
      summary: Delete a freeform view
      description: |
        Sends a view to the trash with everything on it. What its cards
        show are things of their own, and stand.
      x-snowflake-access: delete
      x-snowflake-availability: { status: available, round: 3 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived]
      responses:
        "204":
          description: The view is gone.
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/relationship-graph:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getRelationshipGraph
      tags: [Relationship graph]
      summary: Get the relationship graph
      description: |
        Every character, scene and worldbuilding note as a node, and every
        relationship a note records as a line from it to the note it points at.
        A relationship that points at a note that is gone has a node of its own,
        so a broken link shows.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipGraph"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/archive:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: archiveProject
      tags: [Projects]
      summary: Archive a project
      description: |
        Moves a project into the archive folder beside the others. Nothing of
        it is deleted, and `restoreProject` brings it back. An archived project
        can still be read. This is the way to put a project away: the API does
        not delete projects.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, path-conflict, archive-folder-is-project, link-updates-ask]
      responses:
        "200":
          description: The project where it stands now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/restore:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: restoreProject
      tags: [Projects]
      summary: Restore an archived project
      description: |
        Moves an archived project back beside the others. Where another
        project took its title while it was away, it comes back under the first
        free one, such as "Name 2", and the answer says what it was called.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, not-archived, path-conflict, link-updates-ask]
      responses:
        "200":
          description: The project as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoredProject"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/repair:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: repairProject
      tags: [Projects]
      summary: Repair a project
      description: |
        Puts back what a project is missing: a folder, a step's note, a
        template, the note its manuscript begins with. Nothing the author wrote
        is changed or removed. What cannot be put right this way is left, and
        the health in the answer still names it.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, link-updates-ask]
      responses:
        "200":
          description: What was done, and the health of the project after it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRepair"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/characters/{characterId}/move:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/CharacterId"
    post:
      operationId: moveCharacter
      tags: [Characters]
      summary: Move a character in the author's order
      description: |
        Puts the character at another place in the author's list: at an index,
        or before or after another character. Its place is kept in the note, so the
        note's `etag` moves on.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, invalid-reference]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberMove"
      responses:
        "200":
          description: The character where it now stands.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/scenes/{sceneId}/move:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/SceneId"
    post:
      operationId: moveScene
      tags: [Scenes]
      summary: Move a scene in the author's order
      description: |
        Puts the scene at another place in the author's list: at an index,
        or before or after another scene. Its place is kept in the note, so the
        note's `etag` moves on.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, invalid-reference]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberMove"
      responses:
        "200":
          description: The scene where it now stands.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/entities/{entityId}/move:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EntityId"
    post:
      operationId: moveEntity
      tags: [Entities]
      summary: Move a worldbuilding note in the author's order
      description: |
        Puts the worldbuilding note at another place in the author's list: at an index,
        or before or after another worldbuilding note of its kind. Its place is kept in the note, so the
        note's `etag` moves on.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, invalid-reference]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberMove"
      responses:
        "200":
          description: The worldbuilding note where it now stands.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entity"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/members/{memberId}/usage:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/MemberId"
    get:
      operationId: getMemberUsage
      tags: [Members]
      summary: Get what names a note
      description: |
        Which other notes of the project name a character, a scene or a
        worldbuilding note, split by what deleting it would cost each. A note
        that lists it among others would lose the entry. A note that names it
        where only one note fits, or in a sentence of its own, would be left
        pointing at nothing. Ask this before a delete.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The notes that name it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberUsageReport"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/vocabularies/{vocabulary}/{kindId}/nodes:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/Vocabulary"
      - $ref: "#/components/parameters/KindId"
    post:
      operationId: createDefinitionNode
      tags: [Vocabularies]
      summary: Add a word to a vocabulary
      description: |
        Adds a word to one kind's tree of one vocabulary, by its path. The
        words above it are added too where the tree does not have them yet. A
        word the tree already has is refused.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, duplicate-name, invalid-segment, too-deep]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefinitionNodeCreate"
      responses:
        "201":
          description: The word that was added.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefinitionNode"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/manuscript/numbering:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: planManuscriptNumbering
      tags: [Manuscript]
      summary: Plan the numbering around a new or a leaving note
      description: |
        What the author's chapter numbering rule would do if a note were made
        at a place in the manuscript, or one were taken from it: the numbered
        name the new note is offered, and the notes after it that would be
        renamed by one. Say one of `after`, `position` or `remove`. Nothing is
        changed.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - name: after
          in: query
          description: "Plan for a new note after this one, by its `relativePath`."
          schema:
            type: string
            minLength: 1
        - name: position
          in: query
          description: "Plan for a new note at the start or at the end of the manuscript."
          schema:
            type: string
            enum: [start, end]
        - name: remove
          in: query
          description: "Plan for this note leaving the manuscript, by its `relativePath`."
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: What the rule would do.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberingPlan"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/manuscript/notes/{notePath}/body:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/NotePath"
    put:
      operationId: writeManuscriptNoteBody
      tags: [Manuscript]
      summary: Write the text of a manuscript note
      description: |
        Replaces the whole text of one manuscript note. Send the `etag` the
        note was read with in `If-Match`. Where the author has typed in the note
        since, the answer is `412` with the version it now stands at, and
        nothing is written. To propose a change and leave the text to the author,
        make a revision instead.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, precondition-required, concurrent-change]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManuscriptNoteBody"
      responses:
        "200":
          description: The note as it now stands.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManuscriptNote"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/manuscript/notes/{notePath}/rename:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/NotePath"
    post:
      operationId: renameManuscriptNote
      tags: [Manuscript]
      summary: Rename a manuscript note
      description: |
        Gives one manuscript note a new title. The note keeps its place in
        the reading order and takes a new address, which the answer gives, and
        every link to it follows. Its first heading takes the title too where it
        said the old one, unless `heading` says otherwise.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, path-conflict, link-updates-ask]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManuscriptNoteRename"
      responses:
        "200":
          description: The note under its new title.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManuscriptNoteResult"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/manuscript/notes/{notePath}/split:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/NotePath"
    post:
      operationId: splitManuscriptNote
      tags: [Manuscript]
      summary: Split a manuscript note in two
      description: |
        Cuts one manuscript note in two. What stands from the cut onwards
        moves into a new note right after it, and the revisions and
        foreshadowing marked there move with it. Say where to cut by the words
        the second note should begin with, or by a place in the text. Send the
        `etag` the note was read with in `If-Match`.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, precondition-required, concurrent-change, path-conflict, passage-not-found, ambiguous-passage, link-updates-ask]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManuscriptNoteSplit"
      responses:
        "201":
          description: The new note, and what was renamed around it.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManuscriptNoteResult"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/manuscript/notes/{notePath}/merge-next:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/NotePath"
    post:
      operationId: mergeManuscriptNoteWithNext
      tags: [Manuscript]
      summary: Merge a manuscript note with the one after it
      description: |
        Joins a manuscript note with the note after it. The earlier note
        keeps its title and its place and takes the later one's text after its
        own, with what was marked there. The later note goes to the trash. The
        words are counted as moved and not as written.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, nothing-to-merge, path-conflict, link-updates-ask]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManuscriptNoteMerge"
      responses:
        "200":
          description: The note that took both, and what was renamed around it.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManuscriptNoteResult"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/tasks/{taskId}/move:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    post:
      operationId: moveTask
      tags: [Tasks]
      summary: Move a task on the board
      description: |
        Puts a task in a column, before another task of that column or at
        the column's end. Left without a column, it is moved within its own.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, invalid-reference]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskMove"
      responses:
        "200":
          description: The task where it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/archived-tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    delete:
      operationId: purgeArchivedTasks
      tags: [Tasks]
      summary: Delete every archived task
      description: |
        Takes every task the author set aside off the board for good, and
        says how many went. A task brought back in the meantime is spared.
      x-snowflake-access: delete
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: advanced
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived]
      responses:
        "200":
          description: How many tasks went.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPurge"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/foreshadowing/{foreshadowingId}/occurrences:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ForeshadowingId"
    post:
      operationId: addForeshadowingOccurrence
      tags: [Foreshadowing]
      summary: Mark a place a thread appears
      description: |
        Ties a thread to a passage of a manuscript note, as a plant, an echo
        or a payoff. The passage is named by its words, with a few of the words
        around them where the note says them more than once, or by where it
        stands. The manuscript is not touched.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, passage-not-found, ambiguous-passage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OccurrenceCreate"
      responses:
        "201":
          description: The appearance that was marked, with the id it was given.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/foreshadowing/{foreshadowingId}/occurrences/{occurrenceId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ForeshadowingId"
      - $ref: "#/components/parameters/OccurrenceId"
    patch:
      operationId: updateForeshadowingOccurrence
      tags: [Foreshadowing]
      summary: Change a place a thread appears
      description: |
        Changes what an appearance does for the thread and the author's
        remark on it. Where a `passage` is sent, the appearance is put on
        those words instead, in the note it stands in or in the one `note`
        names.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, passage-not-found, ambiguous-passage]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/OccurrencePatch"
      responses:
        "200":
          description: The appearance as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteForeshadowingOccurrence
      tags: [Foreshadowing]
      summary: Unmark a place a thread appears
      description: |
        Takes one appearance off a thread. The thread stands even where it
        was the last.
      x-snowflake-access: delete
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived]
      responses:
        "204":
          description: The appearance is gone.
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/search:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: searchProject
      tags: [Projects]
      summary: Search a project for words
      description: |
        Finds words in the notes of one project: its manuscript, the notes of
        its steps, its characters, its scenes and its worldbuilding. Each place
        found is told with the note it stands in and the line around it.

        In a manuscript note the words are looked for in the whole text, as it
        is written. In any other note they are looked for in each thing the note
        says of itself, and `field` names which. The words are taken as they are
        typed and never as an expression. Whole words are told as the plugin's
        own find bar tells them, so in Chinese, Japanese and Korean every match
        counts as one.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 2 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - name: q
          in: query
          required: true
          description: "The words to look for."
          schema:
            type: string
            minLength: 1
            maxLength: 1000
        - name: in
          in: query
          description: "Which notes to look in: the manuscript, the other notes, or all of them."
          schema:
            type: string
            enum: [manuscript, notes, all]
            default: all
        - name: caseSensitive
          in: query
          description: "Whether capitals must match."
          schema:
            type: boolean
            default: false
        - name: wholeWord
          in: query
          description: "Whether the words must stand as whole words."
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The places found, the manuscript first in reading order and then the other notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPage"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/replace:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: replaceInProject
      tags: [Manuscript]
      summary: Replace words across the manuscript
      description: |
        Puts other words in place of every match in the manuscript's notes,
        or in the ones named. Sent with `dryRun`, nothing is written and the
        answer says what would be.

        Each note is changed as one note is: what the author typed and had not
        saved is saved first, the words are found in that, and the author's
        editor on the note is closed. A note the author typed into in that very
        moment is left as it is and told under `skipped`, and the rest go on. So
        is a note a newer version of the plugin wrote.

        A revision or an appearance of a thread whose passage is changed loses
        its place. `marksLost` says how many would, so a dry run shows it before
        anything is written.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 2 }
      x-snowflake-tier: advanced
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceRequest"
      responses:
        "200":
          description: What was replaced, or would be, note by note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplaceResult"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/revisions/{revisionId}/accept:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RevisionId"
    post:
      operationId: acceptRevision
      tags: [Revisions]
      summary: Accept a proposed revision
      description: |
        Makes the change a revision proposes in its manuscript note, and
        takes the revision away. The passage is found again in the note as it
        stands, with what the author typed and had not saved in it. A revision
        whose words the note no longer has is refused, and so is one whose note
        has left the manuscript. `discardRevision` takes such a one away.

        The words written are not counted as the author's own typing.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 2 }
      x-snowflake-tier: advanced
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, passage-not-found, concurrent-change]
      responses:
        "200":
          description: The note as it now stands.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManuscriptNote"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/manuscript/notes/{notePath}/move:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/NotePath"
    post:
      operationId: moveManuscriptNote
      tags: [Manuscript]
      summary: Move a manuscript note
      description: |
        Puts a note at another place in the reading order: after a note
        that is named, or at the start or the end.

        Only the order changes. A note keeps the name it has, so a manuscript
        whose notes are numbered may read out of count afterwards.
        `renameManuscriptNote` gives a note another name. The order is a number
        each note keeps in its properties, so the note's `etag` changes with it.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 2 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManuscriptNoteMove"
      responses:
        "200":
          description: The note where it now stands.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManuscriptNoteResult"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/manuscript/notes/{notePath}/append:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/NotePath"
    post:
      operationId: appendManuscriptNoteBody
      tags: [Manuscript]
      summary: Add text to the end of a manuscript note
      description: |
        Puts text after everything a note already says, with a blank line
        between. It needs no version: what the author typed and had not saved is
        saved first, and the text goes after it. The author's editor on the note
        is then closed.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 2 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, concurrent-change]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManuscriptNoteAppend"
      responses:
        "200":
          description: The note as it now stands.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManuscriptNote"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/health/repair:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: repairProjectIssue
      tags: [Projects]
      summary: Repair one thing the health check found
      description: |
        Mends one issue of a project's health and nothing else, where
