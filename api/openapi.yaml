          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForeshadowingPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createForeshadowing
      tags: [Foreshadowing]
      summary: Create a foreshadowing thread
      description: |
