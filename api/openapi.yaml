  /projects/{projectId}/manuscript:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getManuscript
      tags: [Manuscript]
      summary: Get the manuscript's size and where it stands
      description: |
        How many notes the manuscript has, how much is written in them, and
        the folder they stand in. The count follows the convention the author
        chose in the plugin's settings, which the answer names.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The manuscript.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manuscript"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/manuscript/notes:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listManuscriptNotes
      tags: [Manuscript]
      summary: List the manuscript's notes
      description: |
        The notes of the manuscript in reading order, each by its title and
        where it stands. A list gives no text. Read one note for its text. A
        manuscript can run to thousands of notes, so the list comes a page at
        a time. Ask for `include=counts` to have each note's size as well.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - name: include
          in: query
          description: What to add to each note. `counts` adds how much is written in it.
          schema:
            type: array
            items:
              type: string
              enum: [counts]
        - $ref: "#/components/parameters/NameQuery"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManuscriptNotePage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createManuscriptNote
      tags: [Manuscript]
      summary: Create a manuscript note
      description: |
        Makes a note in the manuscript: after another note, at the start, or
        at the end, which is where it goes when nothing is said. It holds the
        text sent with it, or the plugin's own first line for a new note. Left
        without a title, it takes the numbered name the author's numbering rule
        offers at that place.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, path-conflict, link-updates-ask]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManuscriptNoteCreate"
      responses:
        "201":
          description: The note that was made, and what was renamed around it.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManuscriptNoteResult"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/manuscript/notes/{notePath}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/NotePath"
    get:
      operationId: getManuscriptNote
      tags: [Manuscript]
      summary: Read one manuscript note
      description: |
        One note of the manuscript with its whole text, how much is written
        in it, and the notes before and after it. The text is everything
        under the note's properties, as Markdown.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The note.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManuscriptNote"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteManuscriptNote
      tags: [Manuscript]
      summary: Delete a manuscript note
      description: |
        Sends one manuscript note to the trash the author chose in
        Obsidian's settings, with everything written in it. Send the `etag` the
        note was read with in `If-Match`. Its words count as deleted in the
        author's writing statistics, as they do however a note is deleted.
      x-snowflake-access: delete
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, precondition-required, concurrent-change, path-conflict, link-updates-ask]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - name: renumber
          in: query
          description: "Whether the numbered notes after it are renamed by one to keep the count, where the author's numbering rule is on."
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: What was deleted and what was renamed after it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManuscriptNoteDeletion"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listTasks
      tags: [Tasks]
      summary: List the tasks
      description: |
        The author's tasks in the order of the board: column by column, each
        column from its top. Tasks set aside in the archive are left out
        unless `state` asks for them.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - $ref: "#/components/parameters/ArchiveState"
        - name: status
          in: query
          description: Give only tasks in this column.
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: priority
          in: query
          description: Give only tasks of this priority.
          schema:
            $ref: "#/components/schemas/TaskPriority"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTask
      tags: [Tasks]
      summary: Create a task
      description: |
        Adds a task to the author's board, at the end of its column. Only a
        title is needed, and it must be one no other task of the project has.
        The notes it is about are given by their ids.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, duplicate-name, invalid-reference]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: The task that was made.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: getTask
      tags: [Tasks]
      summary: Get one task
      description: |
        One task with the notes it is about, each told as the note it leads
        to now.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateTask
      tags: [Tasks]
      summary: Change a task
      description: |
        Changes what is sent and leaves the rest as it is. A task given
        another column goes to that column's end. Send `archived` to set a task
        aside or to bring it back. A title another task has is refused.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, duplicate-name, invalid-reference]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/TaskPatch"
      responses:
        "200":
          description: The task as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteTask
      tags: [Tasks]
      summary: Delete a task
      description: |
        Takes one task off the board for good. To set a task aside and keep
        it, change `archived` instead.
      x-snowflake-access: delete
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived]
      responses:
        "204":
          description: The task is gone.
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/foreshadowing:
