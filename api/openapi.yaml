openapi: 3.1.0

info:
  title: Snowflake Method local API
  version: 1.0.0
  summary: Read and write a writer's Snowflake projects from the same computer.
  description: |
    The Snowflake Method plugin for Obsidian answers this API on the computer it
    runs on, and nowhere else. It is off until the author switches it on in the
    plugin's settings.

    **What it covers.** The plugin's own things: projects, steps, characters,
    scenes, worldbuilding, the manuscript, tasks, foreshadowing, revisions and
    sticky notes. Every note it returns carries its `path` in the vault. For
    plain vault work on that path (reading any file, searching, properties,
    tags) use Obsidian's own command line.

    **Access.** The author chooses one of three levels: read only, read and
    write, or read, write and delete. Each operation says which it needs in
    `x-snowflake-access`.

    **Identity.** Projects, characters, scenes, worldbuilding notes, tasks,
    foreshadowing and revisions have stable ids. A manuscript note has none, so
    it is addressed by its path inside the project, percent-encoded into one
    path segment. Renaming such a note changes its address, and the answer
    says where it went.

    **Reading.** A read changes nothing the author wrote. The plugin may still
    put two things right as it reads, as it does whenever it opens a project
    itself. A project whose folder was moved has its link to the first note of
    its manuscript pointed at where that note stands now. A record file that
    can no longer be read is set aside whole under a new name, and read as
    empty.

    **Changing a note.** A note-backed thing carries an `etag`. Send it back in
    `If-Match` when you change or delete that thing. If the note has changed
    since you read it, the answer is `412` with the current `etag`, and nothing
    is written. Read it again and decide again.

    **Partial changes.** A `PATCH` body follows RFC 7396. A property left out
    is left as it is, `null` clears it, and a list replaces the old list whole.

    **Errors.** Every error is a problem document with a stable `code`. Branch
    on the code, never on the words. `x-snowflake-problems` lists every code.

    **Language.** A project is written in one of eight languages, which names
    its folders and files. Property names and listed values here are the same
    in every language. Titles, names and paths are the author's own text.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://127.0.0.1:{port}/v1
    description: The plugin's own listener, on this computer only.
    variables:
      port:
        default: "27125"
        description: The port chosen in the plugin's settings.

security:
  - bearer: []

tags:
  - name: Service
    description: What this API is, whether it is ready, and its own description.
  - name: Projects
    description: |
      A project is one novel in the making. It is a folder in the vault with
      the notes of its ten steps, its characters, scenes and worldbuilding,
      and its manuscript.
  - name: Steps
    description: |
      The ten steps of the Snowflake Method, each with a status the author
      sets. Steps 1, 2, 4 and 6 are written in a note of their own, which is
      read and written here. Steps 3, 5 and 7 are written in the character
      notes, 8 and 9 in the scene notes, and 10 is the manuscript.
  - name: Kinds
    description: |
      The kinds of note a project keeps beside its manuscript: characters,
      scenes, and the kinds of worldbuilding. Time, location and item are
      built in, and an author may add kinds of their own, such as factions.
  - name: Members
    description: |
      Every character, scene and worldbuilding note of a project in one
      list, for finding a note's `id` by its name.
  - name: Characters
    description: |
      A character is a note that grows over three steps: a sheet in step 3, a
      synopsis in step 5 and a full profile in step 7.
  - name: Scenes
    description: |
      A scene is a note in the scene list of step 8, with who is in it, where
      and when it happens, and what happens. Step 9 plans it further.
  - name: Entities
    description: |
      A worldbuilding note: a time, a place, an item, or a note of a kind
      the author made.
  - name: Vocabularies
    description: |
      The words a project has agreed on, each a small tree per kind.
      `category` sorts notes. `world-status` and `relationship` name the
      lines a note keeps about how it stands in the world and with others.
  - name: Field templates
    description: |
      A field template is a set of extra fields with starting text. A kind
      can have one as its default, and new notes of that kind begin with it.
  - name: Manuscript
    description: |
      The manuscript is step 10: the novel itself, as notes in the project's
      draft folder, in the order the author reads them in. A note is a
      chapter, a scene, or whatever unit the author writes in. It has no id.
      It is addressed by where it stands inside the project, and renaming it
      changes that address.
  - name: Tasks
    description: |
      The author's own to-do list for a project, as the cards of its task
      board. A task can name the characters, scenes and other notes it is
      about.
  - name: Foreshadowing
    description: |
      A foreshadowing is a thread the author is laying through the
      manuscript: something planted early and paid off later. Each place it
      appears is an occurrence, tied to a passage of a manuscript note.
  - name: Revisions
    description: |
      A revision is a change proposed to a passage of the manuscript and not
      yet made: a replacement, an insertion or a deletion, with a comment. It
      stands beside the text as a card until the author accepts or discards
      it. To suggest a change without touching the author's prose, make one.
  - name: Sticky notes
    description: |
      Short notes the author keeps beside a project, each a small note of
      its own with a tint.

paths:
  /:
    get:
      operationId: getApiRoot
      tags: [Service]
      summary: Describe this API
      description: |
        Says what answers here and how far the caller may go. Without a token
        it gives the service's name and the contract's version and nothing
        else. With one it adds the plugin's version, the vault's name, the
        access level and the limits in force.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-direct: true
      security: []
      responses:
        "200":
          description: What answers here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiRoot"
        default:
          $ref: "#/components/responses/Problem"

  /ready:
    get:
      operationId: getReadiness
      tags: [Service]
      summary: Check whether the API is ready
      description: |
        Obsidian reads a vault for a moment after it opens, and the plugin
        cannot list projects until that is done. This answers at once either
        way, so a client can wait here instead of on its first real call.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-direct: true
      x-snowflake-errors: [not-ready]
      security: []
      responses:
        "200":
          description: The API is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        default:
          $ref: "#/components/responses/Problem"

  /openapi.json:
    get:
      operationId: getOpenApiDocument
      tags: [Service]
      summary: Get this API's description
      description: |
        The OpenAPI document of the operations this build answers. Operations
        planned for a later version are left out, and the server address
        carries the port in use.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-direct: true
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Problem"

  /projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List the projects
      description: |
        Every project under the folder the author keeps projects in, by
        title. Archived projects stand in a folder of their own and are left
        out unless `state` asks for them. Start here to find a project's `id`,
        which every other operation takes.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      parameters:
        - name: state
          in: query
          description: Which projects to list.
          schema:
            type: string
            enum: [active, archived, all]
            default: active
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      tags: [Projects]
      summary: Get a project
      description: |
        One project with its ten steps, how far it has come, how many
        characters, scenes and worldbuilding notes it holds, and where each of
        its folders stands in the vault. This reads every note of the project
        once and keeps the reading until a note changes, so it is quick to
        ask again.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/health:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectHealth
      tags: [Projects]
      summary: Check a project's health
      description: |
        What is wrong with the project's structure, if anything: a folder or a
        note that is missing, a link that leads nowhere, a name that has
        drifted from its file. Each issue says whether it blocks work and
        whether the plugin can repair it by itself. Ask this when another
        operation answers `invalid-managed-document` or `unsafe-section`.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The project's health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectHealth"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/steps:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listSteps
      tags: [Steps]
      summary: List a project's ten steps
      description: |
        The ten steps in order, each with its status and whether its work
        should be looked at again because a step before it has changed.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The ten steps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepList"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/steps/{step}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/StepNumber"
    get:
      operationId: getStep
      tags: [Steps]
      summary: Get one step
      description: |
        One step with its status, the steps it depends on, and the statuses
        it may be given.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The step.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Step"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/steps/{step}/text:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/StepNumber"
    get:
      operationId: getStepText
      tags: [Steps]
      summary: Read what a step says
      description: |
        The text of a step that is written in a note of its own: the summary
        of step 1 or 2, the synopsis of step 4 or 6. Each part of the note is
        a section with an id, given here under that id. The other steps have
        no note of their own and answer `not-found`: read characters for
        steps 3, 5 and 7, scenes for 8 and 9, and the manuscript for 10.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The step's text.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepText"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/kinds:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listKinds
      tags: [Kinds]
      summary: List the kinds of note a project keeps
      description: |
        Characters, scenes and every kind of worldbuilding note the project
        has, in the order the author keeps them, each with how many notes it
        holds and where its folder stands.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The kinds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KindList"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/kinds/{kindId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/KindId"
    get:
      operationId: getKind
      tags: [Kinds]
      summary: Get one kind
      description: |
        One kind with how many notes it holds, where its folder stands and
        which field template its new notes begin with.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The kind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kind"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listMembers
      tags: [Members]
      summary: List every character, scene and worldbuilding note
      description: |
        Every note of the project that has an `id`, of every kind, each with
        its name and the other names it goes by. Use it to find the `id` of
        something the author names, before reading it in full.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - name: kind
          in: query
          description: "Give only notes of this kind: `character`, `scene`, or a worldbuilding kind."
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/NameQuery"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPage"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/characters:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listCharacters
      tags: [Characters]
      summary: List the characters
      description: |
        The characters in the author's own order. A list gives each one in
        short: its name, its role and its one-sentence storyline. Ask for
        `view=full` to have everything, or read one character by its `id`.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - name: role
          in: query
          description: Give only characters of this role.
          schema:
            $ref: "#/components/schemas/CharacterRole"
        - $ref: "#/components/parameters/ProgressFilter"
        - $ref: "#/components/parameters/NameQuery"
        - $ref: "#/components/parameters/View"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterPage"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/characters/{characterId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/CharacterId"
    get:
      operationId: getCharacter
      tags: [Characters]
      summary: Get one character
      description: |
        One character in full: the sheet of step 3, the synopsis of step 5,
        the profile of step 7, how it stands in the world and with others, and
        any fields the author added.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The character.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/scenes:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listScenes
      tags: [Scenes]
      summary: List the scenes
      description: |
        The scenes in the order of the scene list. A list gives each one in
        short: its title, whose eyes it is seen through and its conflict. Ask
        for `view=full` to have everything, or read one scene by its `id`.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - name: character
          in: query
          description: Give only scenes this character is in, by the character's `id`.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/ProgressFilter"
        - $ref: "#/components/parameters/NameQuery"
        - $ref: "#/components/parameters/View"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The scenes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenePage"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/scenes/{sceneId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/SceneId"
    get:
      operationId: getScene
      tags: [Scenes]
      summary: Get one scene
      description: |
        One scene in full: who is in it, when and where it happens, what
        happens in it (step 8), how it is planned (step 9), and the manuscript
        notes it is written in.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The scene.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/entities:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listEntities
      tags: [Entities]
      summary: List the worldbuilding notes
      description: |
        The worldbuilding notes, kind by kind in the author's order. A list
        gives each one in short. Ask for `view=full` to have everything, or
        read one by its `id`. `kind` narrows the list to one kind.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - name: kind
          in: query
          description: Give only notes of this kind, by the kind's `id`.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/ProgressFilter"
        - $ref: "#/components/parameters/NameQuery"
        - $ref: "#/components/parameters/View"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The worldbuilding notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityPage"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/entities/{entityId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/EntityId"
    get:
      operationId: getEntity
      tags: [Entities]
      summary: Get one worldbuilding note
      description: |
        One worldbuilding note in full: its description, its own notes, how
        it stands in the world and with others, and for a time, when it is.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The worldbuilding note.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entity"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/vocabularies/{vocabulary}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/Vocabulary"
    get:
      operationId: getVocabulary
      tags: [Vocabularies]
      summary: Get one vocabulary across every kind
      description: |
        One vocabulary as every kind of the project keeps it: a tree of
        words for each kind. Read this before giving a note a category, a world
        status or a relationship, to use the words the author already has.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The vocabulary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vocabulary"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/vocabularies/{vocabulary}/{kindId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/Vocabulary"
      - $ref: "#/components/parameters/KindId"
    get:
      operationId: getVocabularyTree
      tags: [Vocabularies]
      summary: Get one kind's tree of a vocabulary
      description: |
        The words one kind keeps in one vocabulary, as a list in reading
        order, each with how deep it stands and how many notes use it.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefinitionTree"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/vocabularies/{vocabulary}/{kindId}/nodes/{taxonomyPath}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/Vocabulary"
      - $ref: "#/components/parameters/KindId"
      - $ref: "#/components/parameters/TaxonomyPath"
    get:
      operationId: getDefinitionNode
      tags: [Vocabularies]
      summary: Get one word of a vocabulary
      description: |
        One word of a vocabulary by its path in the tree, with what the
        author wrote that it means.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The word.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefinitionNode"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/field-templates:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listFieldTemplates
      tags: [Field templates]
      summary: List the field templates
      description: |
        Every field template of the project, kind by kind, each with
        whether it is the one new notes of its kind begin with.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - name: kind
          in: query
          description: Give only templates of this kind.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The field templates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldTemplateList"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/field-templates/{kindId}/{templateName}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/KindId"
      - $ref: "#/components/parameters/TemplateName"
    get:
      operationId: getFieldTemplate
      tags: [Field templates]
      summary: Get one field template
      description: |
        One field template with the fields it holds and the text each one
        starts with.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The field template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldTemplate"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/manuscript:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getManuscript
      tags: [Manuscript]
      summary: Get the manuscript's size and where it stands
      description: |
        How many notes the manuscript has, how much is written in them, and
        the folder they stand in. The count follows the convention the author
        chose in the plugin's settings, which the answer names.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The manuscript.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manuscript"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/manuscript/notes:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listManuscriptNotes
      tags: [Manuscript]
      summary: List the manuscript's notes
      description: |
        The notes of the manuscript in reading order, each by its title and
        where it stands. A list gives no text. Read one note for its text. A
        manuscript can run to thousands of notes, so the list comes a page at
        a time. Ask for `include=counts` to have each note's size as well.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - name: include
          in: query
          description: What to add to each note. `counts` adds how much is written in it.
          schema:
            type: array
            items:
              type: string
              enum: [counts]
        - $ref: "#/components/parameters/NameQuery"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManuscriptNotePage"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/manuscript/notes/{notePath}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/NotePath"
    get:
      operationId: getManuscriptNote
      tags: [Manuscript]
      summary: Read one manuscript note
      description: |
        One note of the manuscript with its whole text, how much is written
        in it, and the notes before and after it. The text is everything
        under the note's properties, as Markdown.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The note.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManuscriptNote"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listTasks
      tags: [Tasks]
      summary: List the tasks
      description: |
        The author's tasks in the order of the board: column by column, each
        column from its top. Tasks set aside in the archive are left out
        unless `state` asks for them.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - $ref: "#/components/parameters/ArchiveState"
        - name: status
          in: query
          description: Give only tasks in this column.
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: priority
          in: query
          description: Give only tasks of this priority.
          schema:
            $ref: "#/components/schemas/TaskPriority"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPage"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: getTask
      tags: [Tasks]
      summary: Get one task
      description: |
        One task with the notes it is about, each told as the note it leads
        to now.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/foreshadowing:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listForeshadowing
      tags: [Foreshadowing]
      summary: List the foreshadowing threads
      description: |
        The threads in the order of the author's own table: by how each
        stands, then by where it first appears in the manuscript. Each comes
        with every place it appears, in reading order, and each place says
        whether its words still stand where they were marked.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - name: status
          in: query
          description: Give only threads that stand so.
          schema:
            $ref: "#/components/schemas/ForeshadowingStatus"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The threads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForeshadowingPage"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/foreshadowing/{foreshadowingId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ForeshadowingId"
    get:
      operationId: getForeshadowing
      tags: [Foreshadowing]
      summary: Get one foreshadowing thread
      description: |
        One thread with each place it appears in the manuscript, in reading
        order.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The thread.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Foreshadowing"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/revisions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listRevisions
      tags: [Revisions]
      summary: List the proposed revisions
      description: |
        Every change proposed to the manuscript and not yet accepted or
        discarded, in reading order. Each says whether the passage it was made
        over still stands where it was.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - name: note
          in: query
          description: Give only revisions on this manuscript note, by its `relativePath`.
          schema:
            type: string
            minLength: 1
        - name: kind
          in: query
          description: Give only revisions of this kind.
          schema:
            $ref: "#/components/schemas/RevisionKind"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The revisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionPage"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RevisionId"
    get:
      operationId: getRevision
      tags: [Revisions]
      summary: Get one proposed revision
      description: |
        One proposed change with the passage it was made over.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revision"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/sticky-notes:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listStickyNotes
      tags: [Sticky notes]
      summary: List the sticky notes
      description: |
        The project's sticky notes, newest first unless asked otherwise, each
        with the start of what it says. Notes set aside in the archive are left
        out unless `state` asks for them.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      parameters:
        - $ref: "#/components/parameters/ArchiveState"
        - name: sort
          in: query
          description: Which notes come first.
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The sticky notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StickyNotePage"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/sticky-notes/{stickyNoteId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/StickyNoteId"
    get:
      operationId: getStickyNote
      tags: [Sticky notes]
      summary: Get one sticky note
      description: |
        One sticky note with everything it says, and the version to send
        back with a change.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The sticky note.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StickyNote"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        The access token from the plugin's settings, under Local API. It is
        made on this computer and never leaves it.

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: A project's `id`, as `listProjects` gives it.
      schema:
        type: string
        minLength: 1
    StepNumber:
      name: step
      in: path
      required: true
      description: A step's number, 1 to 10.
      schema:
        type: integer
        minimum: 1
        maximum: 10
    KindId:
      name: kindId
      in: path
      required: true
      description: |
        A kind's `id`: `character`, `scene`, one of the built-in worldbuilding
        kinds `time`, `location` and `item`, or the name of a kind the author
        made. `listKinds` gives the ids there are.
      schema:
        type: string
        minLength: 1
    CharacterId:
      name: characterId
      in: path
      required: true
      description: A character's `id`, as `listCharacters` or `listMembers` gives it.
      schema:
        type: string
        minLength: 1
    SceneId:
      name: sceneId
      in: path
      required: true
      description: A scene's `id`, as `listScenes` or `listMembers` gives it.
      schema:
        type: string
        minLength: 1
    EntityId:
      name: entityId
      in: path
      required: true
      description: A worldbuilding note's `id`, as `listEntities` or `listMembers` gives it.
      schema:
        type: string
        minLength: 1
    Vocabulary:
      name: vocabulary
      in: path
      required: true
      description: Which vocabulary.
      schema:
        $ref: "#/components/schemas/VocabularyId"
    TaxonomyPath:
      name: taxonomyPath
      in: path
      required: true
      description: |
        A word's path in its tree, such as `Race/Elf`, percent-encoded into
        one step of the address.
      schema:
        type: string
        minLength: 1
    TemplateName:
      name: templateName
      in: path
      required: true
      description: A field template's name, as `listFieldTemplates` gives it.
      schema:
        type: string
        minLength: 1
    TaskId:
      name: taskId
      in: path
      required: true
      description: A task's `id`, as `listTasks` gives it.
      schema:
        type: string
        minLength: 1
    ForeshadowingId:
      name: foreshadowingId
      in: path
      required: true
      description: A foreshadowing thread's `id`, as `listForeshadowing` gives it.
      schema:
        type: string
        minLength: 1
    RevisionId:
      name: revisionId
      in: path
      required: true
      description: A revision's `id`, as `listRevisions` gives it.
      schema:
        type: string
        minLength: 1
    StickyNoteId:
      name: stickyNoteId
      in: path
      required: true
      description: A sticky note's `id`, as `listStickyNotes` gives it.
      schema:
        type: string
        minLength: 1
    ArchiveState:
      name: state
      in: query
      description: Whether to give what is in use, what was set aside in the archive, or both.
      schema:
        type: string
        enum: [active, archived, all]
        default: active
    NotePath:
      name: notePath
      in: path
      required: true
      description: |
        A manuscript note's `relativePath`, as `listManuscriptNotes` gives it:
        where the note stands inside the project, folder and ending included,
        percent-encoded into one step of the address
        (`50_Manuscript%2FChapter%201.md`).
      schema:
        type: string
        minLength: 1
    View:
      name: view
      in: query
      description: |
        How much of each item to give. `summary` leaves out the long text,
        the record lines and the added fields. `full` gives everything, at
        most 100 items to an answer.
      schema:
        type: string
        enum: [summary, full]
        default: summary
    NameQuery:
      name: q
      in: query
      description: Give only items whose name, title or other names contain these words, whatever their case.
      schema:
        type: string
        minLength: 1
    ProgressFilter:
      name: progressStatus
      in: query
      description: Give only items the author has marked with this progress.
      schema:
        $ref: "#/components/schemas/ProgressStatus"
    Offset:
      name: offset
      in: query
      description: How many items to pass over before the first one given.
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      description: The most items to give in one answer.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100

  headers:
    ETag:
      description: |
        The version of the note the answer describes, in quotes. The same
        value stands in the body as `etag`, without them.
      schema:
        type: string

  responses:
    Problem:
      description: |
        The call was refused or failed. The `code` says why, and
        `x-snowflake-problems` lists every code with its status.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: |
        An error, in the shape of RFC 9457. Some codes add members of their
        own, such as `currentEtag` on a `concurrent-change`.
      required: [type, title, status, code]
      additionalProperties: true
      properties:
        type:
          type: string
          description: |
            The kind of problem, `/problems/` followed by the code. It is a
            name, not an address to open.
        title:
          type: string
          description: The problem in a few words. It may be reworded between versions.
        status:
          type: integer
          description: The HTTP status, repeated for callers that have no status line.
        code:
          type: string
          description: The stable name of the problem. Branch on this.
        detail:
          type: string
          description: What went wrong in this call. It may be reworded between versions.
        errors:
          type: array
          description: Each part of the call that did not match the contract.
          items:
            $ref: "#/components/schemas/ProblemIssue"
        currentEtag:
          type: string
          description: The note's `etag` as it stands now, on a `concurrent-change`.

    ProblemIssue:
      type: object
      required: [pointer, detail]
      additionalProperties: false
      properties:
        pointer:
          type: string
          description: |
            Where the fault is. A JSON Pointer into the body, or `params/`
            followed by a parameter's name.
        detail:
          type: string
          description: What is wrong there.

    ApiRoot:
      type: object
      required: [service, contract, authenticated]
      additionalProperties: false
      properties:
        service:
          type: string
          const: snowflake-method
          description: The plugin that answers here.
        contract:
          type: string
          description: The version of this contract, as in the document's own `info.version`.
        authenticated:
          type: boolean
          description: Whether the call carried a valid token. Everything below is given only then.
        plugin:
          type: object
          required: [id, version]
          additionalProperties: false
          properties:
            id:
              type: string
            version:
              type: string
        vault:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              description: The name of the vault this Obsidian window has open.
        access:
          $ref: "#/components/schemas/AccessLevel"
        projectsRoot:
          type: string
          description: |
            The folder the author keeps projects in, as a path in the vault.
            Empty when that is the vault's own top folder.
        limits:
          $ref: "#/components/schemas/Limits"

    AccessLevel:
      type: string
      enum: [read, write, delete]
      description: |
        How far the author lets callers go. `read` only reads. `write` also
        creates and changes. `delete` also deletes.

    Limits:
      type: object
      required: [bodyBytes, bridgeBytes, pageSize, maxPageSize]
      additionalProperties: false
      properties:
        bodyBytes:
          type: integer
          description: The largest body a call may carry over HTTP, in bytes.
        bridgeBytes:
          type: integer
          description: |
            The largest `params` and `body` together that a call may carry
            through Obsidian's command line, in bytes. Send longer text over HTTP.
        pageSize:
          type: integer
          description: How many items a list gives when the call names no `limit`.
        maxPageSize:
          type: integer
          description: The most items a list gives in one answer.

    Readiness:
      type: object
      required: [ready]
      additionalProperties: false
      properties:
        ready:
          type: boolean
          const: true

    Language:
      type: string
      enum: [en, zh-CN, zh-TW, ja, ko, fr, de, es]
      description: |
        The language a project is written in. It names the project's folders
        and files and heads its notes, and cannot be changed once the project
        is made.

    Series:
      type: object
      description: The series a project is a book of.
      required: [name, book]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: The name the books of the series share.
        book:
          type: [integer, "null"]
          minimum: 1
          description: The book's number in the series, where the author gave one.

    ProjectSummary:
      type: object
      required: [id, title, language, path, metadataPath, series, readOnly, archived, current]
      additionalProperties: false
      properties:
        id:
          type: string
          description: The project's stable id. It does not change when the project is renamed or moved.
        title:
          type: string
          description: The project's name, which is also the name of its folder.
        language:
          $ref: "#/components/schemas/Language"
        path:
          type: string
          description: The project's folder, as a path in the vault. It changes when the project is renamed or archived.
        metadataPath:
          type: string
          description: The note that holds the project's own properties, as a path in the vault.
        series:
          oneOf:
            - $ref: "#/components/schemas/Series"
            - type: "null"
        readOnly:
          type: boolean
          description: |
            True where a newer version of the plugin wrote the project. This
            one can read it and may not change it.
        archived:
          type: boolean
          description: True where the project stands in the archive folder. It can be read, and restored, and nothing else.
        current:
          type: boolean
          description: True for the project the author last worked in, in Obsidian.

    ProjectPage:
      type: object
      required: [items, total, offset, limit, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
        total:
          type: integer
          description: How many items there are in all.
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]
          description: The `offset` that gives the next items, or null where these are the last.

    Project:
      type: object
      required:
        - id
        - title
        - language
        - path
        - metadataPath
        - series
        - readOnly
        - archived
        - current
        - schemaVersion
        - steps
        - progress
        - counts
        - manuscript
        - health
        - folders
      additionalProperties: false
      properties:
        id:
          type: string
          description: The project's stable id. It does not change when the project is renamed or moved.
        title:
          type: string
          description: The project's name, which is also the name of its folder.
        language:
          $ref: "#/components/schemas/Language"
        path:
          type: string
          description: The project's folder, as a path in the vault. It changes when the project is renamed or archived.
        metadataPath:
          type: string
          description: The note that holds the project's own properties, as a path in the vault.
        series:
          oneOf:
            - $ref: "#/components/schemas/Series"
            - type: "null"
        readOnly:
          type: boolean
          description: |
            True where a newer version of the plugin wrote the project or one
            of its notes. This one can read it and may not change it.
        archived:
          type: boolean
          description: True where the project stands in the archive folder. It can be read, and restored, and nothing else.
        current:
          type: boolean
          description: True for the project the author last worked in, in Obsidian.
        schemaVersion:
          type: [integer, "null"]
          description: The version of the plugin's own format the project is written in.
        steps:
          type: array
          description: The ten steps, in order.
          minItems: 10
          maxItems: 10
          items:
            $ref: "#/components/schemas/Step"
        progress:
          $ref: "#/components/schemas/Progress"
        counts:
          type: object
          required: [characters, scenes, entities]
          additionalProperties: false
          properties:
            characters:
              type: integer
            scenes:
              type: integer
            entities:
              type: integer
              description: Worldbuilding notes of every kind together.
        manuscript:
          type: object
          required: [firstNotePath]
          additionalProperties: false
          properties:
            firstNotePath:
              type: [string, "null"]
              description: The note the manuscript begins with, as a path in the vault. Null where there is none yet.
        health:
          type: object
          description: How many issues `getProjectHealth` would list.
          required: [status, blocking, advisory]
          additionalProperties: false
          properties:
            status:
              $ref: "#/components/schemas/HealthStatus"
            blocking:
              type: integer
            advisory:
              type: integer
        folders:
          type: object
          description: |
            Where each of the project's folders stands, as paths in the vault,
            under names that are the same in every language. Hand one to
            Obsidian's own command line to search or list it. A folder for a
            tool the author has not used yet may not exist.
          required:
            - system
            - summaries
            - characters
            - synopses
            - scenes
            - draft
            - worldbuilding
            - materials
            - archive
          additionalProperties:
            type: string
          properties:
            system:
              type: string
            summaries:
              type: string
              description: Steps 1 and 2.
            characters:
              type: string
            synopses:
              type: string
              description: Steps 4 and 6.
            scenes:
              type: string
            draft:
              type: string
              description: The manuscript.
            worldbuilding:
              type: string
            materials:
              type: string
            archive:
              type: string

    Progress:
      type: object
      description: How many of the ten steps are done. Step 9 counts as done when it is skipped.
      required: [completed, total, percent]
      additionalProperties: false
      properties:
        completed:
          type: integer
        total:
          type: integer
        percent:
          type: integer

    StepStatus:
      type: string
      enum: [not-started, in-progress, in-revision, complete, skipped]
      description: |
        Where a step stands. `in-revision` is a finished step taken up again.
        Only step 9, which is optional, can be `skipped`.

    Step:
      type: object
      required: [id, name, status, optional, dependencies, needsReview, textEditable, path, allowedStatuses]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 10
        name:
          type: string
          enum:
            - one-sentence-summary
            - one-paragraph-summary
            - character-sheets
            - plot-synopsis
            - character-synopses
            - long-synopsis
            - character-profiles
            - scene-list
            - scene-planning
            - manuscript
          description: What the step produces, in words that are the same in every language.
        status:
          $ref: "#/components/schemas/StepStatus"
        optional:
          type: boolean
          description: True for step 9 only.
        dependencies:
          type: array
          description: The steps that must be done before this one can be.
          items:
            type: integer
        needsReview:
          type: boolean
          description: |
            True where a step this one builds on has changed since the author
            last looked. Nothing is wrong. The step may want another look.
        textEditable:
          type: boolean
          description: True for steps 1, 2, 4 and 6, whose text `getStepText` reads.
        path:
          type: [string, "null"]
          description: |
            The step's own note, as a path in the vault, for steps 1, 2, 4 and
            6. For step 10, the note the manuscript begins with. Null for the
            steps written in character and scene notes.
        allowedStatuses:
          type: array
          description: The statuses this step may be given.
          items:
            $ref: "#/components/schemas/StepStatus"

    StepList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 10
          maxItems: 10
          items:
            $ref: "#/components/schemas/Step"

    StepText:
      type: object
      required: [step, path, etag, readOnly, damaged, sections]
      additionalProperties: false
      properties:
        step:
          type: integer
          enum: [1, 2, 4, 6]
        path:
          type: string
          description: The step's note, as a path in the vault.
        etag:
          type: string
          description: The version of the note. Send it in `If-Match` to change the text.
        readOnly:
          type: boolean
        damaged:
          type: boolean
          description: |
            True where a section's markers in the note are missing or broken.
            Such a section reads as empty and cannot be written until the
            project is repaired.
        sections:
          type: object
          description: |
            The text of each section, under the section's id. Step 1 has
            `genre`, `audience-reason-1`, `one-sentence-summary` and
            `candidate-title-1` to `candidate-title-6`. Step 2 has
            `one-paragraph-summary` and `description`. Step 4 has
            `plot-synopsis`. Step 6 has `long-synopsis`.
          additionalProperties:
            type: string

    HealthStatus:
      type: string
      enum: [ok, advisory, blocking]
      description: |
        `ok` where nothing is wrong. `advisory` where there is only tidying
        the plugin offers to do. `blocking` where something is damaged.

    ProjectHealth:
      type: object
      required: [status, readOnly, outdatedNotes, issues]
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        readOnly:
          type: boolean
        outdatedNotes:
          type: integer
          description: How many notes were written by an older version of the plugin and not brought up to date since.
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ProjectIssue"

    ProjectIssue:
      type: object
      required: [code, path, steps, blocking, repairable]
      additionalProperties: false
      properties:
        code:
          type: string
          description: |
            What is wrong, as a stable name: `missing-directory`,
            `missing-artifact`, `dangling-record-link`,
            `duplicate-manuscript-sequence` and the like.
        path:
          type: string
          description: The note or folder the issue is about, as a path in the vault.
        steps:
          type: array
          description: The steps whose work the issue touches.
          items:
            type: integer
        field:
          type: string
          description: The property the issue is about, where it is about one.
        expected:
          type: string
          description: The one value the issue expected to find, where there is one.
        names:
          type: array
          description: What the issue found, one entry each.
          items:
            type: string
        blocking:
          type: boolean
          description: True for damage. False for tidying the plugin only offers.
        repairable:
          type: boolean
          description: True where the plugin can put it right without losing anything the author wrote.

    ProgressStatus:
      type: string
      enum: [not-started, in-progress, in-revision, complete]
      description: How far along the author marks one note.

    CharacterRole:
      type: string
      enum: [major, supporting, minor]
      description: How large a part a character plays.

    Color:
      type: string
      enum: [macaron-1, macaron-2, macaron-3, macaron-4, macaron-5, macaron-6, macaron-7, macaron-8]
      description: One of the eight tints a note's card can wear.

    VocabularyId:
      type: string
      enum: [category, world-status, relationship]

    MemberRef:
      type: object
      description: |
        Another note of the project that this one points at. While the note
        is there, `resolved` is true and `kind` and `id` say which it is.
        Once it is gone, `resolved` is false, `path` is null, and `name` is
        what is left of it. A note that pointed at it by a link then has
        nothing more to tell, so `kind` and `id` are null. A task or a
        foreshadowing thread, which keep the id, still give both.
      required: [kind, id, name, path, resolved]
      additionalProperties: false
      properties:
        kind:
          type: [string, "null"]
          description: "`character`, `scene`, or the `id` of a worldbuilding kind."
        id:
          type: [string, "null"]
        name:
          type: string
        path:
          type: [string, "null"]
          description: The note, as a path in the vault.
        resolved:
          type: boolean

    Term:
      description: What a field or a clause names. Either a note of the project, or plain words.
      oneOf:
        - $ref: "#/components/schemas/MemberRef"
        - type: object
          required: [text]
          additionalProperties: false
          properties:
            text:
              type: string

    RecordClause:
      description: |
        One thing a record line says beside its text. `target` is who a
        relationship is with. `at` is a place, `when` a time, `with` anyone
        else. `span` is an older way to say a period and is only ever read.
      oneOf:
        - type: object
          required: [kind, term]
          additionalProperties: false
          properties:
            kind:
              type: string
              enum: [target, at, when, with]
            term:
              $ref: "#/components/schemas/Term"
        - type: object
          required: [kind, start, end]
          additionalProperties: false
          properties:
            kind:
              type: string
              const: span
            start:
              $ref: "#/components/schemas/Term"
            end:
              $ref: "#/components/schemas/Term"

    RecordLine:
      type: object
      description: |
        One line a note keeps about how it stands in the world, or with
        another note. The `label` is a word of the note's own kind's
        vocabulary (`world-status` or `relationship`), and the `text` is what
        the author wrote under it.
      required: [label, labelPath, text, clauses]
      additionalProperties: false
      properties:
        label:
          type: string
          description: The word's path in its vocabulary tree, such as `Mood/Calm`.
        labelPath:
          type: [string, "null"]
          description: The note of that word, as a path in the vault.
        text:
          type: string
        clauses:
          type: array
          items:
            $ref: "#/components/schemas/RecordClause"

    CustomField:
      type: object
      description: A field the author added to a note, with a title of their own.
      required: [title, content]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string

    Member:
      type: object
      required: [kind, id, name, path, aliases]
      additionalProperties: false
      properties:
        kind:
          type: string
          description: "`character`, `scene`, or the `id` of a worldbuilding kind."
        id:
          type: string
        name:
          type: string
          description: The note's name. For a scene, its title.
        path:
          type: string
          description: The note, as a path in the vault.
        aliases:
          type: array
          description: Other names the note goes by.
          items:
            type: string

    MemberPage:
      type: object
      required: [items, total, offset, limit, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]

    Character:
      type: object
      description: |
        A character. The properties up to `oneSentenceStoryline` are always
        given. The rest are given when one character is read, and in a list
        only with `view=full`.
      required:
        - kind
        - id
        - name
        - path
        - etag
        - index
        - readOnly
        - damaged
        - needsMigration
        - role
        - progressStatus
        - aliases
        - categories
        - color
        - oneSentenceStoryline
      additionalProperties: false
      properties:
        kind:
          type: string
          const: character
        id:
          type: string
          description: The character's stable id. It does not change when the character is renamed.
        name:
          type: string
        path:
          type: string
          description: The character's note, as a path in the vault. It changes when the character is renamed.
        etag:
          type: string
          description: The version of the note. Send it in `If-Match` to change or delete the character.
        index:
          type: integer
          description: The character's place in the author's order, from 0.
        readOnly:
          type: boolean
          description: True where a newer version of the plugin wrote the note.
        damaged:
          type: boolean
          description: |
            True where a section's markers in the note are missing or broken.
            The note cannot be written until the project is repaired.
        needsMigration:
          type: boolean
          description: True where an older version of the plugin wrote the note and it was not brought up to date since.
        role:
          oneOf:
            - $ref: "#/components/schemas/CharacterRole"
            - type: "null"
        progressStatus:
          oneOf:
            - $ref: "#/components/schemas/ProgressStatus"
            - type: "null"
        aliases:
          type: array
          description: Other names the character goes by, which the manuscript may use.
          items:
            type: string
        categories:
          type: array
          description: The words of the `category` vocabulary the character is sorted under, each by its path in the tree.
          items:
            type: string
        color:
          oneOf:
            - $ref: "#/components/schemas/Color"
            - type: "null"
        oneSentenceStoryline:
          type: string
          description: Step 3. The character's storyline in one sentence.
        motivation:
          type: string
          description: Step 3. What the character wants in the abstract.
        goal:
          type: string
          description: Step 3. What the character wants in the concrete.
        conflict:
          type: string
          description: Step 3. What stands in the way.
        growth:
          type: string
          description: Step 3. How the character changes.
        oneParagraphStoryline:
          type: string
          description: Step 3. The character's storyline in one paragraph.
        characterSynopsis:
          type: string
          description: Step 5. The story as this character lives it.
        characterProfile:
          type: string
          description: Step 7. Everything there is to know about the character.
        worldStatus:
          type: array
          items:
            $ref: "#/components/schemas/RecordLine"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/RecordLine"
        unrecognizedWorldStatus:
          type: array
          description: Lines of the note's world status that are not record lines, kept as written.
          items:
            type: string
        unrecognizedRelationships:
          type: array
          description: Lines of the note's relationships that are not record lines, kept as written.
          items:
            type: string
        customFields:
          type: array
          items:
            $ref: "#/components/schemas/CustomField"
        gallery:
          type: array
          description: The note's pictures, each as the link the note stores.
          items:
            type: string
        galleryMain:
          type: [string, "null"]
          description: The picture shown first, one of `gallery`.

    CharacterPage:
      type: object
      required: [items, total, offset, limit, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Character"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]

    PointOfView:
      description: |
        Whose eyes a scene is seen through. Null where the author has not
        said. Otherwise all-knowing, several characters in turn, or one
        character.
      oneOf:
        - type: "null"
        - type: object
          required: [mode]
          additionalProperties: false
          properties:
            mode:
              type: string
              enum: [omniscient, multiple]
        - type: object
          required: [mode, character]
          additionalProperties: false
          properties:
            mode:
              type: string
              const: character
            character:
              $ref: "#/components/schemas/MemberRef"

    ManuscriptLink:
      type: object
      required: [link, path]
      additionalProperties: false
      properties:
        link:
          type: string
          description: The link as the scene's note stores it, with any heading it points at.
        path:
          type: [string, "null"]
          description: The manuscript note the link leads to, as a path in the vault. Null where it leads nowhere.

    Scene:
      type: object
      description: |
        A scene. The properties up to `conflict` are always given. The rest
        are given when one scene is read, and in a list only with `view=full`.
      required:
        - kind
        - id
        - title
        - path
        - etag
        - index
        - readOnly
        - damaged
        - needsMigration
        - progressStatus
        - aliases
        - categories
        - color
        - pov
        - conflict
      additionalProperties: false
      properties:
        kind:
          type: string
          const: scene
        id:
          type: string
          description: The scene's stable id. It does not change when the scene is renamed.
        title:
          type: string
        path:
          type: string
          description: The scene's note, as a path in the vault. It changes when the scene is renamed.
        etag:
          type: string
          description: The version of the note. Send it in `If-Match` to change or delete the scene.
        index:
          type: integer
          description: The scene's place in the scene list, from 0.
        readOnly:
          type: boolean
        damaged:
          type: boolean
        needsMigration:
          type: boolean
        progressStatus:
          oneOf:
            - $ref: "#/components/schemas/ProgressStatus"
            - type: "null"
        aliases:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            type: string
        color:
          oneOf:
            - $ref: "#/components/schemas/Color"
            - type: "null"
        pov:
          $ref: "#/components/schemas/PointOfView"
        conflict:
          type: string
          description: Step 8. What is at odds in the scene.
        characters:
          type: array
          description: Who is in the scene, in the order of the character list.
          items:
            $ref: "#/components/schemas/MemberRef"
        times:
          type: array
          description: When the scene happens.
          items:
            $ref: "#/components/schemas/Term"
        locations:
          type: array
          description: Where the scene happens.
          items:
            $ref: "#/components/schemas/Term"
        events:
          type: string
          description: Step 8. What happens in the scene.
        planning:
          type: string
          description: Step 9. The scene planned out before it is written.
        linkedManuscript:
          type: array
          description: The manuscript notes the scene is written in.
          items:
            $ref: "#/components/schemas/ManuscriptLink"
        worldStatus:
          type: array
          items:
            $ref: "#/components/schemas/RecordLine"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/RecordLine"
        unrecognizedWorldStatus:
          type: array
          items:
            type: string
        unrecognizedRelationships:
          type: array
          items:
            type: string
        customFields:
          type: array
          items:
            $ref: "#/components/schemas/CustomField"
        gallery:
          type: array
          items:
            type: string
        galleryMain:
          type: [string, "null"]

    ScenePage:
      type: object
      required: [items, total, offset, limit, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Scene"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]

    EntityTime:
      description: |
        When a time is: one moment, or a period between two others. Null for
        a note of any kind but `time`.
      oneOf:
        - type: "null"
        - type: object
          required: [kind, start, end]
          additionalProperties: false
          properties:
            kind:
              type: [string, "null"]
              enum: [point, period, null]
            start:
              oneOf:
                - $ref: "#/components/schemas/Term"
                - type: "null"
            end:
              oneOf:
                - $ref: "#/components/schemas/Term"
                - type: "null"

    Entity:
      type: object
      description: |
        A worldbuilding note. The properties up to `time` are always given.
        The rest are given when one note is read, and in a list only with
        `view=full`.
      required:
        - kind
        - id
        - name
        - path
        - etag
        - index
        - readOnly
        - damaged
        - needsMigration
        - progressStatus
        - aliases
        - categories
        - color
        - description
        - time
      additionalProperties: false
      properties:
        kind:
          type: string
          description: The `id` of the note's kind. A note cannot change kind.
        id:
          type: string
          description: The note's stable id. It does not change when the note is renamed.
        name:
          type: string
        path:
          type: string
          description: The note, as a path in the vault. It changes when the note or its kind is renamed.
        etag:
          type: string
          description: The version of the note. Send it in `If-Match` to change or delete it.
        index:
          type: integer
          description: The note's place among the notes of its kind, from 0.
        readOnly:
          type: boolean
        damaged:
          type: boolean
        needsMigration:
          type: boolean
        progressStatus:
          oneOf:
            - $ref: "#/components/schemas/ProgressStatus"
            - type: "null"
        aliases:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            type: string
        color:
          oneOf:
            - $ref: "#/components/schemas/Color"
            - type: "null"
        description:
          type: string
          description: What it is, in a sentence or two.
        time:
          $ref: "#/components/schemas/EntityTime"
        notes:
          type: string
          description: Everything else the author keeps about it.
        worldStatus:
          type: array
          items:
            $ref: "#/components/schemas/RecordLine"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/RecordLine"
        unrecognizedWorldStatus:
          type: array
          items:
            type: string
        unrecognizedRelationships:
          type: array
          items:
            type: string
        customFields:
          type: array
          items:
            $ref: "#/components/schemas/CustomField"
        gallery:
          type: array
          items:
            type: string
        galleryMain:
          type: [string, "null"]

    EntityPage:
      type: object
      required: [items, total, offset, limit, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Entity"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]

    Kind:
      type: object
      required: [id, group, builtIn, name, path, icon, description, hasTimeFields, defaultFieldTemplate, count]
      additionalProperties: false
      properties:
        id:
          type: string
          description: |
            `character`, `scene`, `time`, `location`, `item`, or the name of a
            kind the author made. An authored kind's `id` is its name and
            changes when the kind is renamed.
        group:
          type: string
          enum: [character, scene, worldbuilding]
        builtIn:
          type: boolean
          description: True for the kinds every project has. They cannot be renamed or deleted.
        name:
          type: string
          description: The kind's name in the project's language.
        path:
          type: string
          description: The folder the kind's notes stand in, as a path in the vault.
        icon:
          type: [string, "null"]
          description: The icon an authored kind wears, by its name in Obsidian's icon set.
        description:
          type: [string, "null"]
          description: What an authored kind is for, in the author's words.
        hasTimeFields:
          type: boolean
          description: True for `time`, whose notes say when they are.
        defaultFieldTemplate:
          type: [string, "null"]
          description: The name of the field template new notes of the kind begin with.
        count:
          type: integer
          description: How many notes of the kind the project has.

    KindList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Kind"

    DefinitionNode:
      type: object
      description: One word of a vocabulary.
      required: [taxonomyPath, name, depth, parent, description, path, folderPath, state, usage]
      additionalProperties: false
      properties:
        taxonomyPath:
          type: string
          description: The word's path in its tree, such as `Race/Elf`.
        name:
          type: string
          description: The word itself, which is the last step of its path.
        depth:
          type: integer
          description: How deep the word stands. 1 for a word at the top of its tree.
        parent:
          type: [string, "null"]
          description: The path of the word above it, or null at the top of the tree.
        description:
          type: string
          description: What the author wrote that the word means.
        path:
          type: string
          description: The word's own note, as a path in the vault.
        folderPath:
          type: string
          description: The word's folder, as a path in the vault. The words under it stand in it.
        state:
          type: string
          enum: [ok, missing-note, missing-folder]
          description: |
            `ok` for a word as it should be. `missing-note` where its folder
            is there and its note is not. `missing-folder` where notes use the
            word and nothing in the vault spells it.
        usage:
          type: object
          description: How many notes use this very word, not the words under it.
          required: [categorized, labelled]
          additionalProperties: false
          properties:
            categorized:
              type: integer
              description: Notes sorted under it as a category.
            labelled:
              type: integer
              description: Notes with a record line under it.

    DefinitionTree:
      type: object
      required: [vocabulary, kind, path, nodes]
      additionalProperties: false
      properties:
        vocabulary:
          $ref: "#/components/schemas/VocabularyId"
        kind:
          type: string
          description: The `id` of the kind whose words these are.
        path:
          type: string
          description: The folder the tree stands in, as a path in the vault. It may not exist while the tree is empty.
        nodes:
          type: array
          description: Every word, in reading order. A word comes before the words under it.
          items:
            $ref: "#/components/schemas/DefinitionNode"

    Vocabulary:
      type: object
      required: [vocabulary, trees]
      additionalProperties: false
      properties:
        vocabulary:
          $ref: "#/components/schemas/VocabularyId"
        trees:
          type: array
          description: One tree for each kind of the project, in the order of the kinds.
          items:
            $ref: "#/components/schemas/DefinitionTree"

    FieldTemplate:
      type: object
      required: [kind, name, description, path, default]
      additionalProperties: false
      properties:
        kind:
          type: string
          description: The `id` of the kind the template belongs to.
        name:
          type: string
          description: The template's name, which is the name of its note.
        description:
          type: string
        path:
          type: string
          description: The template's note, as a path in the vault.
        default:
          type: boolean
          description: True where new notes of the kind begin with this template.
        fields:
          type: array
          description: The fields the template holds. Given when one template is read.
          items:
            $ref: "#/components/schemas/CustomField"

    FieldTemplateList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FieldTemplate"

    WritingCount:
      type: object
      description: How much is written, counted every way at once. `total` is the number the author's convention comes to.
      required: [total, words, cjkCharacters, punctuationMarks, charactersWithSpaces, charactersNoSpaces]
      additionalProperties: false
      properties:
        total:
          type: integer
        words:
          type: integer
        cjkCharacters:
          type: integer
          description: Characters counted one at a time, as Chinese, Japanese and Korean writing is.
        punctuationMarks:
          type: integer
        charactersWithSpaces:
          type: integer
        charactersNoSpaces:
          type: integer

    Counting:
      type: object
      description: The convention a count follows, as the author set it in the plugin's settings.
      required: [mode, headings]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [jinjiang, chenggua, qidian, ms-word]
          description: |
            `jinjiang` counts every character that is not a space. `ms-word`
            counts as a word processor does. `qidian` and `chenggua` count
            Latin script in words and other scripts a character at a time.
        headings:
          type: string
          enum: [count, skip-first-h1, skip-h1, skip-all]
          description: Whether heading lines are counted as writing.

    Manuscript:
      type: object
      required: [path, notes, unreadable, firstNotePath, count, counting]
      additionalProperties: false
      properties:
        path:
          type: string
          description: The folder the manuscript stands in, as a path in the vault.
        notes:
          type: integer
          description: How many notes the manuscript has.
        unreadable:
          type: integer
          description: How many of them could not be read, and are missing from the count.
        firstNotePath:
          type: [string, "null"]
          description: The note the manuscript begins with, as a path in the vault.
        count:
          $ref: "#/components/schemas/WritingCount"
        counting:
          $ref: "#/components/schemas/Counting"

    ManuscriptNoteSummary:
      type: object
      required: [relativePath, path, title, index, readOnly]
      additionalProperties: false
      properties:
        relativePath:
          type: string
          description: Where the note stands inside the project. This is the note's address. It changes when the note is renamed or moved.
        path:
          type: string
          description: The note, as a path in the vault.
        title:
          type: string
          description: The note's name, which is the name of its file.
        index:
          type: integer
          description: The note's place in reading order, from 0.
        readOnly:
          type: boolean
        total:
          type: integer
          description: How much is written in the note, by the author's convention. Given with `include=counts`.

    ManuscriptNotePage:
      type: object
      required: [items, total, offset, limit, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ManuscriptNoteSummary"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]

    ManuscriptNote:
      type: object
      required: [relativePath, path, title, index, readOnly, etag, body, heading, headingMatchesTitle, count, counting, previous, next]
      additionalProperties: false
      properties:
        relativePath:
          type: string
          description: Where the note stands inside the project. This is the note's address. It changes when the note is renamed or moved.
        path:
          type: string
          description: The note, as a path in the vault.
        title:
          type: string
          description: The note's name, which is the name of its file.
        index:
          type: integer
          description: The note's place in reading order, from 0.
        readOnly:
          type: boolean
        etag:
          type: string
          description: The version of the note. Send it in `If-Match` to change the note.
        body:
          type: string
          description: The note's whole text under its properties, as Markdown.
        heading:
          type: [string, "null"]
          description: The note's first heading, where it has one.
        headingMatchesTitle:
          type: boolean
          description: True where that heading says the note's title.
        count:
          oneOf:
            - $ref: "#/components/schemas/WritingCount"
            - type: "null"
        counting:
          $ref: "#/components/schemas/Counting"
        previous:
          type: [string, "null"]
          description: The `relativePath` of the note before this one, or null for the first.
        next:
          type: [string, "null"]
          description: The `relativePath` of the note after this one, or null for the last.

    Instant:
      type: [string, "null"]
      format: date-time
      description: A moment, in RFC 3339 form and universal time. Null where none was kept.

    ManuscriptNoteRef:
      type: object
      description: The manuscript note a marked passage stands in.
      required: [path, relativePath, title]
      additionalProperties: false
      properties:
        path:
          type: string
          description: The note, as a path in the vault.
        relativePath:
          type: [string, "null"]
          description: |
            The note's address in the manuscript, as `getManuscriptNote` takes
            it. Null where the note is no longer one of the manuscript's
            notes. A passage in such a note reads as `conflict`.
        title:
          type: string
          description: The note's name.

    TextRange:
      type: object
      description: |
        A stretch of a note's text, counted from the start of its `body` in
        UTF-16 code units, as JavaScript counts a string. `to` is one past the
        last unit.
      required: [from, to]
      additionalProperties: false
      properties:
        from:
          type: integer
          minimum: 0
        to:
          type: integer
          minimum: 0

    PassageState:
      type: string
      enum: [anchored, moved, conflict]
      description: |
        Whether a marked passage still stands in its note. `anchored` where
        it stands where it was marked. `moved` where the same words were found
        elsewhere in the note, and `range` says where. `conflict` where they
        are no longer there, or stand in more places than can be told apart,
        or the note is no longer one of the manuscript's.

    TaskStatus:
      type: string
      enum: [todo, in-progress, blocked, in-review, done, cancelled]
      description: The column a task stands in.

    TaskPriority:
      type: string
      enum: [low, medium, high, urgent]

    Task:
      type: object
      required: [id, title, description, status, priority, dueDate, related, archived, overdue, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        dueDate:
          type: [string, "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: The day the task is due, as `YYYY-MM-DD`, or null.
        related:
          type: array
          description: The notes of the project the task is about.
          items:
            $ref: "#/components/schemas/MemberRef"
        archived:
          type: boolean
          description: True where the author set the task aside without deleting it.
        overdue:
          type: boolean
          description: True where the task is past its day and neither done nor cancelled, by this computer's calendar.
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"

    TaskPage:
      type: object
      required: [items, total, offset, limit, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]

    ForeshadowingStatus:
      type: string
      enum: [planned, active, resolved, abandoned]

    OccurrenceRole:
      type: string
      enum: [plant, reinforce, payoff]
      description: What one appearance does for the thread. It lays it down, echoes it, or pays it off.

    Occurrence:
      type: object
      description: One place a foreshadowing thread appears in the manuscript.
      required: [id, role, comment, note, range, text, context, state]
      additionalProperties: false
      properties:
        id:
          type: string
        role:
          $ref: "#/components/schemas/OccurrenceRole"
        comment:
          type: string
          description: The author's own remark about this appearance.
        note:
          $ref: "#/components/schemas/ManuscriptNoteRef"
        range:
          $ref: "#/components/schemas/TextRange"
          description: Where the words stand in the note now. For a `conflict`, where they last stood.
        text:
          type: string
          description: The words that were marked.
        context:
          $ref: "#/components/schemas/PassageContext"
        state:
          $ref: "#/components/schemas/PassageState"

    PassageContext:
      type: object
      description: A few characters of the note on either side of a marked passage, by which it is found again after the note changes.
      required: [before, after]
      additionalProperties: false
      properties:
        before:
          type: string
        after:
          type: string

    Foreshadowing:
      type: object
      required: [id, name, description, status, related, createdAt, updatedAt, occurrences]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/ForeshadowingStatus"
        related:
          type: array
          description: The notes of the project the thread is about.
          items:
            $ref: "#/components/schemas/MemberRef"
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"
        occurrences:
          type: array
          description: Each place the thread appears, in reading order.
          items:
            $ref: "#/components/schemas/Occurrence"

    ForeshadowingPage:
      type: object
      required: [items, total, offset, limit, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Foreshadowing"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]

    RevisionKind:
      type: string
      enum: [replace, insert, delete]

    Revision:
      type: object
      description: A change proposed to a passage of the manuscript and not yet made.
      required: [id, note, kind, range, originalText, proposed, comment, context, createdAt, state]
      additionalProperties: false
      properties:
        id:
          type: string
        note:
          $ref: "#/components/schemas/ManuscriptNoteRef"
        kind:
          $ref: "#/components/schemas/RevisionKind"
        range:
          $ref: "#/components/schemas/TextRange"
          description: |
            Where the passage stands in the note now. For a `conflict`, where
            it last stood. An insertion is a point, with `from` equal to `to`.
        originalText:
          type: string
          description: The text the revision was made over. Empty for an insertion.
        proposed:
          type: string
          description: What should stand instead. Empty for a deletion.
        comment:
          type: string
          description: Why, in the proposer's words.
        context:
          $ref: "#/components/schemas/PassageContext"
        createdAt:
          $ref: "#/components/schemas/Instant"
        state:
          $ref: "#/components/schemas/PassageState"

    RevisionPage:
      type: object
      required: [items, total, offset, limit, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Revision"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]

    StickyNote:
      type: object
      description: |
        A sticky note. `body` is given when one note is read. A list gives
        `preview` only.
      required: [id, path, color, createdAt, archived, etag, readOnly, preview]
      additionalProperties: false
      properties:
        id:
          type: string
        path:
          type: string
          description: The note, as a path in the vault.
        color:
          $ref: "#/components/schemas/Color"
        createdAt:
          $ref: "#/components/schemas/Instant"
        archived:
          type: boolean
        etag:
          type: string
          description: The version of the note. Send it in `If-Match` to change what it says or to delete it.
        readOnly:
          type: boolean
        preview:
          type: string
          description: The start of what the note says, on one line.
        body:
          type: string
          description: Everything the note says, as Markdown.

    StickyNotePage:
      type: object
      required: [items, total, offset, limit, nextOffset]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StickyNote"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]

x-snowflake-problems:
  invalid-request:
    status: 400
    title: The call does not match the contract.
  unauthorized:
    status: 401
    title: The call carries no valid access token.
  access-denied:
    status: 403
    title: The author's access level does not allow this operation.
  forbidden-origin:
    status: 403
    title: Calls from a web page are refused.
  cli-bridge-off:
    status: 403
    title: The command line bridge is switched off in the plugin's settings.
  not-found:
    status: 404
    title: Nothing stands at that address.
  unknown-operation:
    status: 404
    title: The API has no such operation.
  method-not-allowed:
    status: 405
    title: The address does not take that method.
  ambiguous-project:
    status: 409
    title: Two projects carry that id.
  path-conflict:
    status: 409
    title: Something else already stands where this would go.
  read-only:
    status: 409
    title: A newer version of the plugin wrote this, and this one may not change it.
  invalid-managed-document:
    status: 409
    title: A note the operation needs is damaged.
  unsafe-section:
    status: 409
    title: The note's section markers are damaged, so the section cannot be written safely.
  concurrent-change:
    status: 412
    title: The note has changed since it was read.
  payload-too-large:
    status: 413
    title: The body is larger than the API accepts.
  unsupported-media-type:
    status: 415
    title: The body must be JSON.
  wrong-host:
    status: 421
    title: The call names a host this listener does not answer for.
  precondition-required:
    status: 428
    title: The change must say which version of the note it is made against.
  internal-error:
    status: 500
    title: The operation failed.
  planned-operation:
    status: 501
    title: The operation is planned and not answered by this build.
  not-ready:
    status: 503
    title: Obsidian is still reading the vault.
  busy:
    status: 503
    title: Too many calls are waiting.
  leaving:
    status: 503
    title: Obsidian is closing or the plugin is being switched off.
