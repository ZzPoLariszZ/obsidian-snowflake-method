openapi: 3.1.0

info:
  title: Snowflake Method local API
  version: 1.0.0
  summary: Read and write a writer's Snowflake projects from the same computer.
  description: |
    The Snowflake Method plugin for Obsidian answers this API on the computer it
    runs on, and nowhere else. It is off until the author switches it on in the
    plugin's settings.

    **What it covers.** The plugin's own things: projects, steps, characters,
    scenes, worldbuilding, the manuscript, tasks, foreshadowing, revisions and
    sticky notes. Every note it returns carries its `path` in the vault. For
    plain vault work on that path (reading any file, searching, properties,
    tags) use Obsidian's own command line.

    **Access.** The author chooses one of three levels: read only, read and
    write, or read, write and delete. Each operation says which it needs in
    `x-snowflake-access`.

    **Identity.** Projects, characters, scenes, worldbuilding notes, tasks,
    foreshadowing and revisions have stable ids. A manuscript note has none, so
    it is addressed by its path inside the project, percent-encoded into one
    path segment. Renaming such a note changes its address, and the answer
    says where it went.

    **Reading.** A read changes nothing the author wrote. The plugin may still
    put two things right as it reads, as it does whenever it opens a project
    itself. A project whose folder was moved has its link to the first note of
    its manuscript pointed at where that note stands now. A record file that
    can no longer be read is set aside whole under a new name, and read as
    empty. Statistics and mentions are kept in a cache file of the plugin's
    own for this device, and asking for them may write it.

    **Changing a note.** A note-backed thing carries an `etag`. Send it back in
    `If-Match` when you change or delete that thing. If the note has changed
    since you read it, the answer is `412` with the current `etag`, and nothing
    is written. Read it again and decide again.

    **Renaming.** Giving a project, a note or a folder another name goes
    through Obsidian, which rewrites the links that lead to it. Where the
    author has Obsidian ask before it does that, it opens a dialog and waits,
    and a caller here cannot answer a dialog. So while "Automatically update
    internal links" is off under Files and links in Obsidian's settings, every
    change that would rename something is refused with `link-updates-ask`,
    before anything is written. This covers a new name for a project, a
    character, a scene, a worldbuilding note, a kind, a vocabulary's word or
    a field template, a project archived or restored, and a manuscript note
    renamed or renumbered. The answer of `getApiRoot` says which way it is
    set, in `canRename`. Everything that renames nothing goes on working.

    **Partial changes.** A `PATCH` body follows RFC 7396. A property left out
    is left as it is, `null` clears it, and a list replaces the old list whole.

    **Errors.** Every error is a problem document with a stable `code`. Branch
    on the code, never on the words. `x-snowflake-problems` lists every code.

    **Language.** A project is written in one of eight languages, which names
    its folders and files. Property names and listed values here are the same
    in every language. Titles, names and paths are the author's own text.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://127.0.0.1:{port}/v1
    description: The plugin's own listener, on this computer only.
    variables:
      port:
        default: "27125"
        description: The port chosen in the plugin's settings.

security:
  - bearer: []

tags:
  - name: Service
    description: What this API is, whether it is ready, and its own description.
  - name: Projects
    description: |
      A project is one novel in the making. It is a folder in the vault with
      the notes of its ten steps, its characters, scenes and worldbuilding,
      and its manuscript.
  - name: Steps
    description: |
      The ten steps of the Snowflake Method, each with a status the author
      sets. Steps 1, 2, 4 and 6 are written in a note of their own, which is
      read and written here. Steps 3, 5 and 7 are written in the character
      notes, 8 and 9 in the scene notes, and 10 is the manuscript.
  - name: Kinds
    description: |
      The kinds of note a project keeps beside its manuscript: characters,
      scenes, and the kinds of worldbuilding. Time, location and item are
      built in, and an author may add kinds of their own, such as factions.
  - name: Members
    description: |
      Every character, scene and worldbuilding note of a project in one
      list, for finding a note's `id` by its name.
  - name: Characters
    description: |
      A character is a note that grows over three steps: a sheet in step 3, a
      synopsis in step 5 and a full profile in step 7.
  - name: Scenes
    description: |
      A scene is a note in the scene list of step 8, with who is in it, where
      and when it happens, and what happens. Step 9 plans it further.
  - name: Entities
    description: |
      A worldbuilding note: a time, a place, an item, or a note of a kind
      the author made.
  - name: Vocabularies
    description: |
      The words a project has agreed on, each a small tree per kind.
      `category` sorts notes. `world-status` and `relationship` name the
      lines a note keeps about how it stands in the world and with others.
  - name: Field templates
    description: |
      A field template is a set of extra fields with starting text. A kind
      can have one as its default, and new notes of that kind begin with it.
  - name: Manuscript
    description: |
      The manuscript is step 10: the novel itself, as notes in the project's
      draft folder, in the order the author reads them in. A note is a
      chapter, a scene, or whatever unit the author writes in. It has no id.
      It is addressed by where it stands inside the project, and renaming it
      changes that address.

      The author may have a note open for writing in the plugin when a change
      to it arrives. What they typed and had not saved is saved first. The
      change is then made only against that latest text, which is what the
      `etag` in `If-Match` is for, and the plugin's editor on the note is
      closed so that nothing typed afterwards can undo the change.

      Where the author has a chapter numbering rule switched on, a note made
      among numbered ones, or taken from among them, renames the numbered
      notes after it by one. Every operation that can do so says what it
      renamed, and `renumber` set to false leaves the other names alone.
  - name: Tasks
    description: |
      The author's own to-do list for a project, as the cards of its task
      board. A task can name the characters, scenes and other notes it is
      about.
  - name: Foreshadowing
    description: |
      A foreshadowing is a thread the author is laying through the
      manuscript: something planted early and paid off later. Each place it
      appears is an occurrence, tied to a passage of a manuscript note.
  - name: Revisions
    description: |
      A revision is a change proposed to a passage of the manuscript and not
      yet made: a replacement, an insertion or a deletion, with a comment. It
      stands beside the text as a card until the author accepts or discards
      it. To suggest a change without touching the author's prose, make one.
  - name: Sticky notes
    description: |
      Short notes the author keeps beside a project, each a small note of
      its own with a tint.
  - name: Statistics
    description: |
      How much is written, and of what: the size of the project and of the
      manuscript by the author's own convention, sentences and dialogue note
      by note, the words used most, and the words the author watches for.
      Each is worked out from the notes as they stand. The plugin keeps what
      it worked out in a cache of its own for this device, so asking again
      is quick.
  - name: Mentions
    description: |
      Where the manuscript names a character, a scene or a worldbuilding
      note, by its name or by an alias, as a link or in plain words. Words
      more than one note could mean are told apart from the ones that are
      certain.
  - name: Writing sessions
    description: |
      The plugin times the author's sittings and counts what each one added
      and took away. Days are this computer's calendar days. A session
      belongs to the day it began on. Every device that writes in the vault
      keeps its own record, and a reading here is all of them together.
  - name: History
    description: |
      What happened to a project day by day: the notes that were written,
      made, renamed or deleted, and what was done to its tasks, its
      foreshadowing and its revisions. The words come from the versions
      Obsidian's own file recovery keeps, where it kept any, and from the
      writing sessions otherwise.
  - name: Timeline
    description: |
      Timelines lay a story's scenes out along its time. A timeline keeps,
      under each time note it names, rows of the author's own words, and on
      each row the scenes placed there. A view shows one or more timelines
      side by side, in an order of times of its own. Nothing here copies a
      note: a time and a scene are named by their ids.
  - name: Beat sheets
    description: |
      A beat sheet lays a story's scenes out along its structure: acts, the
      beats of each act, and under each beat rows of the author's own words
      with the scenes placed on them. A sheet is started from a template,
      one the plugin ships or one the author saved.
  - name: Freeform
    description: |
      A freeform view is a canvas the author arranges by hand: cards for the
      project's notes and records, files, links and plain text, frames
      around groups of them, and lines between them.
  - name: Relationship graph
    description: |
      The project's characters, scenes and worldbuilding notes as a graph,
      with every relationship one note records as a line to the note it
      points at. Nothing of it is stored. It is read from the notes each
      time it is asked for.

paths:
  /:
    get:
      operationId: getApiRoot
      tags: [Service]
      summary: Describe this API
      description: |
        Says what answers here and how far the caller may go. Without a token
        it gives the service's name and the contract's version and nothing
        else. With one it adds the plugin's version, the vault's name, the
        access level and the limits in force.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-direct: true
      security: []
      responses:
        "200":
          description: What answers here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiRoot"
        default:
          $ref: "#/components/responses/Problem"

  /ready:
    get:
      operationId: getReadiness
      tags: [Service]
      summary: Check whether the API is ready
      description: |
        Obsidian reads a vault for a moment after it opens, and the plugin
        cannot list projects until that is done. This answers at once either
        way, so a client can wait here instead of on its first real call.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-direct: true
      x-snowflake-errors: [not-ready]
      security: []
      responses:
        "200":
          description: The API is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        default:
          $ref: "#/components/responses/Problem"

  /openapi.json:
    get:
      operationId: getOpenApiDocument
      tags: [Service]
      summary: Get this API's description
      description: |
        The OpenAPI document of the operations this build answers. Operations
        planned for a later version are left out, and the server address
        carries the port in use.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-direct: true
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: "#/components/responses/Problem"

  /projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List the projects
      description: |
        Every project under the folder the author keeps projects in, by
        title. Archived projects stand in a folder of their own and are left
        out unless `state` asks for them. Start here to find a project's `id`,
        which every other operation takes.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      parameters:
        - name: state
          in: query
          description: Which projects to list.
          schema:
            type: string
            enum: [active, archived, all]
            default: active
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createProject
      tags: [Projects]
      summary: Create a project
      description: |
        Makes a new project under the folder the author keeps projects in,
        with its folders, its ten steps and the note its manuscript begins with.
        The project is written in the language given, which names its folders and
        cannot be changed afterwards. It is not made the project the author is
        working in. A title another project already goes by is refused.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [duplicate-name, path-conflict, project-creation-interrupted]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: The project that was made.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      tags: [Projects]
      summary: Get a project
      description: |
        One project with its ten steps, how far it has come, how many
        characters, scenes and worldbuilding notes it holds, and where each of
        its folders stands in the vault. This reads every note of the project
        once and keeps the reading until a note changes, so it is quick to
        ask again.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateProject
      tags: [Projects]
      summary: Rename a project or change its series
      description: |
        Changes a project's title, the series it is a book of, or both. A new
        title moves the project's folder, so every `path` under it changes. Its
        `id` stays. Send `series` as null to take the project out of its series.
        What is left out is left as it is.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, duplicate-name, path-conflict, link-updates-ask]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/ProjectPatch"
      responses:
        "200":
          description: The project as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/health:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectHealth
      tags: [Projects]
      summary: Check a project's health
      description: |
        What is wrong with the project's structure, if anything: a folder or a
        note that is missing, a link that leads nowhere, a name that has
        drifted from its file. Each issue says whether it blocks work and
        whether the plugin can repair it by itself. Ask this when another
        operation answers `invalid-managed-document` or `unsafe-section`.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The project's health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectHealth"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/steps:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listSteps
      tags: [Steps]
      summary: List a project's ten steps
      description: |
        The ten steps in order, each with its status and whether its work
        should be looked at again because a step before it has changed.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The ten steps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepList"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/steps/{step}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/StepNumber"
    get:
      operationId: getStep
      tags: [Steps]
      summary: Get one step
      description: |
        One step with its status, the steps it depends on, and the statuses
        it may be given.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The step.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Step"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: setStepStatus
      tags: [Steps]
      summary: Set how far a step has come
      description: |
        Marks a step as not started, in progress, complete or skipped. A step
        can be completed only once the steps it rests on are. Only step 9 can be
        skipped, and step 10 is either not started or complete. Taking a step
        back can take the steps that rest on it back too, so the answer gives
        all ten.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, step-prerequisites-incomplete, invalid-step-status]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepStatusChange"
      responses:
        "200":
          description: All ten steps as they now stand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepList"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/steps/{step}/text:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/StepNumber"
    get:
      operationId: getStepText
      tags: [Steps]
      summary: Read what a step says
      description: |
        The text of a step that is written in a note of its own: the summary
        of step 1 or 2, the synopsis of step 4 or 6. Each part of the note is
        a section with an id, given here under that id. The other steps have
        no note of their own and answer `not-found`: read characters for
        steps 3, 5 and 7, scenes for 8 and 9, and the manuscript for 10.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The step's text.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepText"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateStepText
      tags: [Steps]
      summary: Write the text of a step
      description: |
        Writes one or more sections of the note of step 1, 2, 4 or 6. A
        section left out is left as it is. Send the `etag` the text was read
        with in `If-Match`. Steps 3, 5, 7, 8, 9 and 10 have no note of their own:
        their work is the characters, the scenes and the manuscript.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: core
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, precondition-required, concurrent-change, unsafe-section]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/StepTextPatch"
      responses:
        "200":
          description: The text as it now stands.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepText"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/kinds:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listKinds
      tags: [Kinds]
      summary: List the kinds of note a project keeps
      description: |
        Characters, scenes and every kind of worldbuilding note the project
        has, in the order the author keeps them, each with how many notes it
        holds and where its folder stands.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The kinds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KindList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createKind
      tags: [Kinds]
      summary: Create a kind of worldbuilding note
      description: |
        Adds a kind of the author's own beside time, location and item, with
        its folder and its three vocabularies. A kind's `id` is its name. A name
        another kind goes by, a built-in one included, is refused, and so is a
        name a folder cannot have. A project holds a limited number of kinds.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, duplicate-name, invalid-name, kind-limit-reached]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KindCreate"
      responses:
        "201":
          description: The kind that was made.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kind"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/kinds/{kindId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/KindId"
    get:
      operationId: getKind
      tags: [Kinds]
      summary: Get one kind
      description: |
        One kind with how many notes it holds, where its folder stands and
        which field template its new notes begin with.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The kind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kind"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateKind
      tags: [Kinds]
      summary: Change a kind
      description: |
        Renames a kind the author made, changes its icon or what it is for,
        or sets the field template new notes of a kind begin with. A new name
        moves the kind's folder and changes its `id`, and every note of the kind
        follows. The kinds every project has keep their names and wear no icon:
        only their field template can be set.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, duplicate-name, invalid-name, built-in-kind, invalid-reference, link-updates-ask]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/KindPatch"
      responses:
        "200":
          description: The kind as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kind"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteKind
      tags: [Kinds]
      summary: Delete a kind and its notes
      description: |
        Sends the folder of a kind the author made to the trash, with every
        note of the kind in it. Where the kind holds notes, or other notes name
        one of them, the delete is refused with what it would cost, unless
        `force` is true. The kinds every project has cannot be deleted.
      x-snowflake-access: delete
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: advanced
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, built-in-kind, in-use]
