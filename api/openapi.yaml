    EntityCreate:
      type: object
      description: "A worldbuilding note to make. Its kind and its name are needed."
      required: [kind, name]
      additionalProperties: false
      properties:
        kind:
          type: string
          minLength: 1
          description: The kind of note to make, by its `kindId`. `listKinds` gives the kinds there are.
        name:
          type: string
          pattern: "\\S"
          maxLength: 200
        aliases:
          type: array
          description: Other names the note goes by.
          items:
            type: string
        categories:
          type: array
          description: The words of the kind's `category` vocabulary the note is sorted under, each by its path in the tree.
          items:
            type: string
        progressStatus:
          oneOf:
            - $ref: "#/components/schemas/ProgressStatus"
            - type: "null"
        color:
          oneOf:
            - $ref: "#/components/schemas/Color"
            - type: "null"
        description:
          type: string
        notes:
          type: string
        time:
          $ref: "#/components/schemas/EntityTimeInput"
        worldStatus:
          type: array
          items:
            $ref: "#/components/schemas/RecordLineInput"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/RecordLineInput"
        customFields:
          type: array
          description: The fields the author added, in order. No two may share a title.
          items:
            $ref: "#/components/schemas/CustomField"
        createMissingVocabulary:
          type: boolean
          default: false
          description: Add a category or a label the vocabulary does not have yet. Left false, such a word is refused, so a slip in spelling cannot grow the vocabulary.

    EntityPatch:
      type: object
      description: "What to change of a worldbuilding note. A note read and sent back whole is taken, and only these are looked at. Its kind is not changed here."
      additionalProperties: false
      x-snowflake-echo: "#/components/schemas/Entity"
      properties:
        name:
          type: string
          pattern: "\\S"
          maxLength: 200
        aliases:
          type: array
          description: Other names the note goes by.
          items:
            type: string
        categories:
          type: array
          description: The words of the kind's `category` vocabulary the note is sorted under, each by its path in the tree.
          items:
            type: string
        progressStatus:
          oneOf:
            - $ref: "#/components/schemas/ProgressStatus"
            - type: "null"
        color:
          oneOf:
            - $ref: "#/components/schemas/Color"
            - type: "null"
        description:
          type: string
        notes:
          type: string
        time:
          $ref: "#/components/schemas/EntityTimeInput"
        worldStatus:
          type: array
          items:
            $ref: "#/components/schemas/RecordLineInput"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/RecordLineInput"
        customFields:
          type: array
          description: The fields the author added, in order. No two may share a title.
          items:
            $ref: "#/components/schemas/CustomField"
        createMissingVocabulary:
          type: boolean
          default: false
          description: Add a category or a label the vocabulary does not have yet. Left false, such a word is refused, so a slip in spelling cannot grow the vocabulary.

    MemberMove:
      description: Where to put a note in the author's order. One of the three.
      oneOf:
        - type: object
          required: [index]
          additionalProperties: false
          properties:
            index:
              type: integer
              minimum: 0
              description: The place it should take, from 0. A number past the end puts it last.
        - type: object
          required: [before]
          additionalProperties: false
          properties:
            before:
              type: string
              minLength: 1
              description: The `id` of the note it should stand before.
        - type: object
          required: [after]
          additionalProperties: false
          properties:
            after:
              type: string
              minLength: 1
              description: The `id` of the note it should stand after.

    MemberUsage:
      type: object
      description: The notes that name one note, split by what deleting it would cost each.
      required: [listed, needsDecision, records]
      additionalProperties: false
      properties:
        listed:
          type: array
          description: Notes that list it among others, such as a scene's cast. They would lose the entry and nothing else.
          items:
            $ref: "#/components/schemas/MemberRef"
        needsDecision:
          type: array
          description: Notes that name it where only one note fits, such as a scene's point of view. They would be left pointing at nothing.
          items:
            $ref: "#/components/schemas/MemberRef"
        records:
          type: array
          description: Notes whose world status or relationships mention it in a line of their own, which would be left as written.
          items:
            $ref: "#/components/schemas/MemberRef"

    MemberUsageReport:
      type: object
      required: [member, listed, needsDecision, records]
      additionalProperties: false
      properties:
        member:
          $ref: "#/components/schemas/MemberRef"
        listed:
          type: array
          items:
            $ref: "#/components/schemas/MemberRef"
        needsDecision:
          type: array
          items:
            $ref: "#/components/schemas/MemberRef"
        records:
          type: array
          items:
            $ref: "#/components/schemas/MemberRef"

    MemberDeletion:
      type: object
      required: [kind, id, name, path, detached, dangling, picturesKept]
      additionalProperties: false
      properties:
        kind:
          type: string
        id:
          type: string
        name:
          type: string
        path:
          type: string
          description: Where the note stood before it went to the trash.
        detached:
          type: array
          description: The notes that listed it and no longer do.
          items:
            $ref: "#/components/schemas/MemberRef"
        dangling:
          type: array
          description: The notes that still name it, and now point at nothing. The health of the project names each.
          items:
            $ref: "#/components/schemas/MemberRef"
        picturesKept:
          type: array
          description: Pictures of its gallery that should have gone with it and could not be sent to the trash, by name.
          items:
            type: string

    KindCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "\\S"
          maxLength: 200
          description: What the kind is called. It becomes the kind's `id` and names its folder.
        icon:
          type: string
          description: An icon from Obsidian's icon set, by its name.
        description:
          type: string
          description: What the kind is for.

    KindPatch:
      type: object
      description: What to change of a kind. A kind read and sent back whole is taken, and only these are looked at.
      additionalProperties: false
      x-snowflake-echo: "#/components/schemas/Kind"
      properties:
        name:
          type: string
          pattern: "\\S"
          maxLength: 200
        icon:
          type: [string, "null"]
          description: Null or empty takes the icon off.
        description:
          type: [string, "null"]
        defaultFieldTemplate:
          type: [string, "null"]
          description: The name of one of the kind's field templates, or null for none.

    KindDeletion:
      type: object
      required: [id, path, entities, detached, dangling]
      additionalProperties: false
      properties:
        id:
          type: string
        path:
          type: string
          description: Where the kind's folder stood.
        entities:
          type: integer
          description: How many notes went with the folder.
        detached:
          type: array
          description: The notes that listed one of them and no longer do.
          items:
            $ref: "#/components/schemas/MemberRef"
        dangling:
          type: array
          description: The notes that still name one of them, and now point at nothing.
          items:
            $ref: "#/components/schemas/MemberRef"

    DefinitionNodeCreate:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path:
          type: string
          pattern: "\\S"
          description: The word's path in the tree, such as `Race/Elf`. Its steps are parted by `/`.
        description:
          type: string
          description: What the word means.

    DefinitionNodePatch:
      type: object
      description: What to change of a word. A word read and sent back whole is taken, and only these are looked at.
      additionalProperties: false
      x-snowflake-echo: "#/components/schemas/DefinitionNode"
      properties:
        name:
          type: string
          pattern: "\\S"
          description: The word itself, which is the last step of its path.
        description:
          type: string

    DefinitionNodeDeletion:
      type: object
      required: [vocabulary, kind, taxonomyPath, nodes, categorized, labelled]
      additionalProperties: false
      properties:
        vocabulary:
          $ref: "#/components/schemas/VocabularyId"
        kind:
          type: string
        taxonomyPath:
          type: string
        nodes:
          type: integer
          description: How many words went, this one and those under it.
        categorized:
          type: array
          description: The notes that were sorted under one of them and no longer are, by name.
          items:
            type: string
        labelled:
          type: array
          description: The notes with a record line under one of them, which is left as written, by name.
          items:
            type: string

    FieldTemplateCreate:
      type: object
      required: [kind, name]
      additionalProperties: false
      properties:
        kind:
          type: string
          minLength: 1
          description: The kind of note the template is for, by its `kindId`.
        name:
          type: string
          pattern: "\\S"
          maxLength: 200
        description:
          type: string
        fields:
          type: array
          description: The fields the template holds, in order. No two may share a title.
          items:
            $ref: "#/components/schemas/CustomField"
        default:
          type: boolean
          default: false
          description: Whether new notes of the kind begin with this template.

    FieldTemplatePatch:
      type: object
      description: What to change of a template. A template read and sent back whole is taken, and only these are looked at.
      additionalProperties: false
      x-snowflake-echo: "#/components/schemas/FieldTemplate"
      properties:
        name:
          type: string
          pattern: "\\S"
          maxLength: 200
        description:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/CustomField"
        default:
          type: boolean

    NoteRename:
      type: object
      description: One manuscript note renamed, by its address before and after.
      required: [from, to]
      additionalProperties: false
      properties:
        from:
          type: string
        to:
          type: string

    NumberingPlan:
      type: object
      required: [rule, head, renames]
      additionalProperties: false
      properties:
        rule:
          type: boolean
          description: Whether the author has a numbering rule switched on. Without one nothing is offered and nothing renamed.
        head:
          type: [string, "null"]
          description: The numbered name a new note at that place is offered, such as `Chapter 3`. Null where the rule offers none, and for a note leaving.
        renames:
          type: array
          description: The notes that would be renamed, in reading order.
          items:
            $ref: "#/components/schemas/NoteRename"

    ManuscriptNoteResult:
      type: object
      required: [note, renumbered, skipped]
      additionalProperties: false
      properties:
        note:
          $ref: "#/components/schemas/ManuscriptNote"
        renumbered:
          type: array
          description: The other notes that were renamed to keep the count.
          items:
            $ref: "#/components/schemas/NoteRename"
        skipped:
          type: array
          description: Notes that should have been renamed and were left, because a newer version of the plugin wrote them. Each by its address.
          items:
            type: string
        source:
          type: object
          description: After a split, the note that was cut, which keeps its head. After a merge, nothing.
          required: [relativePath, etag]
          additionalProperties: false
          properties:
            relativePath:
              type: string
            etag:
              type: string
        removed:
          type: string
          description: After a merge, the address the note that went to the trash had.

    ManuscriptNoteCreate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          pattern: "\\S"
          maxLength: 200
          description: The note's name. Left out, the numbered name the author's rule offers is taken, and where it offers none the call is refused.
        after:
          type: string
          minLength: 1
          description: The `relativePath` of the note it should come after.
        position:
          type: string
          enum: [start, end]
          description: Where it goes when `after` is not sent. The end where neither is.
        body:
          type: string
          description: The text the note holds. Left out, it holds the plugin's own first line for a new note.
        renumber:
          type: boolean
          default: true
          description: "Whether the numbered notes after it are renamed by one to keep the count, where the author's numbering rule is on."

    ManuscriptNoteBody:
      type: object
      description: The whole text of a note. A note read and sent back whole is taken, and only `body` is looked at.
      required: [body]
      additionalProperties: false
      x-snowflake-echo: "#/components/schemas/ManuscriptNote"
      properties:
        body:
          type: string
          description: The text, as Markdown. It replaces all the note says.

    ManuscriptNoteRename:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          pattern: "\\S"
          maxLength: 200
        heading:
          type: boolean
          description: Whether the note's first heading takes the title too. Left out, it does where it said the old title.

    SplitPoint:
      description: Where a note is cut. Either the words the second note begins with, or a place in the text.
      oneOf:
        - type: object
          required: [exact]
          additionalProperties: false
          properties:
            exact:
              type: string
              minLength: 1
              description: The words the second note should begin with, exactly as the note has them.
            prefix:
              type: string
              description: A few words that stand right before them, where the note says them more than once.
            suffix:
              type: string
              description: A few words that stand right after them.
        - type: object
          required: [offset]
          additionalProperties: false
          properties:
            offset:
              type: integer
              minimum: 0
              description: The place in the note's `body`, in UTF-16 code units, where the second note begins.

    ManuscriptNoteSplit:
      type: object
      required: [at]
      additionalProperties: false
      properties:
        at:
          $ref: "#/components/schemas/SplitPoint"
        title:
          type: string
          pattern: "\\S"
          maxLength: 200
          description: The new note's name. Left out, the numbered name the author's rule offers is taken, and where it offers none the call is refused.
        renumber:
          type: boolean
          default: true
          description: "Whether the numbered notes after it are renamed by one to keep the count, where the author's numbering rule is on."

    ManuscriptNoteMerge:
      type: object
      additionalProperties: false
      properties:
        renumber:
          type: boolean
          default: true
          description: "Whether the numbered notes after it are renamed by one to keep the count, where the author's numbering rule is on."

    ManuscriptNoteDeletion:
      type: object
      required: [removed, neighbour, renumbered, skipped]
      additionalProperties: false
      properties:
        removed:
          type: string
          description: The address the note had.
        neighbour:
          type: [string, "null"]
          description: The address of the note that stood before it, or after it where it was the first. Null where it was the only one.
        renumbered:
          type: array
          items:
            $ref: "#/components/schemas/NoteRename"
        skipped:
          type: array
          items:
            type: string

    PassageSelector:
      description: |
        A passage of a manuscript note. Either the words themselves, with a
        few of the words around them where the note says them more than once,
        or where it stands in the note's `body`, counted in UTF-16 code units.
        Naming the words is the surer way, since a note's text moves.
      oneOf:
        - type: object
          required: [exact]
          additionalProperties: false
          properties:
            exact:
              type: string
              minLength: 1
              description: The words, exactly as the note has them.
            prefix:
              type: string
              description: A few words that stand right before them.
            suffix:
              type: string
              description: A few words that stand right after them.
        - type: object
          required: [from, to]
          additionalProperties: false
          properties:
            from:
              type: integer
              minimum: 0
            to:
              type: integer
              minimum: 0

    TaskCreate:
      type: object
      description: A task to add. Where they are left out, its status is `todo`, its priority is `medium`, and it has no day due.
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          pattern: "\\S"
          maxLength: 500
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        dueDate:
          type: [string, "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: The day the task is due, as `YYYY-MM-DD`, or null for none.
        related:
          type: array
          description: The notes of the project the task is about, each by its id.
          items:
            $ref: "#/components/schemas/MemberRefInput"
        archived:
          type: boolean
          description: Whether the task is set aside.

    TaskPatch:
      type: object
      description: What to change of a task. A task read and sent back whole is taken, and only these are looked at.
      additionalProperties: false
      x-snowflake-echo: "#/components/schemas/Task"
      properties:
        title:
          type: string
          pattern: "\\S"
          maxLength: 500
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        dueDate:
          type: [string, "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: The day the task is due, as `YYYY-MM-DD`, or null for none.
        related:
          type: array
          description: The notes of the project the task is about, each by its id.
          items:
            $ref: "#/components/schemas/MemberRefInput"
        archived:
          type: boolean
          description: Whether the task is set aside.

    TaskMove:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/TaskStatus"
          description: The column to put it in. Left out, its own.
        before:
          type: [string, "null"]
          description: The `id` of the task of that column it should stand before. Null or left out, the end of the column.

    TaskPurge:
      type: object
      required: [removed]
      additionalProperties: false
      properties:
        removed:
          type: integer
          description: How many archived tasks were deleted.

    OccurrenceCreate:
      type: object
      description: A place a thread appears.
      required: [note, passage]
      additionalProperties: false
      properties:
        note:
          type: string
          minLength: 1
          description: The manuscript note the passage stands in, by its `relativePath`.
        passage:
          $ref: "#/components/schemas/PassageSelector"
        role:
          $ref: "#/components/schemas/OccurrenceRole"
          description: What the appearance does for the thread. Left out, `plant`.
        comment:
          type: string
          description: A remark on this appearance.

    OccurrencePatch:
      type: object
      description: What to change of an appearance. One read and sent back whole is taken. `note` is then the note it was read in, and is looked at only beside a `passage`.
      additionalProperties: false
      x-snowflake-echo: "#/components/schemas/Occurrence"
      properties:
        role:
          $ref: "#/components/schemas/OccurrenceRole"
        comment:
          type: string
        note:
          description: The manuscript note the new passage stands in, by its `relativePath`. Left out, the note the appearance stands in now.
          oneOf:
            - type: string
              minLength: 1
            - $ref: "#/components/schemas/ManuscriptNoteRef"
        passage:
          $ref: "#/components/schemas/PassageSelector"

    ForeshadowingCreate:
      type: object
      description: A thread to start. Where it is left out, its status is `planned`.
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "\\S"
          maxLength: 500
        description:
          type: string
        status:
          $ref: "#/components/schemas/ForeshadowingStatus"
        related:
          type: array
          description: The notes of the project the thread is about, each by its id.
          items:
            $ref: "#/components/schemas/MemberRefInput"
        occurrences:
          type: array
          description: The places the thread appears.
          items:
            $ref: "#/components/schemas/OccurrenceCreate"

    ForeshadowingPatch:
      type: object
      description: What to change of a thread. A thread read and sent back whole is taken, and only these are looked at.
      additionalProperties: false
      x-snowflake-echo: "#/components/schemas/Foreshadowing"
      properties:
        name:
          type: string
          pattern: "\\S"
          maxLength: 500
        description:
          type: string
        status:
          $ref: "#/components/schemas/ForeshadowingStatus"
        related:
          type: array
          description: The notes of the project the thread is about, each by its id.
          items:
            $ref: "#/components/schemas/MemberRefInput"

    RevisionCreate:
      type: object
      required: [note, kind, passage]
      additionalProperties: false
      properties:
        note:
          type: string
          minLength: 1
          description: The manuscript note the passage stands in, by its `relativePath`.
        passage:
          $ref: "#/components/schemas/PassageSelector"
        kind:
          $ref: "#/components/schemas/RevisionKind"
          description: "`replace` puts `proposed` in place of the passage. `delete` takes the passage out. `insert` puts `proposed` right after the passage, which stays."
        proposed:
          type: string
          description: The words proposed. Needed to replace or to insert, and not looked at for a deletion.
        comment:
          type: string
          description: Why the change is proposed, for the author to read on the card.

    RevisionPatch:
      type: object
      description: What to change of a revision. One read and sent back whole is taken, and only these are looked at.
      additionalProperties: false
      x-snowflake-echo: "#/components/schemas/Revision"
      properties:
        proposed:
          type: string
        comment:
          type: string

    StickyNoteCreate:
      type: object
      description: A sticky note to make. Left without a `color`, it takes `macaron-3`, the tint a note made in the plugin starts with.
      additionalProperties: false
      properties:
        body:
          type: string
          description: What the note says, as Markdown.
        color:
          $ref: "#/components/schemas/Color"
        archived:
          type: boolean
          default: false

    StickyNotePatch:
      type: object
      description: What to change of a sticky note. One read and sent back whole is taken, and only these are looked at.
      additionalProperties: false
      x-snowflake-echo: "#/components/schemas/StickyNote"
      properties:
        body:
          type: string
        color:
          $ref: "#/components/schemas/Color"
        archived:
          type: boolean

    SearchPage:
      type: object
      description: "The places some words were found in a project."
      required: [items, total, offset, limit, nextOffset, truncated]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        nextOffset:
          type: [integer, "null"]
        truncated:
          type: boolean
          description: Whether there were more places than a search lists. Narrow the words to see the rest.

    SearchHit:
      type: object
      description: One place the words stand.
      required: [kind, path, relativePath, title, id, step, field, range, line, text, at]
      additionalProperties: false
      properties:
        kind:
          type: string
          description: "`manuscript`, `step`, `character`, `scene`, or the id of a worldbuilding kind."
        path:
          type: string
          description: The note, by its path in the vault.
        relativePath:
          type: string
          description: The same note by where it stands inside its project.
        title:
          type: string
          description: What the note is called.
        id:
          type: [string, "null"]
          description: The `id` of the character, the scene or the worldbuilding note. Null for a manuscript note and for a step's note.
        step:
          type: [integer, "null"]
          description: The step whose note it is. Null for any other note.
        field:
          type: [string, "null"]
          description: Which of the things the note says holds the words, as a JSON Pointer into the note's own reading, such as `/motivation` or `/sections/genre`. Null for a manuscript note, whose whole text is looked in.
        range:
          $ref: "#/components/schemas/TextRange"
          description: Where the words stand in the manuscript note's `body`, or in the text of the field.
        line:
          type: integer
          description: The line of that text the words begin in, counted from 1.
        text:
          type: string
          description: That line as it is written, or the part of a long line around the words.
        at:
          $ref: "#/components/schemas/TextRange"
          description: Where the words stand in `text`.

    ReplaceRequest:
      type: object
      required: [query, replacement]
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 1000
          description: The words to look for, as they are typed. Never an expression.
        replacement:
          type: string
          description: The words to put in their place. Empty takes the words out.
        caseSensitive:
          type: boolean
          default: false
        wholeWord:
          type: boolean
          default: false
        notes:
          type: array
          description: The manuscript notes to change, each by its `relativePath`. Left out, every note of the manuscript.
          items:
            type: string
        dryRun:
          type: boolean
          default: false
          description: Whether to say what would be replaced and write nothing.

    ReplaceResult:
      type: object
      required: [dryRun, replaced, notes, skipped]
      additionalProperties: false
      properties:
        dryRun:
          type: boolean
        replaced:
          type: integer
          description: How many places were changed, or would be.
        notes:
          type: array
          description: The notes changed, or that would be, in reading order.
          items:
            type: object
            required: [relativePath, path, replaced, etag, marksLost]
            additionalProperties: false
            properties:
              relativePath:
                type: string
              path:
                type: string
              replaced:
                type: integer
              etag:
                type: string
                description: The note's version after the change, or as it stands for a dry run.
              marksLost:
                type: object
                description: The marks kept beside the note whose passage the change takes out from under them.
                required: [revisions, occurrences]
                additionalProperties: false
                properties:
                  revisions:
                    type: integer
                  occurrences:
                    type: integer
        skipped:
          type: array
          description: Notes that hold the words and were left as they are.
          items:
            type: object
            required: [relativePath, reason]
            additionalProperties: false
            properties:
              relativePath:
                type: string
              reason:
                type: string
                enum: [read-only, changed]
                description: "`read-only` for a note a newer version of the plugin wrote. `changed` for one the author typed into while the call ran."

    ManuscriptNoteMove:
      type: object
      description: Where the note goes. One of `after` and `position`, and only one.
      additionalProperties: false
      properties:
        after:
          type: string
          minLength: 1
          description: The `relativePath` of the note it should come after.
        position:
          type: string
          enum: [start, end]

    ManuscriptNoteAppend:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          description: The text to put at the end, as Markdown.

    ProjectIssueRepair:
      type: object
      required: [code, path]
      additionalProperties: false
      properties:
        code:
          type: string
          description: The issue's `code`, as `getProjectHealth` gives it.
        path:
          type: string
          description: The issue's `path`, as `getProjectHealth` gives it.
        field:
          type: string
          description: The issue's `field`, where `getProjectHealth` gives one.

    ProjectMigration:
      type: object
      required: [migrated, skipped, health]
      additionalProperties: false
      properties:
        migrated:
          type: integer
        skipped:
          type: integer
          description: Notes passed over because their section markers are damaged. `repairProject` mends those first.
        health:
          $ref: "#/components/schemas/ProjectHealth"

    TimelineCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "\\S"
          maxLength: 200
        binding:
          description: The character, the place or the other note of the world whose story the timeline tells, by its id. Null for none. Never a scene or a time.
          oneOf:
            - $ref: "#/components/schemas/MemberRefInput"
            - type: "null"
        view:
          type: [string, "null"]
          description: The view to show it in, by its `id`. Left out, the view the author last looked at, or the board's first. Null shows it in none.

    TimelinePatch:
      type: object
      description: What to change of a timeline. One read and sent back whole is taken, and only these are looked at.
      additionalProperties: false
      x-snowflake-echo: "#/components/schemas/Timeline"
      properties:
        name:
          type: string
          pattern: "\\S"
          maxLength: 200
        binding:
          oneOf:
            - $ref: "#/components/schemas/MemberRefInput"
            - type: "null"
        pinned:
          type: boolean
          description: Whether this is the timeline pinned to the top of the board. Only one is.

    TimelineRowCreate:
      type: object
      required: [time]
      additionalProperties: false
      properties:
        time:
          $ref: "#/components/schemas/MemberRefInput"
          description: The time note the row is written under, by its id.
        text:
          type: string
          description: What the row says. It may be left out for a row that carries scenes.
        before:
          type: [string, "null"]
          description: The `id` of the row of that time it should stand before. Null or left out, the end.
        scenes:
          type: array
          description: The scenes of the row, each by its id.
          items:
            $ref: "#/components/schemas/MemberRefInput"

    TimelineRowPatch:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
        time:
          $ref: "#/components/schemas/MemberRefInput"
          description: The time to move the row under.
        before:
          type: [string, "null"]
          description: The `id` of the one it should stand before. Null or left out, the end.

    ScenePlacement:
      type: object
      description: Where on a board a scene goes.
      required: [row]
      additionalProperties: false
      properties:
        row:
          type: string
          description: The `id` of the row to put it in.
        before:
          type: [string, "null"]
          description: The `id` of the one it should stand before. Null or left out, the end.

    TimelineViewCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "\\S"
          maxLength: 200
        timelineIds:
          type: array
          description: The timelines it shows, in order, each by its `id`.
          items:
            type: string

    TimelineViewPatch:
      type: object
      description: What to change of a view. One read and sent back whole is taken, and only these are looked at.
      additionalProperties: false
      x-snowflake-echo: "#/components/schemas/TimelineView"
      properties:
        name:
          type: string
          pattern: "\\S"
          maxLength: 200
        timelineIds:
          type: array
          items:
            type: string
        timeOrder:
          type: array
          description: The view's times in the order they are read, each by its id.
          items:
            type: string
        presentation:
          description: How scenes are drawn. Null takes the author's default.
          oneOf:
            - $ref: "#/components/schemas/ScenePresentation"
            - type: "null"
        showSubDescriptions:
          type: boolean
        cardStyle:
          type: [string, "null"]
          enum: [compact, standard, extended, null]
        timesReversed:
          type: boolean

    BeatSheetCreate:
      type: object
      required: [name, templateId]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "\\S"
          maxLength: 200
        templateId:
          type: string
          description: The template to lay it out from, by the `id` `listBeatSheetTemplates` gives.

    BeatSheetPatch:
      type: object
      description: What to change of a beat sheet. One read and sent back whole is taken, and only these are looked at.
      additionalProperties: false
      x-snowflake-echo: "#/components/schemas/BeatSheet"
      properties:
        name:
          type: string
          pattern: "\\S"
          maxLength: 200
        presentation:
          description: How scenes are drawn. Null takes the author's default.
          oneOf:
            - $ref: "#/components/schemas/ScenePresentation"
            - type: "null"
        showSubDescriptions:
          type: boolean
        reversed:
          type: boolean

    ActCreate:
      type: object
      required: [label]
      additionalProperties: false
      properties:
        label:
          type: string
        before:
          type: [string, "null"]
          description: The `id` of the one it should stand before. Null or left out, the end.

    ActPatch:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
        before:
          type: [string, "null"]
          description: The `id` of the one it should stand before. Null or left out, the end.

    BeatCreate:
      type: object
      required: [act, name]
      additionalProperties: false
      properties:
        act:
          type: string
          description: The `id` of the act it belongs to.
        name:
          type: string
          pattern: "\\S"
          maxLength: 200
        description:
          type: string
        before:
          type: [string, "null"]
          description: The `id` of the one it should stand before. Null or left out, the end.

    BeatPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "\\S"
          maxLength: 200
        description:
          type: string
        act:
          type: string
          description: The `id` of the act to move it into.
        before:
          type: [string, "null"]
          description: The `id` of the one it should stand before. Null or left out, the end.

    BeatRowCreate:
      type: object
      required: [beat]
      additionalProperties: false
      properties:
        beat:
          type: string
          description: The `id` of the beat it is written under.
        text:
          type: string
          description: What the row says. It may be left out for a row that carries scenes.
        before:
          type: [string, "null"]
          description: The `id` of the row of that beat it should stand before. Null or left out, the end.
        scenes:
          type: array
          description: The scenes of the row, each by its id.
          items:
            $ref: "#/components/schemas/MemberRefInput"

    BeatRowPatch:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
        beat:
          type: string
          description: The `id` of the beat to move it under.
        before:
          type: [string, "null"]
          description: The `id` of the one it should stand before. Null or left out, the end.

    BeatSheetTemplateSave:
      type: object
      required: [beatSheet, name]
      additionalProperties: false
      properties:
        beatSheet:
          type: string
          description: The `id` of the beat sheet whose acts and beats are kept.
        name:
          type: string
          pattern: "\\S"
          maxLength: 200
        description:
          type: string

    FreeformViewCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "\\S"
          maxLength: 200

    FreeformViewPatch:
      type: object
      description: What to change of a view. One read and sent back whole is taken, and only its name is looked at.
      additionalProperties: false
      x-snowflake-echo: "#/components/schemas/FreeformView"
      properties:
        name:
          type: string
          pattern: "\\S"
          maxLength: 200

    FreeformResourceInput:
      description: What a card shows. A note of the project or one of its records by its id, a file by where it stands inside the project, a web address, or words of the card's own.
      oneOf:
        - type: object
          required: [type, member]
          additionalProperties: false
          properties:
            type:
              const: entity
            member:
              $ref: "#/components/schemas/MemberRefInput"
        - type: object
          required: [type, id]
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [task, foreshadowing, revision, sticky-note]
            id:
              type: string
        - type: object
          required: [type, relativePath]
          additionalProperties: false
          properties:
            type:
              const: file
            relativePath:
              type: string
        - type: object
          required: [type, url]
          additionalProperties: false
          properties:
            type:
              const: link
            url:
              type: string
            label:
              type: string
        - type: object
          required: [type, text]
          additionalProperties: false
          properties:
            type:
              const: text
            text:
              type: string

    FreeformStep:
      description: |
        One thing done to a view. `do` says which. Every new card, frame and
        line is kept under an id the plugin makes for it. A step may give one
        a name of the caller's own in `id`, so that a later step of the same
        call can speak of it. The name holds for that call alone, and the
        answer says which id each was given.
      oneOf:
        - type: object
          description: Cards put on the view.
          required: [do, placements]
          additionalProperties: false
          properties:
            do:
              const: add
            placements:
              type: array
              minItems: 1
              items:
                type: object
                required: [resource, x, y]
                additionalProperties: false
                properties:
                  id:
                    type: string
                  resource:
                    $ref: "#/components/schemas/FreeformResourceInput"
                  x:
                    type: number
                  y:
                    type: number
                  width:
                    type: number
                  height:
                    type: number
                  frameId:
                    type: [string, "null"]
        - type: object
          description: Frames drawn on the view.
          required: [do, frames]
          additionalProperties: false
          properties:
            do:
              const: add-frames
            frames:
              type: array
              minItems: 1
              items:
                type: object
                required: [title, x, y, width, height]
                additionalProperties: false
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  color:
                    oneOf:
                      - $ref: "#/components/schemas/Color"
                      - type: "null"
                  x:
                    type: number
                  y:
                    type: number
                  width:
                    type: number
                  height:
                    type: number
        - type: object
          description: Lines drawn between cards or frames.
          required: [do, edges]
          additionalProperties: false
          properties:
            do:
              const: connect
            edges:
              type: array
              minItems: 1
              items:
                type: object
                required: [source, target]
                additionalProperties: false
                properties:
                  id:
                    type: string
                  source:
                    type: string
                  target:
                    type: string
                  label:
                    type: string
                  arrow:
                    type: string
                    enum: [none, start, end, both]
                  line:
                    type: string
                    enum: [solid, dashed, dotted, dash-dot]
        - type: object
          description: Cards and frames moved, or given another size.
          required: [do, places]
          additionalProperties: false
          properties:
            do:
              const: place
            places:
              type: array
              minItems: 1
              items:
                type: object
                required: [id, x, y]
                additionalProperties: false
                properties:
                  id:
                    type: string
                  x:
                    type: number
                  y:
                    type: number
                  width:
                    type: number
                  height:
                    type: number
                  frameId:
                    type: [string, "null"]
        - type: object
          description: The words of a text card changed.
          required: [do, id, text]
          additionalProperties: false
          properties:
            do:
              const: text
            id:
              type: string
            text:
              type: string
        - type: object
          description: A frame given another title or tint.
          required: [do, id]
          additionalProperties: false
          properties:
            do:
              const: edit-frame
            id:
              type: string
            title:
              type: string
            color:
              oneOf:
                - $ref: "#/components/schemas/Color"
                - type: "null"
        - type: object
          description: Lines given another label, arrow or stroke.
          required: [do, edits]
          additionalProperties: false
          properties:
            do:
              const: edit-edges
            edits:
              type: array
              minItems: 1
              items:
                type: object
                required: [id]
                additionalProperties: false
                properties:
                  id:
                    type: string
                  label:
                    type: string
                  arrow:
                    type: string
                    enum: [none, start, end, both]
                  line:
                    type: string
                    enum: [solid, dashed, dotted, dash-dot]
        - type: object
          description: |
            Cards, frames and lines taken off the view. Needs the delete level.
            A note or a record a card showed stands. The words of a text card
            and the address of a link card go with the card.
          required: [do]
          additionalProperties: false
          properties:
            do:
              const: delete
            nodes:
              type: array
              description: Cards and frames, each by its `id`.
              items:
                type: string
            edges:
              type: array
              items:
                type: string

    FreeformSteps:
      type: object
      required: [steps]
      additionalProperties: false
      properties:
        steps:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/FreeformStep"

    ImportSource:
      type: object
      required: [sourceProjectId]
      additionalProperties: false
      properties:
        sourceProjectId:
          type: string
          minLength: 1
          description: The `id` of the project to bring things in from. An archived project can be one.

    ImportInspection:
      type: object
      description: What another project holds that this one could take.
      required: [source, parts, gone]
      additionalProperties: false
      properties:
        source:
          $ref: "#/components/schemas/ProjectSummary"
        parts:
          type: array
          description: Everything the other project has to bring, in the order its own screens list it.
          items:
            $ref: "#/components/schemas/ImportPart"
        gone:
          type: array
          description: Copies brought before whose part the other project no longer has.
          items:
            type: object
            required: [kind, name, path]
            additionalProperties: false
            properties:
              kind:
                type: string
              name:
                type: string
              path:
                type: [string, "null"]

    ImportRun:
      type: object
      required: [sourceProjectId, parts]
      additionalProperties: false
      properties:
        sourceProjectId:
          type: string
          minLength: 1
        parts:
          type: array
          description: What to bring, each by the `key` the inspection gave.
          minItems: 1
          items:
            type: string
        onClash:
          type: string
          enum: [skip, replace]
          default: skip
          description: What to do where this project already has the part. `skip` leaves what stands. `replace` writes the other project's over a copy brought before.

    ImportReport:
      type: object
      required: [source, created, replaced, skipped, failed, droppedLinks, pictures, kindsCreated]
      additionalProperties: false
      properties:
        source:
          type: object
          required: [id, title]
          additionalProperties: false
          properties:
            id:
              type: string
            title:
              type: string
        created:
          type: array
          items:
            $ref: "#/components/schemas/ImportReportItem"
        replaced:
          type: array
          items:
            $ref: "#/components/schemas/ImportReportItem"
        skipped:
          type: array
          items:
            type: object
            required: [key, kind, name, targetName, path, reason]
            additionalProperties: false
            properties:
              key:
                type: string
              kind:
                type: string
              name:
                type: string
                description: What it is called in the project it comes from.
              targetName:
                type: string
                description: What its copy is called here.
              path:
                type: [string, "null"]
                description: Where its copy stands in the vault, for what is kept as a note or a file.
              reason:
                type: string
                enum: [name-taken, file-name-taken, unchanged, no-chapter]
                description: "`no-chapter` for a mark whose manuscript note was not brought."
        failed:
          type: array
          items:
            type: object
            required: [key, kind, name, targetName, path, detail]
            additionalProperties: false
            properties:
              key:
                type: string
              kind:
                type: string
              name:
                type: string
                description: What it is called in the project it comes from.
              targetName:
                type: string
                description: What its copy is called here.
              path:
                type: [string, "null"]
                description: Where its copy stands in the vault, for what is kept as a note or a file.
              detail:
                type: string
                description: What went wrong, as the plugin's own report tells the author.
        droppedLinks:
          type: array
          description: Links a copy could not keep, because what they point at was not brought.
          items:
            type: object
            required: [owner, field, target]
            additionalProperties: false
            properties:
              owner:
                $ref: "#/components/schemas/ImportReportItem"
              field:
                type: string
              target:
                type: string
                description: What the link named in the other project.
        pictures:
          type: object
          required: [landed, reused]
          additionalProperties: false
          properties:
            landed:
              type: integer
            reused:
              type: integer
        kindsCreated:
          type: array
          description: Kinds of worldbuilding this project was given so their notes could be brought.
          items:
            type: string

    ImportReportItem:
      type: object
      required: [key, kind, name, targetName, path]
      additionalProperties: false
      properties:
        key:
          type: string
        kind:
          type: string
        name:
          type: string
          description: What it is called in the project it comes from.
        targetName:
          type: string
          description: What its copy is called here.
        path:
          type: [string, "null"]
          description: Where its copy stands in the vault, for what is kept as a note or a file.

    ManuscriptExport:
      type: object
      description: What to export and how. Everything left out is as the author has it in the plugin's settings.
      additionalProperties: false
      properties:
        note:
          type: string
          description: One manuscript note to export, by its `relativePath`. Left out, the whole manuscript.
        folder:
          type: string
          description: A folder below the author's export folder to write into, named from inside it. Left out, the export folder itself.
        format:
          type: string
          enum: [md, txt]
          description: The ending of the files' names. The text is the same in both.
        layout:
          type: string
          enum: [single, folder]
          description: One file for the whole manuscript, or one file a note in a folder.
        separator:
          type: string
          enum: [blank, rule, asterisks]
          description: What stands between two notes in a single file.
        indent:
          type: boolean
          description: Whether each paragraph begins with the indent of the project's language.
        paragraphSpacing:
          type: boolean
          description: Whether the blank lines between paragraphs are kept.
        overwrite:
          type: boolean
          default: false
          description: Whether a file that already stands is written over.

    CanvasExport:
      type: object
      required: [board, id]
      additionalProperties: false
      properties:
        board:
          type: string
          enum: [freeform, timeline, beat-sheet]
        id:
          type: string
          description: The `id` of the freeform view, the view of the timelines or the beat sheet.
        overwrite:
          type: boolean
          default: false
          description: Whether a canvas that stands there and says something else is written over.

    ExportResult:
      type: object
      required: [written, unchanged]
      additionalProperties: false
      properties:
        written:
          type: array
          description: The files written, each by its path in the vault.
          items:
            type: string
        unchanged:
          type: array
          description: Files that already said what would have been written, and were left as they are.
          items:
            type: string

    GalleryAdd:
      type: object
      required: [paths]
      additionalProperties: false
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 50
          description: Pictures already in the vault, each by its path there.
          items:
            type: string
        main:
          type: string
          description: The picture a card shows for the note, by its path. One of those sent, or one the gallery has.

    Gallery:
      type: object
      required: [member, pictures, untrashed]
      additionalProperties: false
      properties:
        member:
          $ref: "#/components/schemas/MemberRef"
        pictures:
          type: array
          description: The pictures of the gallery, in the author's order.
          items:
            type: object
            required: [link, path, main]
            additionalProperties: false
            properties:
              link:
                type: string
                description: The link as the note keeps it.
              path:
                type: [string, "null"]
                description: Where the picture stands in the vault now. Null where its file is gone.
              main:
                type: boolean
                description: Whether this is the picture a card shows for the note.
        untrashed:
          type: array
          description: Pictures taken off that could not be sent to the trash, each by its file's name. They stand where they were.
          items:
            type: string

    Settings:
      type: object
      description: The author's settings that change what the API answers.
      required: [counting, chapterNumbering, dailyGoals, sessionScope, session, dialogueMarks, sensitiveWords, export]
      additionalProperties: false
      properties:
        counting:
          $ref: "#/components/schemas/Counting"
        chapterNumbering:
          type: object
          required: [style]
          additionalProperties: false
          properties:
            style:
              type: string
              description: "`off`, or the name of the style new chapters are numbered in."
        dailyGoals:
          type: object
          required: [project, manuscript, scope]
          additionalProperties: false
          properties:
            project:
              type: integer
              description: The words the author means to write in a day, counted over the whole project.
            manuscript:
              type: integer
              description: The same, counted in the manuscript alone.
            scope:
              $ref: "#/components/schemas/WritingScope"
              description: Which of the two the day's goal is held against.
        sessionScope:
          $ref: "#/components/schemas/WritingScope"
          description: Which notes a session's words are counted in as the author is shown them.
        session:
          type: object
          description: What a session starts as where a call does not say.
          required: [type, writingMode, countdownMinutes, pomodoroWorkMinutes, pomodoroBreakMinutes, pomodoroAutoRepeat]
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [stopwatch, countdown, pomodoro]
            writingMode:
              $ref: "#/components/schemas/WritingMode"
            countdownMinutes:
              type: integer
            pomodoroWorkMinutes:
              type: integer
            pomodoroBreakMinutes:
              type: integer
            pomodoroAutoRepeat:
              type: boolean
        dialogueMarks:
          type: array
          description: The pairs of quotation marks dialogue is read by.
          items:
            $ref: "#/components/schemas/QuotationMarks"
        sensitiveWords:
          type: array
          description: The words and phrases the author watches for.
          items:
            type: string
        export:
          type: object
          description: How the manuscript is exported where a call does not say.
          required: [folder, format, layout, separator, indent, paragraphSpacing]
          additionalProperties: false
          properties:
            folder:
              type: string
              description: The folder exports go into, as a path in the vault.
            format:
              type: string
              enum: [md, txt]
            layout:
              type: string
              enum: [single, folder]
            separator:
              type: string
              enum: [blank, rule, asterisks]
            indent:
              type: boolean
            paragraphSpacing:
              type: boolean

    SettingsPatch:
      type: object
      description: What to change of the settings. Read and sent back whole they are taken, and only these are looked at.
      additionalProperties: false
      x-snowflake-echo: "#/components/schemas/Settings"
      properties:
        counting:
          type: object
          additionalProperties: false
          properties:
            mode:
              type: string
              enum: [jinjiang, chenggua, qidian, ms-word]
            headings:
              type: string
              enum: [count, skip-first-h1, skip-h1, skip-all]
        dailyGoals:
          type: object
          additionalProperties: false
          properties:
            project:
              type: integer
              minimum: 0
              maximum: 1000000
            manuscript:
              type: integer
              minimum: 0
              maximum: 1000000
            scope:
              $ref: "#/components/schemas/WritingScope"
        sessionScope:
          $ref: "#/components/schemas/WritingScope"
        sensitiveWords:
          type: array
          description: The whole list, as it should stand. Each a word or a phrase of one line.
          maxItems: 2000
          items:
            type: string

    WritingSessionStart:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [stopwatch, countdown, pomodoro]
          description: Left out, the type the author starts with.
        writingMode:
          $ref: "#/components/schemas/WritingMode"
        minutes:
          type: integer
          minimum: 5
          maximum: 180
          description: How long a countdown runs. Left out, the author's own length. Only a countdown takes one.

    MentionIgnore:
      type: object
      required: [id, scope, words, member, note, ordinal]
      additionalProperties: false
      properties:
        id:
          type: string
        scope:
          type: string
          enum: [manuscript, note, occurrence]
          description: "`manuscript`: the words are no mention of that note anywhere. `note`: nor in one manuscript note. `occurrence`: one place in a note is no mention at all."
        words:
          type: string
          description: The words that are not to be marked.
        member:
          description: The note they are not a mention of. Null for a rule about one place.
          oneOf:
            - $ref: "#/components/schemas/MemberRef"
            - type: "null"
        note:
          description: The manuscript note the rule holds in. Null for the whole manuscript.
          oneOf:
            - $ref: "#/components/schemas/ManuscriptNoteRef"
            - type: "null"
        ordinal:
          type: [integer, "null"]
          description: For a rule about one place, which of the note's places with those words it is, counted from 0.

    MentionIgnoreList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MentionIgnore"

    MentionIgnoreCreate:
      type: object
      required: [scope, words]
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [manuscript, note, occurrence]
        words:
          type: string
          minLength: 1
          description: The words, letter for letter as `listNoteMentions` tells them.
        member:
          $ref: "#/components/schemas/MemberRefInput"
          description: The note the words are no mention of. Needed for `manuscript` and `note`.
        note:
          type: string
          description: The manuscript note the rule holds in, by its `relativePath`. Needed for `note` and `occurrence`.
        ordinal:
          type: integer
          minimum: 0
          description: Which of the note's places with those words is meant, counted from 0. Needed for `occurrence`.

    TimelineRowCreated:
      type: object
      required: [id, timeline]
      additionalProperties: false
      properties:
        id:
          type: string
          description: The `id` the new row was given.
        timeline:
          $ref: "#/components/schemas/Timeline"

    TimelineViewCreated:
      type: object
      required: [id, board]
      additionalProperties: false
      properties:
        id:
          type: string
          description: The `id` the new view was given.
        board:
          $ref: "#/components/schemas/TimelineBoard"

    BeatSheetPartCreated:
      type: object
      required: [id, beatSheet]
      additionalProperties: false
      properties:
        id:
          type: string
          description: The `id` the new act, beat or row was given.
        beatSheet:
          $ref: "#/components/schemas/BeatSheet"

    FreeformStepsResult:
      type: object
      required: [view, created]
      additionalProperties: false
      properties:
        view:
          $ref: "#/components/schemas/FreeformView"
        created:
          type: array
          description: What the steps put on the view, in the order they put it.
          items:
            type: object
            required: [kind, id, as]
            additionalProperties: false
            properties:
              kind:
                type: string
                enum: [placement, frame, edge]
              id:
                type: string
                description: The `id` it is kept under.
              as:
                type: [string, "null"]
                description: The name the call gave it, where it gave one.

    ImportPart:
      type: object
      description: One thing a project has to bring.
      required: [key, kind, name, group, selectedByDefault, requires, links, state, target]
      additionalProperties: false
      properties:
        key:
          type: string
          description: What `runImport` names the part by.
        kind:
          type: string
          description: "`step`, `character`, `scene`, `worldbuilding`, `vocabulary`, `custom-field-template`, `picture`, `chapter`, `task`, `foreshadowing`, `revision`, `sticky-note`, `freeform-view`, `timeline`, `beat-sheet` or `beat-sheet-template`."
        name:
          type: string
        group:
          type: [string, "null"]
          description: "`character`, `scene` or the worldbuilding kind the part belongs to. Null for the rest."
        selectedByDefault:
          type: boolean
          description: Whether the plugin's own dialog has it ticked from the start. The manuscript and what is marked in it are not.
        requires:
          type: array
          description: Parts brought along whenever this one is, each by its `key`.
          items:
            type: string
        links:
          type: array
          description: Parts this one points at, each by its `key`. A link to a part that is not brought is dropped from the copy.
          items:
            type: string
        state:
          type: string
          enum: [new, existing, unchanged, update, conflict]
          description: "`new` where this project has nothing like it. `existing` for a namesake that was not brought from there. For a copy brought before: `unchanged`, `update` where the other project changed it since, `conflict` where this one did."
        target:
          description: What stands here already, for every state but `new`.
          oneOf:
            - type: object
              required: [name, path]
              additionalProperties: false
              properties:
                name:
                  type: string
                path:
                  type: [string, "null"]
            - type: "null"

    MentionIgnoreAdded:
      type: object
      required: [id, items]
      additionalProperties: false
      properties:
        id:
          type: string
          description: The `id` of the rule that was asked for.
        items:
          type: array
          items:
            $ref: "#/components/schemas/MentionIgnore"

x-snowflake-problems:
  invalid-request:
    status: 400
    title: The call does not match the contract.
  unauthorized:
    status: 401
    title: The call carries no valid access token.
  access-denied:
    status: 403
    title: The author's access level does not allow this operation.
  forbidden-origin:
    status: 403
    title: Calls from a web page are refused.
  cli-bridge-off:
    status: 403
    title: The command line bridge is switched off in the plugin's settings.
  not-found:
    status: 404
    title: Nothing stands at that address.
  unknown-operation:
    status: 404
    title: The API has no such operation.
  method-not-allowed:
    status: 405
    title: The address does not take that method.
  ambiguous-project:
    status: 409
    title: Two projects carry that id.
  path-conflict:
    status: 409
    title: Something else already stands where this would go.
  read-only:
    status: 409
    title: A newer version of the plugin wrote this, and this one may not change it.
  invalid-managed-document:
    status: 409
    title: A note the operation needs is damaged.
  unsafe-section:
    status: 409
    title: The note's section markers are damaged, so the section cannot be written safely.
  duplicate-name:
    status: 409
    title: Something of that kind already goes by that name.
  project-archived:
    status: 409
    title: The project stands in the archive, where it can be read and restored and nothing else.
  not-archived:
    status: 409
    title: The project does not stand in the archive.
  archive-folder-is-project:
    status: 409
    title: The folder archived projects go into is itself a project.
  step-prerequisites-incomplete:
    status: 409
    title: The steps this one rests on are not complete.
  in-use:
    status: 409
    title: Other notes name it.
  built-in-kind:
    status: 409
    title: That is one of the kinds every project has, and cannot be changed so.
  kind-limit-reached:
    status: 409
    title: The project holds as many kinds as it can.
  nothing-to-merge:
    status: 409
    title: No manuscript note stands after that one.
  overlapping-revision:
    status: 409
    title: Another revision already stands over part of that passage.
  link-updates-ask:
    status: 409
    title: Obsidian is set to ask before it updates links, so nothing is renamed here.
  concurrent-change:
    status: 412
    title: The note has changed since it was read.
  payload-too-large:
    status: 413
    title: The body is larger than the API accepts.
  unsupported-media-type:
    status: 415
    title: The body must be JSON.
  wrong-host:
    status: 421
    title: The call names a host this listener does not answer for.
  invalid-step-status:
    status: 422
    title: That step cannot be given that status.
  invalid-name:
    status: 422
    title: That is not a name a file or folder can have.
  invalid-segment:
    status: 422
    title: A part of the path is not a name a vocabulary word can have.
  too-deep:
    status: 422
    title: The path has more levels than a vocabulary can have.
  unknown-vocabulary-node:
    status: 422
    title: The vocabulary has no such word.
  invalid-reference:
    status: 422
    title: An id names no note of the kind it should.
  invalid-time-span:
    status: 422
    title: A period needs both its ends, or neither.
  duplicate-field-title:
    status: 422
    title: Two of the fields share a title.
  passage-not-found:
    status: 422
    title: The note does not say those words.
  ambiguous-passage:
    status: 422
    title: The note says those words in more than one place.
  precondition-required:
    status: 428
    title: The change must say which version of the note it is made against.
  not-repairable:
    status: 409
    title: This is not something the plugin can mend by itself.
  view-full:
    status: 409
    title: The view has no room for that.
  import-refused:
    status: 409
    title: Nothing can be brought in between these two projects.
  session-running:
    status: 409
    title: A writing session is already under way.
  internal-error:
    status: 500
    title: The operation failed.
  project-creation-interrupted:
    status: 500
    title: The project was begun and could not be finished.
  planned-operation:
    status: 501
    title: The operation is planned and not answered by this build.
  not-ready:
    status: 503
    title: Obsidian is still reading the vault.
  busy:
    status: 503
    title: Too many calls are waiting.
  leaving:
    status: 503
    title: Obsidian is closing or the plugin is being switched off.
