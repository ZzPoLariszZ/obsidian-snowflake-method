      responses:
        "200":
          description: The health of the project after the repair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectHealth"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/migrate:
    parameters:
