      responses:
        "201":
          description: The thread that was made.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Foreshadowing"
        default:
          $ref: "#/components/responses/Problem"

  /projects/{projectId}/foreshadowing/{foreshadowingId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ForeshadowingId"
    get:
      operationId: getForeshadowing
      tags: [Foreshadowing]
      summary: Get one foreshadowing thread
      description: |
        One thread with each place it appears in the manuscript, in reading
        order.
      x-snowflake-access: read
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document]
      responses:
        "200":
          description: The thread.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Foreshadowing"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateForeshadowing
      tags: [Foreshadowing]
      summary: Change a foreshadowing thread
      description: |
        Changes a thread's name, what it is, how it stands and the notes it
        is about. The places it appears are changed one by one, with their own
        operations.
      x-snowflake-access: write
      x-snowflake-availability: { status: available, round: 1 }
      x-snowflake-tier: extended
      x-snowflake-errors: [not-found, ambiguous-project, invalid-managed-document, read-only, project-archived, duplicate-name, invalid-reference]
      requestBody:
